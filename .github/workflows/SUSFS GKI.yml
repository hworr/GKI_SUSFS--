name: SukiSU Kernel Build (GKI Fixed)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      kernelsu_variant:
        required: true
        type: string
      kernelsu_branch:
        required: true
        type: string
      kernelsu_branch_other:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_CPP2: "yes"

    steps:
      # --------------------------------------------------
      # SPACE + TOOLS
      # --------------------------------------------------
      - name: Maximize build space
        uses: easimon/maximize-build-space@master

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl python3 ccache clang lld llvm

      # --------------------------------------------------
      # CCACHE
      # --------------------------------------------------
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}
          restore-keys: |
            ccache-${{ inputs.android_version }}-${{ inputs.kernel_version }}-
            ccache-${{ inputs.android_version }}-
            ccache-

      - name: Setup ccache
        run: |
          ccache --max-size=10G
          ccache --set-config=compression=true
          ccache --zero-stats

      # --------------------------------------------------
      # REPO-WORKSPACE CACHEN
      # --------------------------------------------------
      - name: Restore kernel repo workspace
        id: repo-cache
        uses: actions/cache@v4
        with:
          path: |
            .repo
            common
          key: repo-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}
          
      - name: Init & sync kernel repo (if cache miss)
        if: steps.repo-cache.outputs.cache-hit != 'true'
        run: |
          set -e

          # Android 'repo' Tool holen und vorbereiten
          REPO_BIN="$HOME/bin/repo"
          mkdir -p "$HOME/bin"
          curl -o "$REPO_BIN" https://storage.googleapis.com/git-repo-downloads/repo
          chmod a+x "$REPO_BIN"

          REPO="$REPO_BIN"
          FORMATTED_BRANCH="android15-6.6-2025-09"

          echo "==> repo init"
          "$REPO" init -u https://android.googlesource.com/kernel/manifest \
            -b common-${FORMATTED_BRANCH}

          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          if grep -q deprecated <<< "$REMOTE_BRANCH"; then
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" "$DEFAULT_MANIFEST_PATH"
          fi

          echo "==> repo sync"
          "$REPO" sync -j"$(nproc --all)" --fail-fast

      - name: Verify kernel repo workspace
        run: |
          set -e
          if [ ! -d common ]; then
            echo "common/ directory not found after repo restore/sync"
            exit 1
          fi
          if [ ! -d .repo ]; then
            echo ".repo/ directory not found after repo restore/sync"
            exit 1
          fi
          echo "✓ Kernel repo workspace ready (from cache or fresh sync)"

      # --------------------------------------------------
      # DEPENDENCIES
      # --------------------------------------------------
      - name: Clone SUSFS + AnyKernel3
        run: |
          git clone https://github.com/ShirkNeko/susfs4ksu.git -b gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}
          git clone https://github.com/MiRinChan/AnyKernel3.git

      # --------------------------------------------------
      # KERNELSU BRANCH
      # --------------------------------------------------
      - name: Determine KernelSU branch
        run: |
          if [[ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]]; then
            if [[ "${{ inputs.kernelsu_branch }}" == "Other" ]]; then
              echo "BRANCH=${{ inputs.kernelsu_branch_other }}" >> $GITHUB_ENV
            else
              echo "BRANCH=builtin" >> $GITHUB_ENV
            fi
          fi

      # --------------------------------------------------
      # KERNELSU (SUKISU)
      # --------------------------------------------------
      - name: Add SukiSU
        if: ${{ inputs.kernelsu_variant == 'SukiSU' }}
        run: |
          curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s "$BRANCH"

      # --------------------------------------------------
      # SUSFS (PATCH ONLY – NO DEFCONFIG)
      # --------------------------------------------------
      - name: Apply SUSFS core patch
        working-directory: common
        run: |
          set -e
          PATCH="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"
          patch -p1 < "$PATCH" || true
          rm -f fs/proc/*.rej || true

      - name: Copy SUSFS files
        run: |
          cp susfs4ksu/kernel_patches/fs/* common/fs/
          cp susfs4ksu/kernel_patches/include/linux/* common/include/linux/

      # --------------------------------------------------
      # SELINUX HEADERS FIX
      # --------------------------------------------------
      - name: Guard SELinux headers in KernelSU
        run: |
          set -e
          
          # Alle relevanten Dateien finden, in denen die Includes vorkommen
          files=$(grep -rl "security/selinux/include/security.h" common 2>/dev/null || true)
          files+=" "$(grep -rl "security/selinux/include/objsec.h" common 2>/dev/null || true)

          for f in $files; do
            echo "Patching SELinux includes in $f"
            sed -i \
              's|#include <security/selinux/include/security.h>|#if IS_ENABLED(CONFIG_SECURITY_SELINUX)\n#include <security/selinux/include/security.h>\n#endif|' \
              "$f" || true

            sed -i \
              's|#include <security/selinux/include/objsec.h>|#if IS_ENABLED(CONFIG_SECURITY_SELINUX)\n#include <security/selinux/include/objsec.h>\n#endif|' \
              "$f" || true
          done

          echo "✓ KernelSU SELinux headers guarded"

      # --------------------------------------------------
      # GKI DEFCONFIG MERGE
      # --------------------------------------------------
      - name: Merge kernel config (GKI safe)
        run: |
          set -e
          DEFCONFIG=common/arch/arm64/configs/gki_defconfig
          MERGE=common/scripts/kconfig/merge_config.sh
          chmod +x "$MERGE"
      
          cat > /tmp/gki_nethunter.config << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_KPROBES_HOOK=n
      
          CONFIG_SUSFS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_SUSFS_PROC=y
          CONFIG_SUSFS_MAGIC_MOUNT=y
          CONFIG_SUSFS_AUTO_BIND=y
          CONFIG_SUSFS_SUS_PATH=y
      
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
      
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_NET_DRIVERS=y
          CONFIG_USB_RNDIS_HOST=m
          CONFIG_USB_NET_CDC_ECM=m
          CONFIG_USB_NET_CDC_NCM=m
          CONFIG_USB_HID=m
          CONFIG_USB_HIDDEV=y
      
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
      
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_DEFAULT_BBR=y
          
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
      
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=n
          CONFIG_TCP_CONG_HTCP=n
      
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          EOF
              
          "$MERGE" -m "$DEFCONFIG" /tmp/gki_nethunter.config
          cp .config "$DEFCONFIG"

      - name: Sync gki_defconfig (remove baseband guard)
        run: |
          set -e
          cd common

          rm -rf security/baseband-guard || true
          sed -i '/baseband_guard/d' security/Kconfig || true
          sed -i '/CONFIG_BBG/d' arch/arm64/configs/gki_defconfig || true

          make ARCH=arm64 savedefconfig
          cp defconfig arch/arm64/configs/gki_defconfig

          echo "✓ gki_defconfig synced"

      # --------------------------------------------------
      # BUILD
      # --------------------------------------------------
      - name: Build with retry (keepalive)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 90
          max_attempts: 2
          retry_on: timeout
          command: |
            cd "$GITHUB_WORKSPACE"
            
            # -----------------------------
            # Keepalive gegen GitHub Timeout
            # -----------------------------
            start_keepalive() {
              ( while sleep 300; do
                  echo "[keepalive] build still running at $(date -u)"
                done ) &
              KEEPALIVE_PID=$!
              echo "Keepalive started with PID: $KEEPALIVE_PID"
            }
            
            stop_keepalive() {
              if [ -n "${KEEPALIVE_PID:-}" ] && kill -0 "$KEEPALIVE_PID" 2>/dev/null; then
                echo "Stopping keepalive (PID: $KEEPALIVE_PID)"
                kill "$KEEPALIVE_PID" 2>/dev/null || true
                wait "$KEEPALIVE_PID" 2>/dev/null || true
              fi
            }
            
            # Ensure cleanup happens on any exit
            trap stop_keepalive EXIT INT TERM
            
            start_keepalive
            
            # -----------------------------
            # Build-Config Fixes
            # -----------------------------
            set -e  # Enable exit on error after trap is set
            
            sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64 || true
            sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' common/build.config.gki.aarch64 || true
            sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' common/build.config.gki.aarch64 || true
            
            # -----------------------------
            # Build
            # -----------------------------
            if [ -f "build/build.sh" ]; then
              LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 \
                build/build.sh CC="/usr/bin/ccache clang"
            else
              tools/bazel build --config=fast //common:kernel_aarch64_dist
            fi
            
            echo "Build completed successfully"

      # --------------------------------------------------
      # CCACHE STATS
      # --------------------------------------------------
      - name: Show ccache stats
        run: ccache --show-stats

      # --------------------------------------------------
      # PACKAGE
      # --------------------------------------------------
      - name: Package AnyKernel3
        run: |
          set -e

          # Versuche zuerst out/*/dist/Image, ansonsten Bazel-Ausgabe
          IMG=$(ls out/*/dist/Image 2>/dev/null || ls bazel-bin/common/kernel_aarch64/Image)

          echo "Using kernel image: $IMG"
          cp "$IMG" AnyKernel3/Image

          cd AnyKernel3
          zip -r ../kernel.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: kernel.zip
