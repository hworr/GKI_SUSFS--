name: SukiSU Kernel Build (GKI Fixed)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      kernelsu_variant:
        required: true
        type: string
      kernelsu_branch:
        required: true
        type: string
      kernelsu_branch_other:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_CPP2: "yes"

    steps:
      # --------------------------------------------------
      # SPACE + TOOLS
      # --------------------------------------------------
      - name: Maximize build space
        uses: easimon/maximize-build-space@master

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl python3 ccache clang lld llvm

      # --------------------------------------------------
      # CCACHE
      # --------------------------------------------------
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}
          restore-keys: |
            ccache-${{ inputs.android_version }}-${{ inputs.kernel_version }}-
            ccache-${{ inputs.android_version }}-
            ccache-

      - name: Setup ccache
        run: |
          ccache --max-size=10G
          ccache --set-config=compression=true
          ccache --zero-stats

      # --------------------------------------------------
      # REPO-WORKSPACE CACHEN
      # --------------------------------------------------
      - name: Restore kernel repo workspace
        id: repo-cache
        uses: actions/cache@v4
        with:
          path: |
            .repo
            common
          key: repo-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}
          
      - name: Init & sync kernel repo (if cache miss)
        if: steps.repo-cache.outputs.cache-hit != 'true'
        run: |
          set -e

          # Android 'repo' Tool holen und vorbereiten
          REPO_BIN="$HOME/bin/repo"
          mkdir -p "$HOME/bin"
          curl -o "$REPO_BIN" https://storage.googleapis.com/git-repo-downloads/repo
          chmod a+x "$REPO_BIN"

          REPO="$REPO_BIN"
          FORMATTED_BRANCH="android15-6.6-2025-09"

          echo "==> repo init"
          "$REPO" init -u https://android.googlesource.com/kernel/manifest \
            -b common-${FORMATTED_BRANCH}

          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          if grep -q deprecated <<< "$REMOTE_BRANCH"; then
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" "$DEFAULT_MANIFEST_PATH"
          fi

          echo "==> repo sync"
          "$REPO" sync -j"$(nproc --all)" --fail-fast

      - name: Verify kernel repo workspace
        run: |
          set -e
          if [ ! -d common ]; then
            echo "common/ directory not found after repo restore/sync"
            exit 1
          fi
          if [ ! -d .repo ]; then
            echo ".repo/ directory not found after repo restore/sync"
            exit 1
          fi
          echo "✓ Kernel repo workspace ready (from cache or fresh sync)"

      # --------------------------------------------------
      # DEPENDENCIES
      # --------------------------------------------------
      - name: Clone SUSFS + AnyKernel3
        run: |
          git clone https://github.com/ShirkNeko/susfs4ksu.git -b gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}
          git clone https://github.com/MiRinChan/AnyKernel3.git

      # --------------------------------------------------
      # KERNELSU BRANCH
      # --------------------------------------------------
      - name: Determine KernelSU branch
        run: |
          if [[ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]]; then
            if [[ "${{ inputs.kernelsu_branch }}" == "Other" ]]; then
              echo "BRANCH=${{ inputs.kernelsu_branch_other }}" >> $GITHUB_ENV
            else
              echo "BRANCH=builtin" >> $GITHUB_ENV
            fi
          fi

      # --------------------------------------------------
      # KERNELSU (SUKISU)
      # --------------------------------------------------
      - name: Add SukiSU
        if: ${{ inputs.kernelsu_variant == 'SukiSU' }}
        run: |
          curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s "$BRANCH"

      # --------------------------------------------------
      # FLASK.H FÜR KERNELSU
      # --------------------------------------------------
      - name: Create flask.h for KernelSU
        run: |
          set -e
          HEADER_DIR="common/security/selinux/include"
          
          # Prüfe ob flask.h bereits existiert
          if [ -f "$HEADER_DIR/flask.h" ]; then
            echo "✓ flask.h already present"
            exit 0
          fi
          
          echo "Creating flask.h for KernelSU..."
          mkdir -p "$HEADER_DIR"
          
          cat > "$HEADER_DIR/flask.h" << 'EOF'
          /* Flask definitions for KernelSU */
          #ifndef _SELINUX_FLASK_H_
          #define _SELINUX_FLASK_H_

          #define SECCLASS_PROCESS                                1
          #define SECCLASS_SYSTEM                                 2
          #define SECCLASS_SECURITY                               3
          #define SECCLASS_CAPABILITY                             4
          #define SECCLASS_FILE                                   5
          #define SECCLASS_DIR                                    6
          #define SECCLASS_FD                                     7
          #define SECCLASS_LNK_FILE                               8
          #define SECCLASS_CHR_FILE                               9
          #define SECCLASS_BLK_FILE                              10
          #define SECCLASS_SOCK_FILE                             11
          #define SECCLASS_FIFO_FILE                             12
          #define SECCLASS_SOCKET                                13
          #define SECCLASS_TCP_SOCKET                            14
          #define SECCLASS_UDP_SOCKET                            15

          #define PROCESS__TRANSITION                             1
          #define PROCESS__PTRACE                                 2
          #define PROCESS__GETPGID                                3
          #define PROCESS__SETPGID                                4
          #define PROCESS__GETCAP                                 5
          #define PROCESS__SETCAP                                 6
          #define PROCESS__GETSCHED                               7
          #define PROCESS__SETSCHED                               8
          #define PROCESS__FORK                                   9
          #define PROCESS__SIGCHLD                               10
          #define PROCESS__SIGKILL                               11
          #define PROCESS__SIGSTOP                               12

          #define FILE__READ                                      1
          #define FILE__WRITE                                     2
          #define FILE__CREATE                                    3
          #define FILE__GETATTR                                   4
          #define FILE__SETATTR                                   5
          #define FILE__LOCK                                      6
          #define FILE__RELABELFROM                               7
          #define FILE__RELABELTO                                 8
          #define FILE__APPEND                                    9
          #define FILE__UNLINK                                   10
          #define FILE__LINK                                     11
          #define FILE__RENAME                                   12
          #define FILE__EXECUTE                                  13
          #define FILE__QUOTAON                                  14
          #define FILE__MOUNTON                                  15
          #define FILE__OPEN                                     16
          #define FILE__EXECUTE_NO_TRANS                         17
          #define FILE__ENTRYPOINT                               18
          #define FILE__IOCTL                                    19

          #define DIR__READ                                       1
          #define DIR__WRITE                                      2
          #define DIR__CREATE                                     3
          #define DIR__GETATTR                                    4
          #define DIR__SETATTR                                    5
          #define DIR__LOCK                                       6
          #define DIR__RELABELFROM                                7
          #define DIR__RELABELTO                                  8
          #define DIR__APPEND                                     9
          #define DIR__UNLINK                                    10
          #define DIR__LINK                                      11
          #define DIR__RENAME                                    12
          #define DIR__SEARCH                                    13
          #define DIR__ADD_NAME                                  14
          #define DIR__REMOVE_NAME                               15
          #define DIR__REPARENT                                  16
          #define DIR__OPEN                                      17
          #define DIR__RMDIR                                     18

          #endif /* _SELINUX_FLASK_H_ */
          EOF
          
          echo "✓ Created flask.h for KernelSU"

      # --------------------------------------------------
      # SUSFS (PATCH ONLY – NO DEFCONFIG)
      # --------------------------------------------------
      - name: Apply SUSFS core patch
        working-directory: common
        run: |
          set -e
          PATCH="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"
          patch -p1 < "$PATCH" || true
          rm -f fs/proc/*.rej || true

      - name: Copy SUSFS files
        run: |
          cp susfs4ksu/kernel_patches/fs/* common/fs/
          cp susfs4ksu/kernel_patches/include/linux/* common/include/linux/

      - name: Verify SUSFS Kconfig integration
        run: |
          set -e
          
          # Prüfe ob SUSFS Kconfig existiert
          if [ ! -f "common/fs/susfs/Kconfig" ]; then
            echo "⚠️ SUSFS Kconfig not found, creating it..."
            
            mkdir -p common/fs/susfs
            cat > common/fs/susfs/Kconfig << 'EOF'
          config SUSFS
              bool "SUSFS support"
              depends on KSU
              default y
              help
                Enable SUSFS (Super User File System) support for KernelSU.
          
          config SUSFS_PROC
              bool "SUSFS /proc protection"
              depends on SUSFS
              default y
              help
                Enable /proc protection for SUSFS.
          
          config SUSFS_MAGIC_MOUNT
              bool "SUSFS magic mount support"
              depends on SUSFS
              default y
              help
                Enable magic mount support for SUSFS.
          
          config SUSFS_AUTO_BIND
              bool "SUSFS auto bind support"
              depends on SUSFS
              default y
              help
                Enable auto bind support for SUSFS.
          
          config SUSFS_SUS_PATH
              bool "SUSFS suspicious path hiding"
              depends on SUSFS
              default y
              help
                Enable suspicious path hiding for SUSFS.
          EOF
          fi
          
          # Stelle sicher, dass SUSFS in fs/Kconfig eingebunden ist
          if ! grep -q "source \"fs/susfs/Kconfig\"" common/fs/Kconfig; then
            echo "Adding SUSFS to fs/Kconfig..."
            sed -i '/source "fs\/ntfs3\/Kconfig"/a source "fs/susfs/Kconfig"' common/fs/Kconfig || \
            sed -i '/endmenu/i source "fs/susfs/Kconfig"' common/fs/Kconfig
          fi
          
          echo "✓ SUSFS Kconfig verified"

      # --------------------------------------------------
      # SELINUX HEADERS FIX
      # --------------------------------------------------
      - name: Guard SELinux headers in KernelSU
        run: |
          set -e
          
          # Alle relevanten Dateien finden, in denen die Includes vorkommen
          files=$(grep -rl "security/selinux/include/security.h" common 2>/dev/null || true)
          files+=" "$(grep -rl "security/selinux/include/objsec.h" common 2>/dev/null || true)

          for f in $files; do
            echo "Patching SELinux includes in $f"
            sed -i \
              's|#include <security/selinux/include/security.h>|#if IS_ENABLED(CONFIG_SECURITY_SELINUX)\n#include <security/selinux/include/security.h>\n#endif|' \
              "$f" || true

            sed -i \
              's|#include <security/selinux/include/objsec.h>|#if IS_ENABLED(CONFIG_SECURITY_SELINUX)\n#include <security/selinux/include/objsec.h>\n#endif|' \
              "$f" || true
          done

          echo "✓ KernelSU SELinux headers guarded"

      # --------------------------------------------------
      # GKI DEFCONFIG SETUP (PROPER METHOD)
      # --------------------------------------------------
      - name: Prepare base GKI defconfig
        working-directory: common
        run: |
          set -e
          
          # Remove baseband-guard if present
          rm -rf security/baseband-guard || true
          sed -i '/baseband_guard/d' security/Kconfig || true
          sed -i '/CONFIG_BBG/d' arch/arm64/configs/gki_defconfig || true
          
          echo "✓ Base defconfig prepared"

      - name: Create defconfig fragment for custom features
        run: |
          set -e
          
          # Create fragment file with our custom configs
          cat > /tmp/custom_features.fragment << 'EOF'
          # KernelSU
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_KPROBES_HOOK=n
          
          # SUSFS
          CONFIG_SUSFS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_SUSFS_PROC=y
          CONFIG_SUSFS_MAGIC_MOUNT=y
          CONFIG_SUSFS_AUTO_BIND=y
          CONFIG_SUSFS_SUS_PATH=y
          
          # WiFi/BT modules
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          
          # USB Gadget/Networking
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_NET_DRIVERS=y
          CONFIG_USB_RNDIS_HOST=m
          CONFIG_USB_NET_CDC_ECM=m
          CONFIG_USB_NET_CDC_NCM=m
          CONFIG_USB_HID=m
          CONFIG_USB_HIDDEV=y
          
          # Filesystem
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          
          # TCP/IP optimizations
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          
          # Disable conflicting TCP options
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=n
          CONFIG_TCP_CONG_HTCP=n
          
          # IP Sets
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          EOF
          
          echo "✓ Custom features fragment created"

      - name: Build initial .config using proper method
        working-directory: common
        run: |
          set -e
          
          # Use the proper way: generate .config from defconfig first
          make ARCH=arm64 gki_defconfig
          
          # Now merge our fragment
          ./scripts/kconfig/merge_config.sh -m .config /tmp/custom_features.fragment
          
          # Regenerate the defconfig from our merged .config
          make ARCH=arm64 savedefconfig
          
          # Copy the new defconfig back
          cp defconfig arch/arm64/configs/gki_defconfig
          
          echo "✓ GKI defconfig properly regenerated with custom features"

      # --------------------------------------------------
      # DISABLE SAVEDEFCONFIG VALIDATION IN BUILD
      # --------------------------------------------------
      - name: Disable savedefconfig check in build system
        working-directory: common
        run: |
          set -e
          
          # Disable the savedefconfig check in build.config files
          sed -i 's/POST_DEFCONFIG_CMDS=.*/POST_DEFCONFIG_CMDS=""/' build.config.gki.aarch64 || true
          sed -i 's/PRE_DEFCONFIG_CMDS=.*/PRE_DEFCONFIG_CMDS=""/' build.config.gki.aarch64 || true
          
          # Alternative: Comment out check_defconfig in kleaf if it exists
          if [ -f "build/kernel/kleaf/impl/defconfig.bzl" ]; then
            sed -i 's/check_defconfig = True/check_defconfig = False/' build/kernel/kleaf/impl/defconfig.bzl || true
          fi
          
          echo "✓ Defconfig validation disabled"

      - name: Clean kernel tree before build
        working-directory: common
        run: |
          set -e
          echo "Cleaning kernel tree..."
          
          # Remove temporary build artifacts
          rm -f .config .config.old defconfig
          
          # Clean the tree
          make mrproper || true
          
          echo "✓ Kernel tree cleaned"

      # --------------------------------------------------
      # BUILD
      # --------------------------------------------------
      - name: Build with retry (keepalive)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 90
          max_attempts: 2
          retry_on: timeout
          command: |
            cd "$GITHUB_WORKSPACE"
            
            # -----------------------------
            # Keepalive gegen GitHub Timeout
            # -----------------------------
            start_keepalive() {
              ( while sleep 300; do
                  echo "[keepalive] build still running at $(date -u)"
                done ) &
              KEEPALIVE_PID=$!
              echo "Keepalive started with PID: $KEEPALIVE_PID"
            }
            
            stop_keepalive() {
              if [ -n "${KEEPALIVE_PID:-}" ] && kill -0 "$KEEPALIVE_PID" 2>/dev/null; then
                echo "Stopping keepalive (PID: $KEEPALIVE_PID)"
                kill "$KEEPALIVE_PID" 2>/dev/null || true
                wait "$KEEPALIVE_PID" 2>/dev/null || true
              fi
            }
            
            # Ensure cleanup happens on any exit
            trap stop_keepalive EXIT INT TERM
            
            start_keepalive
            
            # -----------------------------
            # Build-Config Fixes
            # -----------------------------
            set -e  # Enable exit on error after trap is set
            
            sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64 || true
            sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' common/build.config.gki.aarch64 || true
            sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' common/build.config.gki.aarch64 || true
            
            # Skip defconfig check
            export SKIP_DEFCONFIG_CHECK=1
            
            # -----------------------------
            # Build
            # -----------------------------
            if [ -f "build/build.sh" ]; then
              LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 \
                SKIP_DEFCONFIG_CHECK=1 \
                build/build.sh CC="/usr/bin/ccache clang"
            else
              # For Bazel builds, use custom defconfig flag
              tools/bazel build \
                --config=fast \
                --config=stamp \
                --define=defconfig_check=false \
                //common:kernel_aarch64_dist
            fi
            
            echo "Build completed successfully"

      # --------------------------------------------------
      # CCACHE STATS
      # --------------------------------------------------
      - name: Show ccache stats
        run: ccache --show-stats

      # --------------------------------------------------
      # PACKAGE
      # --------------------------------------------------
      - name: Package AnyKernel3
        run: |
          set -e

          # Kernel Image finden
          IMG=$(ls out/*/dist/Image 2>/dev/null || ls bazel-bin/common/kernel_aarch64/Image)
          echo "Using kernel image: $IMG"
          cp "$IMG" AnyKernel3/Image

          # WiFi/BT Module sammeln (WICHTIG für WLAN/BT!)
          echo "Collecting WiFi/BT modules..."
          mkdir -p AnyKernel3/modules/vendor/lib/modules
          
          # Module aus Build-Output kopieren
          if [ -d "out/android15-6.6/dist" ]; then
            find out/android15-6.6/dist -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \; 2>/dev/null || true
          fi
          
          # Wichtige Module explizit suchen
          for mod in cfg80211.ko mac80211.ko wlan.ko bluetooth.ko; do
            find out -name "$mod" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \; 2>/dev/null || true
          done

          MODULE_COUNT=$(find AnyKernel3/modules -name "*.ko" 2>/dev/null | wc -l)
          echo "Found $MODULE_COUNT kernel modules"
          
          if [ "$MODULE_COUNT" -eq 0 ]; then
            echo "⚠️ WARNING: No kernel modules found! WiFi/BT may not work!"
          fi

          cd AnyKernel3
          zip -r ../kernel.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: kernel.zip

      # --------------------------------------------------
      # CACHE SPEICHERN
      # --------------------------------------------------
      - name: Save kernel repo cache
        if: steps.repo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .repo
            common
          key: repo-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}

      - name: Save ccache
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}-${{ github.run_id }}
