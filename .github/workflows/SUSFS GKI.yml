name: SukiSU Kernel Build (GKI Fixed)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      kernelsu_variant:
        required: true
        type: string
      kernelsu_branch:
        required: true
        type: string
      kernelsu_branch_other:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_CPP2: "yes"

    steps:
    # --------------------------------------------------
    # SPACE + TOOLS
    # --------------------------------------------------
    - name: Maximize build space
      uses: easimon/maximize-build-space@master

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git curl python3 ccache

    # --------------------------------------------------
    # CCACHE
    # --------------------------------------------------
    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: /home/runner/.ccache
        key: ccache-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}
        restore-keys: |
          ccache-${{ inputs.android_version }}-${{ inputs.kernel_version }}-
          ccache-${{ inputs.android_version }}-
          ccache-

    - name: Setup ccache
      run: |
        ccache --max-size=10G
        ccache --set-config=compression=true
        ccache --zero-stats

    # --------------------------------------------------
    # REPO + KERNEL
    # --------------------------------------------------
    - name: Install repo tool
      run: |
        mkdir -p git-repo
        curl https://storage.googleapis.com/git-repo-downloads/repo > git-repo/repo
        chmod +x git-repo/repo
        echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV

    - name: Repo init & sync (GKI)
      run: |
        set -e
        BRANCH="android15-6.6-${{ inputs.os_patch_level }}"
        $REPO init -u https://android.googlesource.com/kernel/manifest -b common-$BRANCH
        $REPO sync -j$(nproc --all) --fail-fast

        # Cleanup Baseband-Guard if present
        rm -rf common/security/baseband-guard || true
        sed -i '/baseband_guard/d' common/security/Kconfig
        sed -i '/CONFIG_BBG/d' common/arch/arm64/configs/gki_defconfig
        sed -i 's/,baseband_guard//g' common/arch/arm64/configs/gki_defconfig

    # --------------------------------------------------
    # DEPENDENCIES
    # --------------------------------------------------
    - name: Clone SUSFS + AnyKernel3
      run: |
        git clone https://github.com/ShirkNeko/susfs4ksu.git -b gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}
        git clone https://github.com/MiRinChan/AnyKernel3.git

    # --------------------------------------------------
    # KERNELSU BRANCH
    # --------------------------------------------------
    - name: Determine KernelSU branch
      run: |
        if [[ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]]; then
          if [[ "${{ inputs.kernelsu_branch }}" == "Other" ]]; then
            echo "BRANCH=${{ inputs.kernelsu_branch_other }}" >> $GITHUB_ENV
          else
            echo "BRANCH=builtin" >> $GITHUB_ENV
          fi
        fi

    # --------------------------------------------------
    # BASEBAND GUARD (PATCH ONLY)
    # --------------------------------------------------

    - name: Apply Module Check Bypass
      if: ${{ matrix.build_type == 'Bypass' || matrix.build_type == 'Hakan' }}
      run: |
          if [[ "${{ inputs.kernel_version }}" == "6.1" || "${{ inputs.kernel_version }}" == "6.6" || "${{ inputs.kernel_version }}" == "6.12" ]]; then
            TARGET_FILE="$KERNEL_ROOT/common/kernel/module/version.c"
          else
            TARGET_FILE="$KERNEL_ROOT/common/kernel/module.c"
          fi

          echo "Applying bypass to $TARGET_FILE"
          sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET_FILE"

          # Verify the bypass
          if grep -A 5 "bad_version:" "$TARGET_FILE" | grep -q "return 1;"; then
            echo "SUCCESS: Module check bypass verified in $TARGET_FILE"
          else
            echo "FAILED: Module check bypass not found in $TARGET_FILE"
            grep -A 5 "bad_version:" "$TARGET_FILE" || true
            exit 1
          fi

    # --------------------------------------------------
    # KERNELSU (SUKISU)
    # --------------------------------------------------
    - name: Add SukiSU
      if: ${{ inputs.kernelsu_variant == 'SukiSU' }}
      run: |
        curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s "$BRANCH"

    # --------------------------------------------------
    # SUSFS (PATCH ONLY – NO DEFCONFIG)
    # --------------------------------------------------
    - name: Apply SUSFS core patch
      working-directory: common
      run: |
        set -e
        PATCH="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"
        patch -p1 < "$PATCH" || true
        rm -f fs/proc/*.rej || true

    - name: Copy SUSFS files
      run: |
        cp susfs4ksu/kernel_patches/fs/* common/fs/
        cp susfs4ksu/kernel_patches/include/linux/* common/include/linux/

    # --------------------------------------------------
    # GKI DEFCONFIG SANITIZER (ABSOLUT KRITISCH)
    # --------------------------------------------------
    - name: Sanitize gki_defconfig (GKI safe)
      run: |
        set -e
        DEFCONFIG=common/arch/arm64/configs/gki_defconfig

        # ❌ GKI-verbotene Optionen entfernen
        sed -i '/^CONFIG_SUSFS/d' "$DEFCONFIG"
        sed -i '/^CONFIG_KSU_SUSFS/d' "$DEFCONFIG"
        sed -i '/^CONFIG_KSU_SUSFS_ENABLE_LOG/d' "$DEFCONFIG"
        sed -i '/^CONFIG_KSU_SUSFS_SPOOF_UNAME/d' "$DEFCONFIG"
        sed -i '/^CONFIG_BBG/d' "$DEFCONFIG"

        # ❌ auch KernelSU nicht fest verdrahten
        sed -i '/^CONFIG_KSU/d' "$DEFCONFIG"

    - name: Merge kernel config (GKI safe)
      run: |
        DEFCONFIG=common/arch/arm64/configs/gki_defconfig
        MERGE=common/scripts/kconfig/merge_config.sh
        chmod +x "$MERGE"
        cat > /tmp/gki_nethunter.config << 'EOF'
        # KernelSU
        CONFIG_KSU=y
        CONFIG_KSU_MANUAL_HOOK=y
        CONFIG_KSU_KPROBES_HOOK=n
        # SUSFS
        CONFIG_SUSFS=y
        CONFIG_KSU_SUSFS=y
        CONFIG_SUSFS_PROC=y
        CONFIG_SUSFS_MAGIC_MOUNT=y
        CONFIG_SUSFS_AUTO_BIND=y
        CONFIG_SUSFS_SUS_PATH=y
        # NetHunter (GKI SAFE)
        CONFIG_CFG80211=m
        CONFIG_MAC80211=m
        CONFIG_USB_GADGET=y
        CONFIG_USB_CONFIGFS=y
        CONFIG_USB_NET_DRIVERS=y
        CONFIG_USB_RNDIS_HOST=m
        CONFIG_USB_NET_CDC_ECM=m
        CONFIG_USB_NET_CDC_NCM=m
        CONFIG_USB_HID=m
        CONFIG_USB_HIDDEV=y
        # Filesystem
        CONFIG_TMPFS_XATTR=y
        CONFIG_TMPFS_POSIX_ACL=y
        # Network
        CONFIG_TCP_CONG_BBR=y
        CONFIG_NET_SCH_FQ=y
        CONFIG_DEFAULT_BBR=y
        EOF
        "$MERGE" -m "$DEFCONFIG" /tmp/gki_nethunter.config
        cp .config "$DEFCONFIG"
        echo "Merged config summary:"
        grep -E 'CONFIG_(KSU|SUSFS|CFG80211|MAC80211|USB_GADGET|BBR)' "$DEFCONFIG"
    - name: Sync gki_defconfig (savedefconfig)
      run: |
        cd common
        sed -i '...' security/Kconfig
        make ARCH=arm64 savedefconfig
        cp defconfig arch/arm64/configs/gki_defconfig

        rm -rf common/security/baseband-guard || true
        sed -i '/baseband_guard/d' common/security/Kconfig
        sed -i '/CONFIG_BBG/d' common/arch/arm64/configs/gki_defconfig

        

    # --------------------------------------------------
    # BUILD
    # --------------------------------------------------
    - name: Build with retry
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 30
        max_attempts: 3
        retry_on: timeout
        command: |
          set -e
          cd "$GITHUB_WORKSPACE"

          sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64 || true
          sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' common/build.config.gki.aarch64 || true
          sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' common/build.config.gki.aarch64 || true

          if [ -f "build/build.sh" ]; then
            LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 \
              build/build.sh CC="/usr/bin/ccache clang"
          else
            tools/bazel build --config=fast //common:kernel_aarch64_dist
          fi

    # --------------------------------------------------
    # CCACHE STATS
    # --------------------------------------------------
    - name: Show ccache stats
      run: ccache --show-stats

    # --------------------------------------------------
    # PACKAGE
    # --------------------------------------------------
    - name: Package AnyKernel3
      run: |
        cp bazel-bin/common/kernel_aarch64/Image AnyKernel3/Image
        cd AnyKernel3
        zip -r ../kernel.zip .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: kernel.zip
