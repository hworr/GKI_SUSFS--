      - name: Add NetHunter configuration (safe)
        run: |
          set -e
      
          echo "Workspace:"
          pwd
          ls -lah
      
          # Robust GKI kernel root detection
          if [ -d "common/arch/arm64/configs" ]; then
            echo "Using workspace as KERNEL_ROOT"
          elif [ -d "$KERNEL_ROOT/common/arch/arm64/configs" ]; then
            echo "Using env KERNEL_ROOT=$KERNEL_ROOT"
            cd "$KERNEL_ROOT"
          else
            echo "❌ GKI kernel root not found"
            find . -maxdepth 2 -type d
            exit 1
          fi
      
          DEFCONFIG=common/arch/arm64/configs/gki_defconfig
      
          echo "Adding minimal NetHunter-safe config…"
      
          # KEEP THESE (safe)
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_MANUAL_SU=n" >> "$DEFCONFIG"
      
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"
      
          echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFCONFIG"
          echo "CONFIG_NET_SCH_FQ=y" >> "$DEFCONFIG"
          echo "CONFIG_DEFAULT_BBR=y" >> "$DEFCONFIG"
      
          echo "✓ Configuration step finished"
      
          # --- GKI-safe NetHunter modules ---
            if ! grep -q 'module_outs' common/BUILD.bazel; then
              sed -i '/name = "kernel_aarch64"/,/)/ s/)/  module_outs = [\
                "net\/wireless\/cfg80211.ko",\
                "net\/mac80211\/mac80211.ko",\
                "drivers\/net\/usb\/rndis_host.ko",\
              ],\
            )/' common/BUILD.bazel
            fi
    
      - name: Final KernelSU + SUSFS defconfig
        run: |
          set -e
      
          echo "Workspace:"
          pwd
          ls -lah
      
          # GKI root = workspace
          if [ ! -f common/arch/arm64/configs/gki_defconfig ]; then
            echo "❌ gki_defconfig not found"
            exit 1
          fi
      
          DEFCONFIG=common/arch/arm64/configs/gki_defconfig
      
          echo "Cleaning old KSU / SUSFS entries..."
          sed -i '/^CONFIG_KSU/d' "$DEFCONFIG"
          sed -i '/^CONFIG_SUSFS/d' "$DEFCONFIG"
      
          echo "Applying final KernelSU + SUSFS config..."
      
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_KPROBES_HOOK=n
          
          CONFIG_SUSFS=y
          CONFIG_KSU_SUSFS=y
          
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

          echo "✓ Final KernelSU + SUSFS config applied"
          grep -E '^CONFIG_(KSU|SUSFS)' "$DEFCONFIG" || true

# --------------------------------------------------
# Kernel version / branding (UTS, localversion, stamp)
# --------------------------------------------------
      - name: Config Kernel Name
        run: |
          set -e
      
          echo "Using workspace as kernel root"
          pwd
          ls -lah
      
          CURRENT_TIME=$(date -u +"%a %b %d %H:%M:%S UTC %Y")
          echo "CURRENT_TIME=$CURRENT_TIME"
      
          perl -pi -e \
            "s{UTS_VERSION=\"\\\$\\(echo \\\$UTS_VERSION \\\$CONFIG_FLAGS \\\$TIMESTAMP \\| cut -b -\\\$UTS_LEN\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $CURRENT_TIME\"}" \
            common/scripts/mkcompile_h
      
          sed -i '$s|echo \"\\$res\"|echo \"\\$res-g8d713f9e8e7b-ab13202960\"|' \
            common/scripts/setlocalversion
      
          if [ -f "build/build.sh" ]; then
            sed -i 's/-dirty//' common/scripts/setlocalversion
          else
            sed -i \
              's/build-timestamp = $(or $(KBUILD_BUILD_TIMESTAMP), $(build-timestamp-auto))/build-timestamp = \"Sun Apr 20 04:20:00 UTC 2025\"/' \
              common/init/Makefile
      
            sed -i \
              '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' \
              common/BUILD.bazel
      
            rm -rf common/android/abi_gki_protected_exports_*
      
            sed -i 's/-maybe-dirty//g' build/kernel/kleaf/impl/stamp.bzl
      
            sed -E -i \
              '/^CONFIG_LOCALVERSION=/ s/(.*)"/\1-gd7dac4b14270-ab12946699"/' \
              common/arch/arm64/configs/gki_defconfig
          fi
      
          echo "✓ Kernel version branding applied"

          # -----------------------------
          # Build Kernel (CCache + GKI)
          # -----------------------------
          - name: Build Kernel
            run: |
              set -e
              set -x
          
              echo "Building the kernel..."
          
              sed -i \
                -e 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' \
                -e '/MODULES_ORDER=android\/gki_aarch64_modules/d' \
                -e '/KMI_SYMBOL_LIST_STRICT_MODE/d' \
                common/build.config.gki.aarch64
          
              if [ -x build/build.sh ]; then
                LTO=thin \
                BUILD_CONFIG=common/build.config.gki.aarch64 \
                build/build.sh CC="/usr/bin/ccache clang"
              else
                tools/bazel build \
                  --disk_cache=/home/runner/.cache/bazel \
                  --config=fast \
                  //common:kernel_aarch64_dist
              fi
          
              ccache --show-stats
          
          # -----------------------------
          # Optional Kernel Image Patch
          # -----------------------------
          - name: Patch Kernel Image (optional)
            if: ${{ inputs.kernel_version != '6.6' }}
            run: |
              set -e
          
              PATCH_URL="https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/main/kpm/patch_linux"
              PATCH_BIN="/tmp/patch_linux"
          
              curl -Ls "$PATCH_URL" -o "$PATCH_BIN"
              chmod +x "$PATCH_BIN"
          
              if ls out/*/dist/Image >/dev/null 2>&1; then
                IMG_DIR="$(dirname "$(ls out/*/dist/Image | head -n1)")"
              elif [ -f bazel-bin/common/kernel_aarch64/Image ]; then
                IMG_DIR="bazel-bin/common/kernel_aarch64"
              else
                echo "❌ Kernel Image not found"
                exit 1
              fi
          
              echo "Kernel Image path: $IMG_DIR"
              cd "$IMG_DIR"
          
              # ./patch_linux   # bewusst deaktiviert
          
          # -----------------------------
          # Collect Kernel Images
          # -----------------------------
          - name: Collect Kernel Images
            run: |
              set -e
          
              mkdir -p bootimgs
          
              if ls out/*/dist/Image >/dev/null 2>&1; then
                SRC_DIR="$(dirname "$(ls out/*/dist/Image | head -n1)")"
              else
                SRC_DIR="bazel-bin/common/kernel_aarch64"
              fi
          
              echo "Using kernel images from: $SRC_DIR"
          
              cp "$SRC_DIR/Image" bootimgs/
              [ -f "$SRC_DIR/Image.lz4" ] && cp "$SRC_DIR/Image.lz4" bootimgs/
          
              cp bootimgs/Image .
              gzip -n -k -f -9 Image
          
          # -----------------------------
          # Create AnyKernel3 ZIP
          # -----------------------------
          - name: Create AnyKernel3 ZIP
            run: |
              set -e
          
              ZIP_NAME="${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-AnyKernel3.zip"
          
              cd AnyKernel3
          
              rm -f Image Image.lz4 Image.gz
              cp ../Image .
          
              zip -r "../$ZIP_NAME" . -x "*.git*" "README.md"
              rm -f Image
          
          # -----------------------------
          # Upload Artifacts
          # -----------------------------
          - name: Upload Build Artifacts
            uses: actions/upload-artifact@v4
            with:
              name: kernel-${{ inputs.android_version }}-${{ inputs.kernel_version }}
              path: |
                *.zip
                bootimgs/*
