name: GKI Kernel Build (SukiSU + SUSFS + NetHunter)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
    # --------------------------------------------------
    # SPACE + DEPENDENCIES
    # --------------------------------------------------
    - uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 8192
        swap-size-mb: 8192
        remove-dotnet: "true"
        remove-android: "true"
        remove-haskell: "true"
        remove-codeql: "true"

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git curl ccache python3 \
          build-essential bc flex bison \
          libssl-dev libelf-dev

    - name: Setup ccache
      run: |
        ccache --max-size=3G
        ccache --set-config=compression=true

    - uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ github.sha }}
        restore-keys: ccache-

    # --------------------------------------------------
    # REPO SYNC (GKI)
    # --------------------------------------------------
    - name: Install repo tool
      run: |
        mkdir -p git-repo
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > git-repo/repo
        chmod +x git-repo/repo
        echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV

    - name: Repo init & sync (android15-6.6)
      run: |
        BRANCH="android15-6.6-${{ inputs.os_patch_level }}"
        $REPO init -u https://android.googlesource.com/kernel/manifest -b common-$BRANCH
        $REPO sync -j$(nproc --all) --fail-fast

    # --------------------------------------------------
    # CLONE EXTERNAL PATCHES
    # --------------------------------------------------
    - name: Clone external repositories
      run: |
        git clone https://github.com/ShirkNeko/susfs4ksu.git
        git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
        git clone https://github.com/MiRinChan/AnyKernel3.git

    # --------------------------------------------------
    # ✅ SUSFS FIRST (CRITICAL)
    # --------------------------------------------------
    - name: Apply SUSFS core patch
      working-directory: common
      run: |
        set -e
    
        PATCH="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"
    
        if [ ! -f "$PATCH" ]; then
          echo "❌ SUSFS patch not found:"
          echo "$PATCH"
          echo "Available patches:"
          ls -lah "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches" || true
          exit 1
        fi
    
        echo "==> Applying SUSFS core patch"
        patch -p1 < "$PATCH"
    
        rm -f fs/proc/*.rej || true

    - name: Copy SUSFS source files
      run: |
        cp -r susfs4ksu/kernel_patches/fs/* common/fs/
        cp -r susfs4ksu/kernel_patches/include/linux/* common/include/linux/

        - name: Enable SUSFS (FINAL, GKI-safe)
          run: |
            set -e
    
            DEFCONFIG="common/arch/arm64/configs/gki_defconfig"
    
            if [ ! -f "$DEFCONFIG" ]; then
              echo "❌ gki_defconfig not found"
              exit 1
            fi
    
            echo "==> Enabling SUSFS in gki_defconfig"
    
            # 🔥 Wichtig: alte Reste entfernen
            sed -i '/^CONFIG_SUSFS/d' "$DEFCONFIG"
            sed -i '/^CONFIG_KSU_SUSFS/d' "$DEFCONFIG"
    
            # ✅ SUSFS sauber aktivieren
            cat >> "$DEFCONFIG" << 'EOF'
    
        # ==========================
        # SUSFS (FINAL)
        # ==========================
        CONFIG_SUSFS=y
        CONFIG_KSU_SUSFS=y
        CONFIG_SUSFS_PROC=y
        CONFIG_SUSFS_MAGIC_MOUNT=y
        CONFIG_SUSFS_AUTO_BIND=y
        CONFIG_SUSFS_SUS_PATH=y
        EOF
    
            echo "✓ SUSFS enabled"
            grep CONFIG_SUSFS "$DEFCONFIG" || true

    # --------------------------------------------------
    # ✅ KERNELSU (SukiSU) AFTER SUSFS
    # --------------------------------------------------
    - name: Add SukiSU (builtin)
      run: |
        curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh \
          | bash -s builtin

    # --------------------------------------------------
    # ✅ SINGLE CONFIG MERGE (ONLY PLACE CONFIG IS TOUCHED)
    # --------------------------------------------------
    - name: Merge kernel config (GKI safe)
      run: |
        DEFCONFIG=common/arch/arm64/configs/gki_defconfig
        MERGE=common/scripts/kconfig/merge_config.sh
        chmod +x "$MERGE"

        cat > /tmp/gki_nethunter.config << 'EOF'
        # KernelSU
        CONFIG_KSU=y
        CONFIG_KSU_MANUAL_HOOK=y
        CONFIG_KSU_KPROBES_HOOK=n

        # SUSFS
        CONFIG_SUSFS=y
        CONFIG_KSU_SUSFS=y
        CONFIG_SUSFS_PROC=y
        CONFIG_SUSFS_MAGIC_MOUNT=y
        CONFIG_SUSFS_AUTO_BIND=y
        CONFIG_SUSFS_SUS_PATH=y

        # NetHunter (GKI SAFE)
        CONFIG_CFG80211=m
        CONFIG_MAC80211=m

        CONFIG_USB_GADGET=y
        CONFIG_USB_CONFIGFS=y
        CONFIG_USB_NET_DRIVERS=y
        CONFIG_USB_RNDIS_HOST=m
        CONFIG_USB_NET_CDC_ECM=m
        CONFIG_USB_NET_CDC_NCM=m

        CONFIG_USB_HID=m
        CONFIG_USB_HIDDEV=y

        # Filesystem
        CONFIG_TMPFS_XATTR=y
        CONFIG_TMPFS_POSIX_ACL=y

        # Network
        CONFIG_TCP_CONG_BBR=y
        CONFIG_NET_SCH_FQ=y
        CONFIG_DEFAULT_BBR=y
        EOF

        "$MERGE" -m "$DEFCONFIG" /tmp/gki_nethunter.config
        cp .config "$DEFCONFIG"

        echo "Merged config summary:"
        grep -E 'CONFIG_(KSU|SUSFS|CFG80211|MAC80211|USB_GADGET|BBR)' "$DEFCONFIG"

    - name: Sync gki_defconfig (savedefconfig)
      run: |
        cd common
        make ARCH=arm64 savedefconfig
        cp defconfig arch/arm64/configs/gki_defconfig

    # --------------------------------------------------
    # BUILD
    # --------------------------------------------------
    - name: Build kernel
      run: |
        sed -i \
          -e 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' \
          -e '/MODULES_ORDER=android\/gki_aarch64_modules/d' \
          -e '/KMI_SYMBOL_LIST_STRICT_MODE/d' \
          common/build.config.gki.aarch64

        if [ -x build/build.sh ]; then
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 \
            build/build.sh CC="/usr/bin/ccache clang"
        else
          tools/bazel build --config=fast //common:kernel_aarch64_dist
        fi

    # --------------------------------------------------
    # PACKAGE
    # --------------------------------------------------
    - name: Package AnyKernel3
      run: |
        IMG=$(ls out/*/dist/Image 2>/dev/null || ls bazel-bin/common/kernel_aarch64/Image)
        cp "$IMG" AnyKernel3/Image
        cd AnyKernel3
        zip -r ../kernel.zip .

    - uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: kernel.zip
