name: Nethunter Kernel Build (SukiSU + SUSFS)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        required: true
        default: android15
      kernel_version:
        required: true
        default: 6.6
      os_patch_level:
        required: true
      kernelsu_branch:
        required: true
        default: builtin

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: /home/runner/.ccache

    steps:
    # --------------------------------------------------
    # TOOLS
    # --------------------------------------------------
    - uses: easimon/maximize-build-space@master

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y git curl ccache clang lld llvm bc bison flex libssl-dev

    - name: Setup ccache
      run: |
        ccache --max-size=5G
        ccache --set-config=compression=true

    # --------------------------------------------------
    # REPO
    # --------------------------------------------------
    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl -o ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
        chmod +x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Repo init & sync
      run: |
        BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
        repo init -u https://android.googlesource.com/kernel/manifest -b common-$BRANCH
        repo sync -j$(nproc) --fail-fast

    # --------------------------------------------------
    # CLEAN (ONCE!)
    # --------------------------------------------------
    - name: Clean kernel tree (GKI)
      working-directory: common
      run: make mrproper

    # --------------------------------------------------
    # PATCHES
    # --------------------------------------------------
    - name: Clone external repos
      run: |
        git clone https://github.com/ShirkNeko/susfs4ksu.git
        git clone https://github.com/MiRinChan/AnyKernel3.git

    - name: Add SukiSU
      run: |
        curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh \
          | bash -s ${{ inputs.kernelsu_branch }}

    - name: Apply SUSFS
      working-directory: common
      run: |
        patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch
        cp ../susfs4ksu/kernel_patches/fs/* fs/
        cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/

    # --------------------------------------------------
    # DEFCONFIG (SINGLE SOURCE)
    # --------------------------------------------------
    - name: Patch gki_defconfig
      working-directory: common
      run: |
        DEF=arch/arm64/configs/gki_defconfig
        sed -i '/CONFIG_KSU/d;/CONFIG_SUSFS/d' $DEF

        cat >> $DEF << 'EOF'
        CONFIG_KSU=y
        CONFIG_KSU_MANUAL_HOOK=y
        CONFIG_SUSFS=y
        CONFIG_KSU_SUSFS=y
        CONFIG_CFG80211=m
        CONFIG_MAC80211=m
        CONFIG_USB_GADGET=y
        CONFIG_USB_CONFIGFS=y
        CONFIG_TMPFS_XATTR=y
        CONFIG_TMPFS_POSIX_ACL=y
        EOF

    # --------------------------------------------------
    # BUILD (ONLY build.sh)
    # --------------------------------------------------
    - name: Build kernel (build.sh ONLY)
      run: |
       set -e

       sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64 || true
       - name: Build kernel (build.sh ONLY)
         run: |
           set -e

       sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64 || true
       sed -i '/MODULES_ORDER/d' common/build.config.gki.aarch64 || true
       sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' common/build.config.gki.aarch64 || true
 
       export SKIP_DEFCONFIG_CHECK=1
       export BUILD_BAZEL=0

       build/build.sh CC="/usr/bin/ccache clang"sed -i '/MODULES_ORDER/d' common/build.config.gki.aarch64 || true
       sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' common/build.config.gki.aarch64 || true

       export SKIP_DEFCONFIG_CHECK=1
       export BUILD_BAZEL=0

       build/build.sh CC="/usr/bin/ccache clang"
    - name: Package AnyKernel3
      run: |
        IMG=$(find out -name Image | head -1)
        cp "$IMG" AnyKernel3/Image
        cd AnyKernel3 && zip -r ../kernel.zip .

    - uses: actions/upload-artifact@v4
      with:
         name: kernel
         path: kernel.zip
