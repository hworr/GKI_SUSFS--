name: Nethunter Kernel Build (SukiSU + SUSFS)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        required: true
        default: android15
      kernel_version:
        required: true
        default: 6.6
      os_patch_level:
        required: true
      kernelsu_branch:
        required: true
        default: builtin

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: /home/runner/.ccache

    steps:
    # --------------------------------------------------
    # TOOLS
    # --------------------------------------------------
    - uses: easimon/maximize-build-space@master

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y git curl ccache clang lld llvm bc bison flex libssl-dev

    - name: Setup ccache
      run: |
        ccache --max-size=5G
        ccache --set-config=compression=true

    # --------------------------------------------------
    # REPO
    # --------------------------------------------------
    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl -o ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
        chmod +x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Repo init & sync
      run: |
        BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
        repo init -u https://android.googlesource.com/kernel/manifest -b common-$BRANCH
        repo sync -j$(nproc) --fail-fast

    # --------------------------------------------------
    # CLEAN (ONCE!)
    # --------------------------------------------------
    - name: Clean kernel tree (GKI)
      working-directory: common
      run: make mrproper

    # --------------------------------------------------
    # PATCHES
    # --------------------------------------------------
    - name: Clone external repos
      run: |
        git clone https://github.com/ShirkNeko/susfs4ksu.git
        git clone https://github.com/MiRinChan/AnyKernel3.git

    - name: Add SukiSU
      run: |
        curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh \
          | bash -s "${{ inputs.kernelsu_branch }}"

      # --------------------------------------------------
      # SUSFS CORE (REQUIRED)
      # --------------------------------------------------
    - name: Apply SUSFS core patch (REQUIRED)
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
          set -e
          PATCH="$SUSFS4KSU/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch"
          if [ ! -f "$PATCH" ]; then
            echo "SUSFS core patch missing: $PATCH"
            exit 1
          fi
          echo "==> Applying SUSFS core patch"
          patch -p1 < "$PATCH" || true
          rm -f fs/proc/*.rej

      #---------------------------------------------------
      # SUSFS Debug
      #---------------------------------------------------
      
      #- name: Apply SUSFS debug init (EXPERIMENTAL)
      #  working-directory: ${{ env.KERNEL_ROOT }}/common
      #  run: |
      #   set -e
      #   echo "==> Applying SUSFS debug init patch"
      #   patch -p1 < "$GITHUB_WORKSPACE/susfs_debug_init.patch"

      # --------------------------------------------------
      # SUSFS FIX PATCHES (OPTIONAL / SAFE)
      # --------------------------------------------------
      
      - name: Apply SUSFS fix patches (REQUIRED)
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -e
          FIX="$KERNEL_PATCHES/wild/susfs_fix_patches/v2.0.0"
          apply_optional() {
            local p="$1"
            [ -f "$p" ] || return 0
            for lvl in 0 1 2; do
              if patch -p"$lvl" --dry-run < "$p" >/dev/null 2>&1; then
                patch -p"$lvl" < "$p"
                echo "applied $(basename "$p") with -p$lvl"
                return
              fi
            done
            echo "skipped $(basename "$p")"
          }
          apply_optional "$FIX/fix_task_mmu.c.patch"
          apply_optional "$FIX/1_fix_base.c.patch"
          rm -f fs/proc/*.rej

      - name: Apply Hooks Patches
        if: ${{ inputs.ksu_variant == 'WKSU' }}
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          cp "$KERNEL_PATCHES/wild/hooks/scope_min_manual_hooks_v1.4.patch" ./
          patch -p1 -F 3 < scope_min_manual_hooks_v1.4.patch

    # --------------------------------------------------
    # DEFCONFIG
    # --------------------------------------------------
    - name: Patch gki_defconfig
      working-directory: common
      run: |
        DEF=arch/arm64/configs/gki_defconfig

        sed -i '/CONFIG_KSU/d;/CONFIG_SUSFS/d' "$DEF"

        cat >> "$DEF" << 'EOF'
        CONFIG_KSU=y
        CONFIG_KSU_MANUAL_HOOK=y
        CONFIG_SUSFS=y
        CONFIG_KSU_SUSFS=y
        CONFIG_CFG80211=m
        CONFIG_MAC80211=m
        CONFIG_USB_GADGET=y
        CONFIG_USB_CONFIGFS=y
        CONFIG_TMPFS_XATTR=y
        CONFIG_TMPFS_POSIX_ACL=y
        EOF

    # --------------------------------------------------
    # BUILD (build.sh ONLY)
    # --------------------------------------------------
    - name: Build kernel
      run: |
        set -e

        sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64 || true
        sed -i '/MODULES_ORDER/d' common/build.config.gki.aarch64 || true
        sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' common/build.config.gki.aarch64 || true

        export SKIP_DEFCONFIG_CHECK=1
        export BUILD_BAZEL=0

        build/build.sh CC="/usr/bin/ccache clang"

    # --------------------------------------------------
    # PACKAGE
    # --------------------------------------------------
    - name: Package AnyKernel3
      run: |
        IMG=$(find out -name Image | head -1)
        cp "$IMG" AnyKernel3/Image
        cd AnyKernel3
        zip -r ../kernel.zip .

    - uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: kernel.zip
