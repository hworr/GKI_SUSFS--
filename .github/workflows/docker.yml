name: docker

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      require_susfs:
        required: false
        type: boolean
        default: false

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
    # --------------------------------------------------
    # Space & Dependencies
    # --------------------------------------------------
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 8192
        temp-reserve-mb: 2048
        swap-size-mb: 8192
        remove-dotnet: "true"
        remove-android: "true"
        remove-haskell: "true"
        remove-codeql: "true"

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git curl python3 ccache repo lz4 openssl

    # --------------------------------------------------
    # ENV
    # --------------------------------------------------
    - name: Set environment
      run: |
        CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
        KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
        {
          echo "CONFIG=$CONFIG"
          echo "KERNEL_ROOT=$KERNEL_ROOT"
          echo "DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig"
        } >> "$GITHUB_ENV"
        mkdir -p "$KERNEL_ROOT"

    # --------------------------------------------------
    # Build tools
    # --------------------------------------------------
    - name: Setup build tools
      run: |
        git clone https://android.googlesource.com/kernel/prebuilts/build-tools kernel-build-tools
        git clone https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg
        {
          echo "PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin:$PATH"
          echo "AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool"
          echo "MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py"
          echo "UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py"
        } >> "$GITHUB_ENV"

    # --------------------------------------------------
    # Kernel Source
    # --------------------------------------------------
    - name: Init kernel source
      run: |
        cd "$KERNEL_ROOT"
        BRANCH="common-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
        repo init -u https://android.googlesource.com/kernel/manifest -b "$BRANCH" --depth=1
        repo sync -c -j$(nproc) --no-tags --fail-fast

    # --------------------------------------------------
    # KernelSU-Next (OFFICIAL)
    # --------------------------------------------------
    - name: Add KernelSU-Next
      run: |
        cd "$KERNEL_ROOT"
        curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -

    # --------------------------------------------------
    # SUSFS
    # --------------------------------------------------
    - name: Clone SUSFS
      if: ${{ inputs.require_susfs }}
      run: |
        git clone https://gitlab.com/WildKernels/susfs4ksu.git -b gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}

    - name: Apply SUSFS core patch
      if: ${{ inputs.require_susfs }}
      run: |
        cd "$KERNEL_ROOT/common"
        PATCH="../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch"
        patch -p1 < "$PATCH" || true
        rm -f fs/proc/*.rej

    # --------------------------------------------------
    # Kernel config (SAFE for Pixel / Android 15)
    # --------------------------------------------------
    - name: Kernel config
      run: |
        set -e
        cd "$KERNEL_ROOT"
        CFG="common/arch/arm64/configs/gki_defconfig"

        add() { grep -q "^$1=" "$CFG" || echo "$1=$2" >> "$CFG"; }

        add CONFIG_KSU y
        add CONFIG_KSU_MANUAL_HOOK y
        add CONFIG_KSU_MANUAL_SU n

        if [[ "${{ inputs.require_susfs }}" == "true" ]]; then
          add CONFIG_KSU_SUSFS y
        else
          add CONFIG_KSU_SUSFS n
        fi

        # SUSFS core
        add_cfg CONFIG_KSU_SUSFS y
        
        # REQUIRED infra
        add_cfg CONFIG_TMPFS_XATTR y
        add_cfg CONFIG_TMPFS_POSIX_ACL y
        
        # SAFE features
        add_cfg CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT y
        add_cfg CONFIG_KSU_SUSFS_SUS_PATH y
        add_cfg CONFIG_KSU_SUSFS_SPOOF_UNAME y
        
        # ❌ HARD DISABLE (Pixel modem / WLAN killers)
        add_cfg CONFIG_KSU_SUSFS_TRY_UMOUNT n
        add_cfg CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT n
        add_cfg CONFIG_KSU_SUSFS_SUS_MOUNT n
        add_cfg CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT n
        add_cfg CONFIG_KSU_SUSFS_ENABLE_LOG n
        add_cfg CONFIG_KSU_SUSFS_OPEN_REDIRECT n

        # Namespaces
        add_cfg CONFIG_PID_NS y
        add_cfg CONFIG_IPC_NS y
        add_cfg CONFIG_USER_NS y
        add_cfg CONFIG_NET_NS y
        add_cfg CONFIG_UTS_NS y
        
        # Cgroups
        add_cfg CONFIG_CGROUPS y
        add_cfg CONFIG_CGROUP_DEVICE y
        add_cfg CONFIG_CGROUP_CPU y
        add_cfg CONFIG_CGROUP_PIDS y
        add_cfg CONFIG_CGROUP_SCHED y
        add_cfg CONFIG_CGROUP_BPF y
        
        # Filesystems
        add_cfg CONFIG_OVERLAY_FS y
        add_cfg CONFIG_TMPFS y
        
        # Networking
        add_cfg CONFIG_VETH y
        add_cfg CONFIG_BRIDGE y
        add_cfg CONFIG_BRIDGE_NETFILTER y
        add_cfg CONFIG_NETFILTER y
        add_cfg CONFIG_IP_NF_NAT y
        add_cfg CONFIG_IP_NF_TARGET_MASQUERADE y
        add_cfg CONFIG_IPV6 y

         # Add BBR Config
        add_cfg CONFIG_CGROUP_SCHED y
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> ./common/arch/arm64/configs/gki_defconfig
        add_cfg CONFIG_CGROUP_BPF y
          echo "CONFIG_TCP_CONG_BBR=y" >> ./common/arch/arm64/configs/gki_defconfig
        
          echo "CONFIG_NET_SCH_FQ=y" >> ./common/arch/arm64/configs/gki_defconfig
        # Filesystems
          echo "CONFIG_TCP_CONG_BIC=n" >> ./common/arch/arm64/configs/gki_defconfig
        add_cfg CONFIG_OVERLAY_FS y
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> ./common/arch/arm64/configs/gki_defconfig
        add_cfg CONFIG_TMPFS y
          echo "CONFIG_TCP_CONG_HTCP=n" >> ./common/arch/arm64/configs/gki_defconfig

        sed -i 's/check_defconfig//' common/build.config.gki
        sed -i 's/-maybe-dirty//g; s/-dirty//g' common/scripts/setlocalversion

    # --------------------------------------------------
    # Build
    # --------------------------------------------------
    - name: Build kernel
      run: |
        cd "$KERNEL_ROOT"
        sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64
        sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' common/build.config.gki.aarch64
        sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' common/build.config.gki.aarch64
        tools/bazel build --config=fast //common:kernel_aarch64_dist

    # --------------------------------------------------
    # Boot images
    # --------------------------------------------------
    - name: Prepare AVB key
      run: |
        mkdir -p kernel-build-tools/linux-x86/share/avb
        openssl genrsa -out kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem 2048
        echo "BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem" >> "$GITHUB_ENV"

    - name: Build boot images
      run: |
        cd "$KERNEL_ROOT/bazel-bin/common/kernel_aarch64"
        gzip -n -k -f Image
        lz4 -f Image Image.lz4

        for s in "" ".gz" ".lz4"; do
          k="Image$s"
          o="boot${s//./-}.img"
          [ -z "$s" ] && o="boot.img"

          $MKBOOTIMG --header_version 4 --kernel "$k" --output "$o"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64*1024*1024)) \
            --image "$o" --algorithm SHA256_RSA2048 --key "$BOOT_SIGN_KEY_PATH"

          cp "$o" "$GITHUB_WORKSPACE/${CONFIG}-$o"
        done

    - name: Upload boot images
      uses: actions/upload-artifact@v4
      with:
        name: boot-images-${{ env.CONFIG }}
        path: ${{ env.CONFIG }}-boot*.img


      # --------------------------------------------------
      # ANYKERNEL
      # --------------------------------------------------
    - name: Prepare AnyKernel3
      run: |
          cp "$KERNEL_ROOT/bazel-bin/common/kernel_aarch64/Image" AnyKernel3/Image
    - name: Upload AnyKernel3
      uses: actions/upload-artifact@v4
      with:
          name: AnyKernel3
          path: AnyKernel3/**
