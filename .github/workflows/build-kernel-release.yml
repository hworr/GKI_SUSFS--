name: Build and Release GKI Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      build_a12_510:
        description: "Build a12 5.10?"
        type: boolean
        default: false
      build_a13_510:
        description: "Build a13 5.10?"
        type: boolean
        default: false
      build_a13_515:
        description: "Build a13 5.15?"
        type: boolean
        default: false
      build_a14_515:
        description: "Build a14 5.15?"
        type: boolean
        default: false
      build_a14_61:
        description: "Build a14 6.1?"
        type: boolean
        default: true
      build_a15_66:
        description: "Build a15 6.6? (SUSFS REQUIRED)"
        type: boolean
        default: false
      make_release:
        description: "Create GitHub release?"
        type: boolean
        default: true
      kernelsu_variant:
        description: "KernelSU variant"
        type: choice
        options: [SukiSU]
        default: SukiSU
      kernelsu_branch:
        description: "KernelSU branch"
        type: choice
        options: [Stable, Dev, Other]
        default: Dev
      kernelsu_branch_other:
        description: "Custom KernelSU branch / tag"
        type: string
        default: ""

jobs:
  build-kernel-a12-5-10:
    if: ${{ inputs.build_a12_510 }}
    uses: ./.github/workflows/kernel-a12-5.10.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      kernelsu_branch_other: ${{ inputs.kernelsu_branch_other }}

  build-kernel-a13-5-10:
    if: ${{ inputs.build_a13_510 }}
    uses: ./.github/workflows/kernel-a13-5.10.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      kernelsu_branch_other: ${{ inputs.kernelsu_branch_other }}

  build-kernel-a13-5-15:
    if: ${{ inputs.build_a13_515 }}
    uses: ./.github/workflows/kernel-a13-5.15.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      kernelsu_branch_other: ${{ inputs.kernelsu_branch_other }}

  build-kernel-a14-5-15:
    if: ${{ inputs.build_a14_515 }}
    uses: ./.github/workflows/kernel-a14-5.15.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      kernelsu_branch_other: ${{ inputs.kernelsu_branch_other }}

  build-kernel-a14-6-1:
    if: ${{ inputs.build_a14_61 }}
    uses: ./.github/workflows/kernel-a14-6.1.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      kernelsu_branch_other: ${{ inputs.kernelsu_branch_other }}

  build-kernel-a15-6-6:
    if: ${{ inputs.build_a15_66 }}
    uses: ./.github/workflows/kernel-a15-6.6.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      kernelsu_branch_other: ${{ inputs.kernelsu_branch_other }}
      require_susfs: true

  trigger-release:
    if: ${{ inputs.make_release }}
    needs:
      - build-kernel-a12-5-10
      - build-kernel-a13-5-10
      - build-kernel-a13-5-15
      - build-kernel-a14-5-15
      - build-kernel-a14-6-1
      - build-kernel-a15-6-6
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Get current date
        run: echo "currentdate=$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.currentdate }}
          prerelease: true
          release_name: ${{ env.currentdate }}
          body: |
            ⚠️ Test Build – use at your own risk

            Features:
            - SukiSU Ultra (Manual Hook)
            - SUSFS (required for Android 15 / 6.6)
            - Baseband Guard
            - WireGuard + BBR
