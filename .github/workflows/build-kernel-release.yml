name: Build and Release GKI Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      build_a12_510:
        description: "Build Android 12 (5.10)"
        type: boolean
        default: false

      build_a13_510:
        description: "Build Android 13 (5.10)"
        type: boolean
        default: false

      build_a13_515:
        description: "Build Android 13 (5.15)"
        type: boolean
        default: false

      build_a14_515:
        description: "Build Android 14 (5.15)"
        type: boolean
        default: false

      build_a14_61:
        description: "Build Android 14 (6.1)"
        type: boolean
        default: true

      build_a15_66:
        description: "Build Android 15 (6.6)"
        type: boolean
        default: false

      make_release:
        description: "Create GitHub release?"
        type: boolean
        default: true

jobs:
  a12-5-10:
    if: ${{ inputs.build_a12_510 }}
    uses: ./.github/workflows/kernel-a12-5.10.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}

  a13-5-10:
    if: ${{ inputs.build_a13_510 }}
    uses: ./.github/workflows/kernel-a13-5.10.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}

  a13-5-15:
    if: ${{ inputs.build_a13_515 }}
    uses: ./.github/workflows/kernel-a13-5.15.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}

  a14-5-15:
    if: ${{ inputs.build_a14_515 }}
    uses: ./.github/workflows/kernel-a14-5.15.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}

  a14-6-1:
    if: ${{ inputs.build_a14_61 }}
    uses: ./.github/workflows/kernel-a14-6.1.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}

  a15-6-6:
    if: ${{ inputs.build_a15_66 }}
    uses: ./.github/workflows/kernel-a15-6.6.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}
