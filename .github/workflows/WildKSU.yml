name: GKI Kernel Build (WildKSU SUSFS)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      make_release:
        required: true
        type: boolean

      android_version:
        required: true
        type: string

      kernel_version:
        required: true
        type: string

      sub_level:
        required: true
        type: string

      os_patch_level:
        required: true
        type: string

      revision:
        required: false
        type: string

      require_susfs:
        required: false
        type: boolean
        default: false

      variant:
        required: false
        type: string
        description: "Optional build variant (e.g. Hakan, vTomsonek)"

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      # --------------------------------------------------
      # Space & Dependencies
      # --------------------------------------------------
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl python3 ccache unzip lz4

      # --------------------------------------------------
      # ENV
      # --------------------------------------------------
      - name: Set environment variables
        run: |
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
          KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
          {
            echo "CONFIG=$CONFIG"
            echo "KERNEL_ROOT=$KERNEL_ROOT"
            echo "DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig"
            echo "KERNEL_PATCHES=$GITHUB_WORKSPACE/kernel_patches"
            echo "ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3"
            echo "SUSFS4KSU=$GITHUB_WORKSPACE/susfs4ksu"
          } >> "$GITHUB_ENV"
          mkdir -p "$KERNEL_ROOT"

      # --------------------------------------------------
      # TOOLS
      # --------------------------------------------------
      - name: Setup build tools
        run: |
          set -e
          git clone https://android.googlesource.com/kernel/prebuilts/build-tools kernel-build-tools
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg

          echo "PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin:$PATH" >> "$GITHUB_ENV"
          echo "AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool" >> "$GITHUB_ENV"
          # run mkbootimg/unpack_bootimg through python to avoid exec bit issues
          echo "MKBOOTIMG=python3 $GITHUB_WORKSPACE/mkbootimg/mkbootimg.py" >> "$GITHUB_ENV"
          echo "UNPACK_BOOTIMG=python3 $GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py" >> "$GITHUB_ENV"

      - name: Install repo tool
        run: |
          set -e
          mkdir -p git-repo
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > git-repo/repo
          chmod +x git-repo/repo
          echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> "$GITHUB_ENV"
          echo "PATH=$GITHUB_WORKSPACE/git-repo:$PATH" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # CONFIG & CCACHE
      # --------------------------------------------------
      - name: Set CONFIG
        run: |
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
          echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"
          echo "Using CONFIG=$CONFIG"

      - name: Setup ccache
        run: |
          ccache --max-size=2G
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # DEPENDENCIES
      # --------------------------------------------------
      - name: Clone dependencies
        run: |
          set -e
          git clone https://github.com/WildKernels/kernel_patches.git
          git clone https://github.com/WildKernels/AnyKernel3.git
          git clone https://gitlab.com/WildKernels/susfs4ksu.git -b "gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"

      # --------------------------------------------------
      # KERNEL SOURCE
      # --------------------------------------------------
      - name: Initialize and Sync Kernel Source
        run: |
          echo "Creating folder for configuration: $CONFIG..."
          mkdir -p "$CONFIG"
          cd "$CONFIG"
          echo "Initializing and syncing kernel source..."
          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          $REPO init --depth=1 --u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} --repo-rev=v2.16
          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          if grep -q deprecated <<< $REMOTE_BRANCH; then
            echo "Found deprecated branch: $FORMATTED_BRANCH"
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
          fi
          $REPO --version
          $REPO --trace sync -c -j$(nproc --all) --no-tags --fail-fast

      - name: Apply glibc 2.38 Compatibility Fix
        if: inputs.android_version == 'android14' && inputs.kernel_version == '6.1'
        run: |
          if [ ! -e build/build.sh ]; then 
            GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}') 
            echo "GLIBC_VERSION: $GLIBC_VERSION" 
            if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then 
              echo "Patching resolve_btfids/Makefile" 
              cd $CONFIG/common/ && sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile || echo "No patch needed." 
            fi 
          fi

      # --------------------------------------------------
      # WildKSU
      # --------------------------------------------------
      - name: Add WildKSU
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -e
          curl -LSs https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh | bash -s wild

      # --------------------------------------------------
      # SUSFS CORE (REQUIRED)
      # --------------------------------------------------
      - name: Apply SUSFS core patch (REQUIRED)
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -e
          PATCH="$SUSFS4KSU/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch"
          if [ ! -f "$PATCH" ]; then
            echo "SUSFS core patch missing: $PATCH"
            exit 1
          fi
          echo "==> Applying SUSFS core patch"
          patch -p1 < "$PATCH" || true
          rm -f fs/proc/*.rej

      # --------------------------------------------------
      # SUSFS FIX PATCHES (OPTIONAL / SAFE)
      # --------------------------------------------------
      - name: Apply SUSFS fix patches (optional)
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -e
          FIX="$KERNEL_PATCHES/wild/susfs_fix_patches/v2.0.0"

          apply_optional() {
            local p="$1"
            [ -f "$p" ] || return 0
            for lvl in 0 1 2; do
              if patch -p"$lvl" --dry-run < "$p" >/dev/null 2>&1; then
                patch -p"$lvl" < "$p"
                echo "applied $(basename "$p") with -p$lvl"
                return
              fi
            done
            echo "skipped $(basename "$p")"
          }

          apply_optional "$FIX/fix_task_mmu.c.patch"
          apply_optional "$FIX/1_fix_base.c.patch"
          rm -f fs/proc/*.rej

      # --------------------------------------------------
      # Module Check Bypass
      # --------------------------------------------------
      - name: Apply Module Check Bypass
        run: |
          set -e
          if [[ "${{ inputs.kernel_version }}" == "6.1" || "${{ inputs.kernel_version }}" == "6.6" || "${{ inputs.kernel_version }}" == "6.12" ]]; then
            TARGET_FILE="$KERNEL_ROOT/common/kernel/module/version.c"
          else
            TARGET_FILE="$KERNEL_ROOT/common/kernel/module.c"
          fi

          echo "Applying bypass to $TARGET_FILE"
          sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET_FILE"

          if grep -A 5 "bad_version:" "$TARGET_FILE" | grep -q "return 1;"; then
            echo "SUCCESS: Module check bypass verified in $TARGET_FILE"
          else
            echo "FAILED: Module check bypass not found in $TARGET_FILE"
            grep -A 5 "bad_version:" "$TARGET_FILE" || true
            exit 1
          fi

      # --------------------------------------------------
      # Kernel config
      # --------------------------------------------------
      - name: Kernel config
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -e
          DEFCONFIG="common/arch/arm64/configs/gki_defconfig"

          # Basic KSU
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_KSU_MANUAL_SU=n"
          } >> "$DEFCONFIG"

          # SUSFS toggle
          if [ "${{ inputs.require_susfs }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
          else
            echo "CONFIG_KSU_SUSFS=n" >> "$DEFCONFIG"
          fi

          
          {  
            # WiFi / RF
            echo "CONFIG_RFKILL=m" >> "$DEFCONFIG"
            echo "CONFIG_CFG80211=m" >> "$DEFCONFIG"
            echo "CONFIG_MAC80211=m" >> "$DEFCONFIG"
                  
            # Bluetooth
            echo "CONFIG_BT=m" >> "$DEFCONFIG"
            echo "CONFIG_BT_HCIUART=m" >> "$DEFCONFIG"
            echo "CONFIG_BT_HCIUART_QCA=m" >> "$DEFCONFIG"
            echo "CONFIG_BT_HCIUART_BCM=m" >> "$DEFCONFIG"
            echo "CONFIG_BT_HCIUART=m" >> "$DEFCONFIG"
            
            echo "CONFIG_TMPFS_XATTR=y"
            echo "CONFIG_TMPFS_POSIX_ACL=y"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=n"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=n"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=n"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=n"
          } >> "$DEFCONFIG"

          # Extra net/tcp options etc. (kept, but now syntactically valid)
          {
            echo "CONFIG_TCP_CONG_ADVANCED=y"
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_NET_SCH_FQ=y"
            echo "CONFIG_TCP_CONG_BIC=n"
            echo "CONFIG_TCP_CONG_WESTWOOD=n"
            echo "CONFIG_TCP_CONG_HTCP=n"
            echo "CONFIG_IP_SET=y"
            echo "CONFIG_IP_SET_MAX=65534"
            echo "CONFIG_IP_SET_BITMAP_IP=y"
            echo "CONFIG_IP_SET_BITMAP_IPMAC=y"
            echo "CONFIG_IP_SET_BITMAP_PORT=y"
            echo "CONFIG_IP_SET_HASH_IP=y"
            echo "CONFIG_IP_SET_HASH_IPMARK=y"
            echo "CONFIG_IP_SET_HASH_IPPORT=y"
            echo "CONFIG_IP_SET_HASH_IPPORTIP=y"
            echo "CONFIG_IP_SET_HASH_IPPORTNET=y"
            echo "CONFIG_IP_SET_HASH_IPMAC=y"
            echo "CONFIG_IP_SET_HASH_MAC=y"
            echo "CONFIG_IP_SET_HASH_NETPORTNET=y"
            echo "CONFIG_IP_SET_HASH_NET=y"
            echo "CONFIG_IP_SET_HASH_NETNET=y"
            echo "CONFIG_IP_SET_HASH_NETPORT=y"
            echo "CONFIG_IP_SET_HASH_NETIFACE=y"
            echo "CONFIG_IP_SET_LIST_SET=y"
          } >> "$DEFCONFIG"

          # Disable defconfig checks for android16/6.12 special case
          if [[ "${{ inputs.android_version }}" == "android16" && "${{ inputs.kernel_version }}" == "6.12" ]]; then
            sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel
          else
            sed -i 's/check_defconfig//g' common/build.config.gki || true
          fi

          # Strip -maybe-dirty / -dirty from version
          sed -i 's/-maybe-dirty//g' common/scripts/setlocalversion || true
          sed -i 's/-dirty//g' common/scripts/setlocalversion || true

      # --------------------------------------------------
      # Optional variants
      # --------------------------------------------------
      - name: Configure Audio Modules (Hakan)
        if: ${{ inputs.variant == 'Hakan' }}
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -e
          DEFCONFIG="${DEFCONFIG:-common/arch/arm64/configs/gki_defconfig}"

          cat >> "$DEFCONFIG" << 'EOF'
            CONFIG_RFKILL=y
            CONFIG_CFG80211=y
            CONFIG_MAC80211=y
            EOF

          # Example of cleaning modules list; adjust paths/patterns as desired
          sed -i \
            -e '/_COMMON_GKI_MODULES_LIST = \[/,/^[[:space:]]*\]/{/^[[:space:]]*"lib\/crypto\/libarc4\.ko",[[:space:]]*$/d}' \
            -e '/_COMMON_GKI_MODULES_LIST = \[/,/^[[:space:]]*\]/{/^[[:space:]]*"net\/rfkill\/rfkill\.ko",[[:space:]]*$/d}' \
            common/modules.bzl || true

      - name: Configure SND (vTomsonek)
        if: ${{ inputs.variant == 'vTomsonek' }}
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -e
          DEFCONFIG="${DEFCONFIG:-common/arch/arm64/configs/gki_defconfig}"

          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_SND=y
          CONFIG_SND_DRIVERS=y
          CONFIG_SND_PCM=y
          CONFIG_SND_TIMER=y
          CONFIG_SND_DYNAMIC_MINORS=y
          CONFIG_SND_PROC_FS=y
          CONFIG_SND_ALOOP=m
          CONFIG_USB_GADGET=y
          CONFIG_CONFIGFS_FS=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_LIBCOMPOSITE=m
          CONFIG_USB_AUDIO=m
          CONFIG_USB_CONFIGFS_F_UAC1=y
          CONFIG_USB_CONFIGFS_F_UAC2=y
          EOF

          echo "drivers/usb/gadget/legacy/g_audio.ko" >> common/android/gki_aarch64_modules
          echo "sound/drivers/snd-aloop.ko" >> common/android/gki_aarch64_modules

          if [[ -f common/modules.bzl ]]; then
            # Add modules to modules.bzl list (simple append variant)
            sed -i '/_COMMON_GKI_MODULES_LIST = \[/,/^[[:space:]]*\]/{/^[[:space:]]*\]$/i\    "sound/drivers/snd-aloop.ko",
            }' common/modules.bzl

            sed -i '/_COMMON_GKI_MODULES_LIST = \[/,/^[[:space:]]*\]/{/^[[:space:]]*\]$/i\    "drivers/usb/gadget/libcomposite.ko",
            }' common/modules.bzl

            sed -i '/_COMMON_GKI_MODULES_LIST = \[/,/^[[:space:]]*\]/{/^[[:space:]]*\]$/i\    "drivers/usb/gadget/legacy/g_audio.ko",
            }' common/modules.bzl

            # Verify injection
            if grep -q '"sound/drivers/snd-aloop.ko"' common/modules.bzl && \
               grep -q '"drivers/usb/gadget/libcomposite.ko"' common/modules.bzl && \
               grep -q '"drivers/usb/gadget/legacy/g_audio.ko"' common/modules.bzl; then
              echo "Audio modules injection succeeded"
            else
              echo "Audio modules injection failed"
              exit 1
            fi
          fi

          if [ -f common/drivers/android/binder/Makefile ]; then
          perl -i -0777 -pe 's/\$\(\s*CONFIG_ANDROID_BINDER_IPC_RUST\s*\)/m/' common/drivers/android/binder/Makefile
          #perl -i -ne 'print unless /CONFIG_ANDROID_BINDER_IPC_RUST_DUMMY/' common/drivers/android/binder/Makefile
          perl -i -pe 's/^rust_binder-\$\([^)]+\)\s*:=/rust_binder-y :=/' common/drivers/android/binder/Makefile
          cat common/drivers/android/Makefile
          cat common/drivers/android/binder/Makefile
          #perl -ni -e 'print unless /rust_toolchain\s*=\s*"\/\/build\/rust:linux_kernel_toolchain",/' common/BUILD.bazel
          #cat common/BUILD.bazel
          rustup set profile minimal
          rustup update nightly
          rustup default nightly
          rustup target add aarch64-unknown-none
          else
          perl -i -0777 -pe 's/\$\(\s*CONFIG_ANDROID_BINDER_IPC_RUST\s*\)/m/' common/drivers/android/Makefile
          cat common/drivers/android/Makefile
          fi

          - name: Change Kernel Name
          if: ${{ inputs.use_make == false }}
          run: |
          cd "$CONFIG"
          if [ -f "build/build.sh" ]; then
              perl -pi -e 's/-dirty//' ./common/scripts/setlocalversion
              perl -0777 -pi -e 's/(echo "\$res")(?!.*echo "\$res")/echo "\$res-${{ inputs.kernelsu_variant }}-\$KSUVER-SUSFS-v1.5.9-Wild"/s' ./common/scripts/setlocalversion
              perl -pi -e 's{UTS_VERSION="\$\(echo \$UTS_VERSION \$CONFIG_FLAGS \$TIMESTAMP \| cut -b -\$UTS_LEN\)"}{UTS_VERSION="#1 SMP PREEMPT Sun Apr 20 04:20:00 UTC 2025"}' ./common/scripts/mkcompile_h
          else
              #Remove -maybe-dirty
              perl -pi -e 's/-maybe-dirty//g' ./build/kernel/kleaf/impl/stamp.bzl
              
              #Set Kernel Name
              echo "CONFIG_LOCALVERSION=\"-${{ inputs.kernelsu_variant }}-$KSUVER-SUSFS-v1.5.9-Wild\"" >> ./common/arch/arm64/configs/gki_defconfig

              #Set Kernel Timestamp
              perl -pi -e 's/build-timestamp = \$\(or \$\(KBUILD_BUILD_TIMESTAMP\), \$\(build-timestamp-auto\)\)/build-timestamp = "Sun Apr 20 04:20:00 UTC 2025"/' ./common/init/Makefile

              #Remove Abi Exports and Error
              rm -rf ./common/android/abi_gki_protected_exports_*
              perl -pi -e 's/^\s*"protected_exports_list"\s*:\s*"android\/abi_gki_protected_exports_aarch64",\s*$//;' ./common/BUILD.bazel
            fi

            
      # --------------------------------------------------
      # Build
      # --------------------------------------------------
      - name: Build kernel
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -e

          # Adjust build.config for our purposes
          sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64 || true
          sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' common/build.config.gki.aarch64 || true
          sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' common/build.config.gki.aarch64 || true

          # Some trees provide a bazel wrapper at ./tools/bazel; if not, we expect bazel in PATH.
          if [ -x tools/bazel ]; then
            BAZEL=tools/bazel
          else
            BAZEL=bazel
          fi

          "$BAZEL" build --config=fast //common:kernel_aarch64_dist

      # --------------------------------------------------
      # Collect Image
      # --------------------------------------------------
      - name: Collect Image
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "bazel-bin/common/kernel_aarch64/Image" "$GITHUB_WORKSPACE/out/"

      - name: Upload artifact (Image)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.CONFIG }}
          path: out/*

      # --------------------------------------------------
      # Prepare bootimgs directory
      # --------------------------------------------------
      - name: Prepare bootimgs directory
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/bootimgs"
          cp "bazel-bin/common/kernel_aarch64/Image"* "$GITHUB_WORKSPACE/bootimgs/"

      # --------------------------------------------------
      # Build Boot Images
      # --------------------------------------------------
      - name: Prepare AVB test key
        run: |
          set -e
          mkdir -p kernel-build-tools/linux-x86/share/avb
          openssl genrsa -out kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem 2048
          echo "BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem" >> "$GITHUB_ENV"

      - name: Build Boot Images
        working-directory: bootimgs
        run: |
          set -e

          RAMDISK_ARGS=""

          if [[ "${{ inputs.android_version }}" == "android12" ]]; then
            GKI_URL="https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-${{ inputs.os_patch_level }}_r1.zip"
            FALLBACK_URL="https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-2023-01_r1.zip"

            if curl -sL -w "%{http_code}" "$GKI_URL" -o /dev/null | grep -q 200; then
              curl -Lo gki-kernel.zip "$GKI_URL"
            else
              curl -Lo gki-kernel.zip "$FALLBACK_URL"
            fi

            unzip -q gki-kernel.zip && rm gki-kernel.zip

            $UNPACK_BOOTIMG --boot_img="$(pwd)/boot-5.10.img"
            RAMDISK_ARGS="--ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level ${{ inputs.os_patch_level }}"
          fi

          # Create compressed kernels
          rm -f Image.lz4
          lz4 Image Image.lz4

          for suffix in "" ".gz" ".lz4"; do
            kernel="Image${suffix}"
            output="boot${suffix//./-}.img"
            [ -z "$suffix" ] && output="boot.img"

            $MKBOOTIMG \
              --header_version 4 \
              --kernel "$kernel" \
              --output "$output" \
              $RAMDISK_ARGS

            $AVBTOOL add_hash_footer \
              --partition_name boot \
              --partition_size $((64 * 1024 * 1024)) \
              --image "$output" \
              --algorithm SHA256_RSA2048 \
              --key "$BOOT_SIGN_KEY_PATH"

            cp "$output" "$GITHUB_WORKSPACE/${CONFIG}-$output"
          done

      # --------------------------------------------------
      # Upload boot.img files
      # --------------------------------------------------
      - name: Upload boot images
        uses: actions/upload-artifact@v4
        with:
          name: boot-images-${{ env.CONFIG }}
          path: |
            ${{ env.CONFIG }}-boot.img
            ${{ env.CONFIG }}-boot-gz.img
            ${{ env.CONFIG }}-boot-lz4.img

      # --------------------------------------------------
      # ANYKERNEL
      # --------------------------------------------------
      - name: Prepare AnyKernel3
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -e
          cp "bazel-bin/common/kernel_aarch64/Image" "$GITHUB_WORKSPACE/AnyKernel3/Image"

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3
          path: AnyKernel3/**
