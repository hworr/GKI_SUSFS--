name: GKI Kernel Build (WildKSU / SukiSU / KernelSU Next + SUSFS)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android Version"
        type: choice
        options: ["14", "15", "16"]
        default: "15"

      kernel_version:
        description: "Kernel Version"
        type: choice
        options: ["5.15", "6.1", "6.6"]
        default: "6.6"

      os_patch_level:
        description: "OS Patch Level (YYYY-MM)"
        type: string
        default: "2025-09"

      ksu_variant:
        description: "KernelSU Variant"
        type: choice
        options:
          - wildksu
          - sukisu
          - kernelsu-next
        default: wildksu

      enable_susfs:
        description: "Enable SUSFS (KernelSU Next ≥ 3.0)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_CPP2: "yes"

    steps:
    # --------------------------------------------------
    # SPACE
    # --------------------------------------------------
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
        df -h

    # --------------------------------------------------
    # DEPS
    # --------------------------------------------------
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          build-essential zip curl ccache \
          python3 python3-pip

    # --------------------------------------------------
    # VARS
    # --------------------------------------------------
    - name: Set variables
      run: |
        BRANCH="android${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
        echo "BRANCH=$BRANCH" >> $GITHUB_ENV
        echo "KERNEL_ROOT=$GITHUB_WORKSPACE/kernel" >> $GITHUB_ENV
        echo "Using branch: $BRANCH"

    # --------------------------------------------------
    # KERNEL SOURCE (FIXED BRANCH)
    # --------------------------------------------------

    - name: Download Kernel Source
      run: |
          cd $GITHUB_WORKSPACE
          
          BRANCH="${{ steps.vars.outputs.BRANCH }}"
          
          echo "Downloading manifest for ${BRANCH}..."
          
          # Manifest URL ermitteln
          MANIFEST_URL="https://android.googlesource.com/kernel/manifest"
          
          mkdir -p kernel_workspace && cd kernel_workspace
          
          # Repo init
          repo init -u $MANIFEST_URL -b common-${BRANCH} --depth=1
          
          # Sync
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

    # --------------------------------------------------
    # KERNELSU (FINAL FIX)
    # --------------------------------------------------
    - name: Apply KernelSU variant
      working-directory: kernel
      run: |
        case "${{ inputs.ksu_variant }}" in
          wildksu)
            git clone https://github.com/WildPlusKernel/KernelSU.git KernelSU
            cd KernelSU
            bash setup.sh
            ;;
          sukisu)
            git clone https://github.com/SukiSU/KernelSU.git KernelSU
            cd KernelSU
            bash setup.sh
            ;;
         kernelsu-next)
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git kernelsu-next
          bash kernelsu-next/kernel/setup.sh .
          ;;
        esac

    # --------------------------------------------------
    # SUSFS 2.0 (KERNELSU NEXT ONLY)
    # --------------------------------------------------
    - name: Apply SUSFS 2.0 (KernelSU Next)
      if: ${{ inputs.ksu_variant == 'kernelsu-next' && inputs.enable_susfs }}
      working-directory: kernel
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -e
    
        echo "Cloning SUSFS (default branch)"
        git clone https://x-access-token:${GITHUB_TOKEN}@github.com/sidex15/susfs.git
    
        echo "Applying SUSFS 2.0 AIO patch"
        patch -p1 < susfs/kernel_patches/susfs-2.0-AIO.patch
            
            cd common
            
            # SUSFS Dateien kopieren
            echo "Copying SUSFS source files..."
            
            SUSFS_SRC="../susfs/kernel_patches"
            
            # Kernel source files
            cp "${SUSFS_SRC}/fs/susfs.c" fs/ 2>/dev/null || true
            cp "${SUSFS_SRC}/include/linux/susfs.h" include/linux/ 2>/dev/null || true
            
            # Kernel patches anwenden
            echo "Applying SUSFS kernel patches..."
            
            KV="${{ steps.vars.outputs.KERNEL_VERSION }}"
            PATCH_DIR="${SUSFS_SRC}/50_add_susfs_in_${KV}"
            
            if [ -d "$PATCH_DIR" ]; then
              for patch in "$PATCH_DIR"/*.patch; do
                if [ -f "$patch" ]; then
                  echo "Applying: $(basename $patch)"
                  git apply "$patch" || patch -p1 --forward < "$patch" || true
                fi
              done
            else
              echo "No patches found in: $PATCH_DIR"
              ls -la "${SUSFS_SRC}/" || true
            fi
            
            # KernelSU SUSFS patch
            echo "Applying KernelSU SUSFS integration patch..."
            
            KSU_PATCH="${SUSFS_SRC}/KernelSU/10_enable_susfs_for_ksu.patch"
            
            if [ -f "$KSU_PATCH" ]; then
              if [ -d "KernelSU" ]; then
                cd KernelSU
                git apply "$KSU_PATCH" || patch -p1 --forward < "$KSU_PATCH" || true
                cd ..
              elif [ -d "drivers/kernelsu" ]; then
                cd drivers/kernelsu
                git apply "$KSU_PATCH" || patch -p1 --forward < "$KSU_PATCH" || true
                cd ../..
              fi
              
              echo "✓ SUSFS setup complete"
              
    - name: Apply Additional Patches
      run: |
            cd common
            
            # Verstecke KernelSU Symbole (Anti-Detection)
            echo "Applying anti-detection patches..."
            
            # Symbol hiding wenn vorhanden
            if [ -f "../susfs/kernel_patches/hide_stuff.patch" ]; then
              git apply "../susfs/kernel_patches/hide_stuff.patch" || true
            fi

    # --------------------------------------------------
    # DEFCONFIG
    # --------------------------------------------------
    - name: Configure kernel
      working-directory: kernel
      run: |
        DEFCONFIG=common/arch/arm64/configs/gki_defconfig

        echo "CONFIG_KSU=y" >> $DEFCONFIG
        echo "CONFIG_KSU_LSM_SECURITY_HOOKS=y" >> $DEFCONFIG

        if [[ "${{ inputs.ksu_variant }}" != "kernelsu-next" || "${{ inputs.enable_susfs }}" == "true" ]]; then
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
        fi

    # --------------------------------------------------
    # BUILD
    # --------------------------------------------------
    - name: Build kernel (Bazel)
      working-directory: kernel
      run: |
        tools/bazel build \
          --config=fast \
          --lto=thin \
          //common:kernel_aarch64_dist

    # --------------------------------------------------
    # BOOT.IMG
    # --------------------------------------------------
    - name: Build boot.img
      working-directory: kernel
      run: |
        mkdir -p out
        cp bazel-bin/common/kernel_aarch64/Image out/Image

        python3 build/build-tools/mkbootimg.py \
          --kernel out/Image \
          --header_version 4 \
          --pagesize 4096 \
          --os_version ${{ inputs.android_version }}.0.0 \
          --os_patch_level ${{ inputs.os_patch_level }} \
          -o out/boot.img

    # --------------------------------------------------
    # UPLOAD
    # --------------------------------------------------
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: boot-${{ inputs.ksu_variant }}
        path: kernel/out/boot.img
