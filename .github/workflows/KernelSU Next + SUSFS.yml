name: GKI Kernel Build (WildKSU / SukiSU / KernelSU Next + SUSFS)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android Version"
        type: choice
        options: ["14", "15", "16"]
        default: "15"

      kernel_version:
        description: "Kernel Version"
        type: choice
        options: ["5.15", "6.1", "6.6"]
        default: "6.6"

      os_patch_level:
        description: "OS Patch Level (YYYY-MM)"
        type: string
        default: "2025-09"

      ksu_variant:
        description: "KernelSU Variant"
        type: choice
        options:
          - wildksu
          - sukisu
          - kernelsu-next
        default: wildksu

      enable_susfs:
        description: "Enable SUSFS 2.0 (KernelSU Next only)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_CPP2: "yes"

    steps:
    # --------------------------------------------------
    # SPACE
    # --------------------------------------------------
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
        df -h

    # --------------------------------------------------
    # DEPS
    # --------------------------------------------------
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          build-essential zip curl ccache \
          python3 python3-pip

    # --------------------------------------------------
    # VARS
    # --------------------------------------------------
    - name: Set variables
      run: |
        BRANCH="android${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
        echo "BRANCH=$BRANCH" >> $GITHUB_ENV
        echo "KERNEL_ROOT=$GITHUB_WORKSPACE/kernel" >> $GITHUB_ENV
        echo "Using kernel branch: $BRANCH"

    # --------------------------------------------------
    # INSTALL REPO TOOL (REQUIRED)
    # --------------------------------------------------
    - name: Install repo tool
      run: |
          sudo curl -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod +x /usr/local/bin/repo
          repo --version

    # --------------------------------------------------
    # KERNEL SOURCE (FAST: repo sync)
    # --------------------------------------------------
    - name: Download kernel source (repo sync)
      run: |
        set -e
    
        BRANCH="android${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
        echo "Using kernel branch: $BRANCH"
    
        MANIFEST_URL="https://android.googlesource.com/kernel/manifest"
    
        mkdir -p kernel_workspace
        cd kernel_workspace
    
        repo init \
          -u $MANIFEST_URL \
          -b common-${BRANCH} \
          --depth=1
    
        repo sync \
          -c \
          -j$(nproc) \
          --no-tags \
          --no-clone-bundle
    
        # Wichtig: common → kernel (damit Rest vom Workflow passt)
        mv common ../kernel

    # --------------------------------------------------
    # KERNELSU (FINAL & CORRECT)
    # --------------------------------------------------
    - name: Apply KernelSU variant
      working-directory: kernel
      run: |
        set -e

        case "${{ inputs.ksu_variant }}" in
          wildksu)
            git clone https://github.com/WildPlusKernel/KernelSU.git KernelSU
            cd KernelSU
            bash setup.sh
            ;;
          sukisu)
            git clone https://github.com/SukiSU/KernelSU.git KernelSU
            cd KernelSU
            bash setup.sh
            ;;
          kernelsu-next)
            git clone https://github.com/KernelSU-Next/KernelSU-Next.git kernelsu-next
            # OFFIZIELLER Weg – nichts manuell kopieren
            bash kernelsu-next/kernel/setup.sh .
            ;;
        esac

    # --------------------------------------------------
    # SUSFS 2.0 (KernelSU Next)
    # --------------------------------------------------
    - name: Setup SUSFS
      if: inputs.enable_susfs
      run: |
            cd $GITHUB_WORKSPACE/kernel_workspace
            
            # Kernel Source Verzeichnis finden (gleiche Logik wie KernelSU)
            if [ -d "common" ]; then
              KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/common"
            elif [ -d "private/gs-google" ]; then
              KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/private/gs-google"
            elif [ -d "aosp" ]; then
              KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/aosp"
            else
              KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace"
            fi
            
            SUSFS_BRANCH="${{ steps.vars.outputs.SUSFS_BRANCH }}"
            
            echo "Cloning SUSFS branch: ${SUSFS_BRANCH}..."
            echo "Kernel directory: $KERNEL_DIR"
            
            # SUSFS klonen
            git clone --depth=1 -b "${SUSFS_BRANCH}" \
              https://github.com/WildKernels/susfs4ksu.git susfs || \
            git clone --depth=1 -b "${SUSFS_BRANCH}" \
              https://gitlab.com/simonpunk/susfs4ksu.git susfs
            
            cd "$KERNEL_DIR"
            
            SUSFS_SRC="$GITHUB_WORKSPACE/kernel_workspace/susfs/kernel_patches"
            KV="${{ steps.vars.outputs.KERNEL_VERSION }}"
            
            # 1. SUSFS Kernel-Dateien kopieren
            echo "Copying SUSFS source files..."
            cp "${SUSFS_SRC}/fs/susfs.c" fs/ 2>/dev/null && echo "  ✓ susfs.c" || echo "  ✗ susfs.c not found"
            cp "${SUSFS_SRC}/include/linux/susfs.h" include/linux/ 2>/dev/null && echo "  ✓ susfs.h" || echo "  ✗ susfs.h not found"
            
            # 2. Kernel patches anwenden
            echo "Applying SUSFS kernel patches for ${KV}..."
            
            PATCH_DIR="${SUSFS_SRC}/50_add_susfs_in_${KV}"
            
            if [ -d "$PATCH_DIR" ]; then
              for patch in "$PATCH_DIR"/*.patch; do
                if [ -f "$patch" ]; then
                  echo "Applying: $(basename $patch)"
                  git apply --check "$patch" 2>/dev/null && git apply "$patch" || \
                  patch -p1 --forward < "$patch" || \
                  echo "  (may already be applied)"
                fi
              done
            else
              echo "WARNING: No patches found in: $PATCH_DIR"
              echo "Available directories:"
              ls -la "${SUSFS_SRC}/" 2>/dev/null || true
            fi
            
            # 3. KernelSU SUSFS Integration Patch
            echo "Applying KernelSU SUSFS integration patch..."
            
            KSU_PATCH="${SUSFS_SRC}/KernelSU/10_enable_susfs_for_ksu.patch"
            
            if [ -f "$KSU_PATCH" ] && [ -d "drivers/kernelsu" ]; then
              cd drivers/kernelsu
              echo "Patching KernelSU for SUSFS support..."
              git apply --check "$KSU_PATCH" 2>/dev/null && git apply "$KSU_PATCH" || \
              patch -p1 --forward < "$KSU_PATCH" || \
              echo "  (may already be applied)"
              cd ../..
            fi
            
            echo "✓ SUSFS setup complete"
    - name: Apply Additional Patches
      if: inputs.enable_susfs
      run: |
            cd $GITHUB_WORKSPACE/kernel_workspace
            
            # Kernel Source Verzeichnis finden
            if [ -d "common" ]; then
              KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/common"
            elif [ -d "private/gs-google" ]; then
              KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/private/gs-google"
            elif [ -d "aosp" ]; then
              KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/aosp"
            else
              KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace"
            fi
            
            cd "$KERNEL_DIR"
            
            # Verstecke KernelSU Symbole (Anti-Detection)
            echo "Applying anti-detection patches..."
            
            SUSFS_SRC="$GITHUB_WORKSPACE/kernel_workspace/susfs/kernel_patches"
            
            if [ -f "$SUSFS_SRC/hide_stuff.patch" ]; then
              git apply "$SUSFS_SRC/hide_stuff.patch" || echo "hide_stuff.patch may already be applied"
            fi

    # --------------------------------------------------
    # DEFCONFIG
    # --------------------------------------------------
    - name: Configure kernel
      working-directory: kernel
      run: |
        DEFCONFIG=common/arch/arm64/configs/gki_defconfig

        echo "CONFIG_KSU=y" >> $DEFCONFIG
        echo "CONFIG_KSU_LSM_SECURITY_HOOKS=y" >> $DEFCONFIG

        if [[ "${{ inputs.ksu_variant }}" != "kernelsu-next" || "${{ inputs.enable_susfs }}" == "true" ]]; then
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
        fi

    # --------------------------------------------------
    # BUILD
    # --------------------------------------------------
    - name: Build kernel (Bazel GKI)
      working-directory: kernel
      run: |
        tools/bazel build \
          --config=fast \
          --lto=thin \
          //common:kernel_aarch64_dist

    # --------------------------------------------------
    # BOOT.IMG
    # --------------------------------------------------
    - name: Build boot.img
      working-directory: kernel
      run: |
        mkdir -p out
        cp bazel-bin/common/kernel_aarch64/Image out/Image

        python3 build/build-tools/mkbootimg.py \
          --kernel out/Image \
          --header_version 4 \
          --pagesize 4096 \
          --os_version ${{ inputs.android_version }}.0.0 \
          --os_patch_level ${{ inputs.os_patch_level }} \
          -o out/boot.img

    # --------------------------------------------------
    # UPLOAD
    # --------------------------------------------------
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: boot-${{ inputs.ksu_variant }}
        path: kernel/out/boot.img
