name: GKI Kernel Build (KernelSU Next)

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      make_release:
        required: true
        type: boolean

      android_version:
        required: true
        type: string

      kernel_version:
        required: true
        type: string

      sub_level:
        required: true
        type: string

      os_patch_level:
        required: true
        type: string

      kernelsu_variant:          # ✅ HINZUFÜGEN
        required: true
        type: string

      kernelsu_branch:
        required: true
        type: string

      kernelsu_branch_other:
        required: false
        type: string

      revision:                  # ✅ HINZUFÜGEN
        required: false
        type: string

      require_susfs:
        required: false
        type: boolean
        default: false

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl python3 ccache repo

      - name: Set CONFIG
        run: |
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV

      - name: Setup ccache
        run: |
          ccache --max-size=2G
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Init kernel source
        run: |
          mkdir "$CONFIG"
          cd "$CONFIG"

          BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          repo init --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-$BRANCH

          repo sync -c -j$(nproc) --no-tags

      # -------------------------------
      # KernelSU NEXT (FIXT 6.6 + A15)
      # -------------------------------
      - name: Add KernelSU Next
        run: |
          cd "$CONFIG"
          curl -LSs - name: Add KernelSU-Next
  run: |
    cd "$CONFIG"
    curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash - | bash

      # -------------------------------
      # SUSFS (optional)
      # -------------------------------
      - name: Clone SUSFS
        if: ${{ inputs.require_susfs }}
        run: |
          git clone https://github.com/ShirkNeko/susfs4ksu.git

      - name: Apply SUSFS patches
        if: ${{ inputs.require_susfs }}
        run: |
          cd "$CONFIG"

          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch common/
          cp ../susfs4ksu/kernel_patches/fs/* common/fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* common/include/linux/

          cd common
          patch -p1 --fuzz=3 < 50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch

      # -------------------------------
      # Kernel config
      # -------------------------------
      - name: Kernel config
        run: |
          cd "$CONFIG"

          DEFCONFIG=common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEFCONFIG
          echo "CONFIG_KSU_MANUAL_SU=n" >> $DEFCONFIG

          if [ "${{ inputs.require_susfs }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          else
            echo "CONFIG_KSU_SUSFS=n" >> $DEFCONFIG
          fi

          sed -i 's/check_defconfig//' common/build.config.gki

      # -------------------------------
      # Build
      # -------------------------------
      - name: Build kernel
        run: |
          cd "$CONFIG"

          sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64
          sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' common/build.config.gki.aarch64
          sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' common/build.config.gki.aarch64

          tools/bazel build --config=fast //common:kernel_aarch64_dist

      # -------------------------------
      # Collect Image
      # -------------------------------
      - name: Collect Image
        run: |
          mkdir out
          cp "$CONFIG/bazel-bin/common/kernel_aarch64/Image" out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.CONFIG }}
          path: out/*
