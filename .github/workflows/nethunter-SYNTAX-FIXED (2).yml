name: NetHunter Kernel Build (SukiSU + SUSFS)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android Version"
        required: true
        type: choice
        options: ["14", "15"]
        default: "15"
      kernel_version:
        description: "Kernel Version"
        required: true
        type: choice
        options: ["5.15", "6.1", "6.6"]
        default: "6.6"
      os_patch_level:
        description: "OS Patch Level (YYYY-MM)"
        required: true
        type: string
        default: "2025-09"
      kernelsu_branch:
        description: "KernelSU Branch"
        required: true
        type: choice
        options: ["builtin", "main"]
        default: "builtin"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_VERSION: ${{ inputs.android_version }}
      KERNEL_VERSION: ${{ inputs.kernel_version }}
      OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
      KERNELSU_BRANCH: ${{ inputs.kernelsu_branch }}
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_CPP2: "yes"

    steps:
    # --------------------------------------------------
    # ENV
    # --------------------------------------------------
    - name: Set GKI branch
      run: |
        set -e
        BRANCH="android${ANDROID_VERSION}-${KERNEL_VERSION}-${OS_PATCH_LEVEL}"
        echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
        echo "Using branch: common-$BRANCH"

    - name: Maximize build space
      uses: easimon/maximize-build-space@master

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git curl python3 ccache clang lld llvm \
          bc bison flex libelf-dev libssl-dev

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: /home/runner/.ccache
        key: ccache-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-${{ env.OS_PATCH_LEVEL }}
        restore-keys: |
          ccache-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-
          ccache-${{ env.ANDROID_VERSION }}-
          ccache-

    - name: Setup ccache
      run: |
        ccache --max-size=15G
        ccache --set-config=compression=true
        ccache --zero-stats

    # --------------------------------------------------
    # REPO
    # --------------------------------------------------
    - name: Init & sync kernel repo
      run: |
        set -e
        mkdir -p "$HOME/bin"
        curl -o "$HOME/bin/repo" https://storage.googleapis.com/git-repo-downloads/repo
        chmod +x "$HOME/bin/repo"

        "$HOME/bin/repo" init \
          -u https://android.googlesource.com/kernel/manifest \
          -b common-${BRANCH}

        "$HOME/bin/repo" sync -j$(nproc --all) --fail-fast

    - name: Verify kernel workspace
      run: |
        test -d common || exit 1
        test -d .repo || exit 1
        echo "✓ Kernel workspace ready"

    # --------------------------------------------------
    # CLEAN (ONCE, BEFORE PATCHES)
    # --------------------------------------------------
    - name: Clean kernel tree (GKI requirement)
      working-directory: common
      run: make mrproper

    # --------------------------------------------------
    # EXTERNAL REPOS
    # --------------------------------------------------
    - name: Clone SUSFS & AnyKernel3
      run: |
        git clone https://github.com/ShirkNeko/susfs4ksu.git
        git clone https://github.com/MiRinChan/AnyKernel3.git

    # --------------------------------------------------
    # KERNELSU (SukiSU)
    # --------------------------------------------------
    - name: Add SukiSU
      run: |
        curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh \
          | bash -s "${KERNELSU_BRANCH}"

        rm -f drivers/kernelsu/allowlist.c drivers/kernelsu/app_profile.c || true

    # --------------------------------------------------
    # SUSFS (NEW LAYOUT – CORRECT)
    # --------------------------------------------------
    - name: Apply SUSFS patch
      working-directory: common
      run: |
        set -e
        PATCH=$(find "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches" -name "*${KERNEL_VERSION}*.patch" | head -1)
        test -f "$PATCH" || { echo "No SUSFS patch found"; exit 1; }
        patch -p1 < "$PATCH" || true
        find . -name "*.rej" -delete || true

    - name: Copy SUSFS header
      run: |
        cp susfs4ksu/kernel_patches/include/linux/susfs.h \
           common/include/linux/susfs.h

    - name: Create SUSFS stub (required)
      run: |
        set -e
        mkdir -p common/fs/susfs

        cat > common/fs/susfs/Makefile << 'EOF'
obj-$(CONFIG_SUSFS) += susfs.o
susfs-y := sus_su.o
EOF

        cat > common/fs/susfs/Kconfig << 'EOF'
config SUSFS
    bool "SUSFS support"
    depends on KSU
    default y
EOF

        cat > common/fs/susfs/sus_su.c << 'EOF'
#include <linux/module.h>
#include <linux/susfs.h>
bool susfs_is_current_proc_umounted(void) { return false; }
EXPORT_SYMBOL(susfs_is_current_proc_umounted);
EOF

        grep -q 'fs/susfs' common/fs/Kconfig || \
          echo 'source "fs/susfs/Kconfig"' >> common/fs/Kconfig

        grep -q 'susfs/' common/fs/Makefile || \
          echo 'obj-$(CONFIG_SUSFS) += susfs/' >> common/fs/Makefile

        echo "✓ SUSFS stub ready"

    # --------------------------------------------------
    # DEFCONFIG
    # --------------------------------------------------
    - name: Patch gki_defconfig
      working-directory: common
      run: |
        DEF=arch/arm64/configs/gki_defconfig
        sed -i '/^CONFIG_KSU/d;/^CONFIG_SUSFS/d' "$DEF"

        cat >> "$DEF" << 'EOF'
CONFIG_KSU=y
CONFIG_KSU_MANUAL_HOOK=y
CONFIG_KSU_KPROBES_HOOK=n
CONFIG_SUSFS=y
CONFIG_KSU_SUSFS=y
CONFIG_CFG80211=m
CONFIG_MAC80211=m
CONFIG_USB_GADGET=y
CONFIG_USB_CONFIGFS=y
CONFIG_TMPFS_XATTR=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TCP_CONG_BBR=y
CONFIG_NET_SCH_FQ=y
CONFIG_DEFAULT_BBR=y
EOF

    # --------------------------------------------------
    # BUILD (BAZEL ONLY)
    # --------------------------------------------------
    - name: Build kernel with Bazel
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 90
        max_attempts: 2
        retry_on: timeout
        command: |
          ( while sleep 300; do echo "[keepalive] $(date)"; done ) &
          KEEPALIVE_PID=$!
          trap "kill $KEEPALIVE_PID 2>/dev/null || true" EXIT

          sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64 || true
          sed -i '/MODULES_ORDER/d;/KMI_SYMBOL_LIST_STRICT_MODE/d' common/build.config.gki.aarch64 || true

          tools/bazel build --config=fast --config=stamp //common:kernel_aarch64_dist

    # --------------------------------------------------
    # PACKAGE
    # --------------------------------------------------
    - name: Package AnyKernel3
      run: |
        IMG=$(find bazel-bin -name Image | head -1)
        test -f "$IMG"
        cp "$IMG" AnyKernel3/Image
        cd AnyKernel3
        zip -r ../kernel.zip .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nethunter-kernel
        path: kernel.zip
