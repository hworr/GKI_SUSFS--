name: 1 Kernel + SUSFS

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: 'KernelSU Variante'
        required: true
        default: 'wild'
        type: choice
        options: [wild, sukisu, next]
      gki_branch:
        description: 'GKI Branch'
        required: true
        default: 'android15-6.6'
        type: choice
        options:
          - android15-6.6
          - android14-6.1
          - android14-5.15
          - android13-5.15
          - android13-5.10
          - android12-5.10
      enable_susfs:
        description: 'SUSFS aktivieren'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
# --------------------------------------------------
# ENV
# --------------------------------------------------
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache build-essential repo bc flex bison \
            libssl-dev libelf-dev pahole python3 python-is-python3 zip unzip curl

      - name: Set Variables
        id: vars
        run: |
          echo "BRANCH=${{ inputs.gki_branch }}" >> $GITHUB_OUTPUT
          echo "KERNEL_VERSION=$(echo '${{ inputs.gki_branch }}' | cut -d'-' -f2)" >> $GITHUB_OUTPUT

# --------------------------------------------------
# KERNEL SOURCE
# --------------------------------------------------
      - name: Download Kernel Source
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-${{ steps.vars.outputs.BRANCH }} --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

# --------------------------------------------------
# KERNELSU (MANUAL, BAZEL-SAFE)
# --------------------------------------------------
      - name: Setup KernelSU
        run: |
          set -e
          cd kernel_workspace/common

          VARIANT="${{ inputs.kernelsu_variant }}"

          case "$VARIANT" in
            wild)   git clone https://github.com/WildKernels/Wild_KSU.git KernelSU ;;
            sukisu) git clone https://github.com/ShirkNeko/SuKiSu.git KernelSU ;;
            next)   git clone --recurse-submodules https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU ;;
          esac

          cd KernelSU
          git fetch --tags
          KSU_VERSION=$(git describe --abbrev=0 --tags)
          KSU_COMMITS=$(git rev-list --count HEAD)
          cd ..

          rm -rf drivers/kernelsu
          cp -r KernelSU/kernel drivers/kernelsu

          # Bazel-fester Version Inject (kein .git nötig)
          KBUILD=drivers/kernelsu/Kbuild
          {
            echo "KSU_GIT_VERSION := $KSU_COMMITS"
            echo "KSU_GIT_TAG := $KSU_VERSION"
            echo "KSU_GIT_VERSION_VALID := 1"
            echo ""
            cat "$KBUILD"
          } > "$KBUILD.new"
          mv "$KBUILD.new" "$KBUILD"

          grep -q kernelsu drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q kernelsu/Kconfig drivers/Kconfig || \
            sed -i '/^endmenu$/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

# --------------------------------------------------
# SUSFS
# --------------------------------------------------

      - name: Setup SUSFS
        if: inputs.enable_susfs
        run: |
          set -e
      
          cd kernel_workspace
      
          # SUSFS sauber neu klonen (GKI-Branch!)
          rm -rf susfs
          
          git clone --depth=1 \
            -b gki-${{ steps.vars.outputs.BRANCH }} \
            https://github.com/WildKernels/susfs4ksu.git susfs
          
          echo "✓ SUSFS cloned (branch: gki-${{ steps.vars.outputs.BRANCH }})"
      
          cd common
      
          SUSFS_SRC="../susfs/kernel_patches"
      
          echo "Using SUSFS_SRC=$SUSFS_SRC"
          ls -la "$SUSFS_SRC"
      
          # -----------------------------------
          # Step 1: Quellen kopieren
          # -----------------------------------
          cp "$SUSFS_SRC/fs/susfs.c" fs/susfs.c
          cp "$SUSFS_SRC/include/linux/susfs.h" include/linux/susfs.h
          echo "✓ SUSFS sources copied"
      
          # -----------------------------------
          # Step 2: Kernel Patch (6.6 safe)
          # -----------------------------------
          KERNEL_PATCH="$SUSFS_SRC/50_add_susfs_in_gki-${{ steps.vars.outputs.BRANCH }}.patch"
      
          if [ ! -f "$KERNEL_PATCH" ]; then
            echo "❌ SUSFS kernel patch not found:"
            echo "   $KERNEL_PATCH"
            exit 1
          fi
      
          echo "Applying kernel SUSFS patch..."
          patch -p1 < "$KERNEL_PATCH" || true
      
          # Erwarteter 6.6-Drift → ignorieren
          rm -f fs/proc/base.c.rej || true
      
          # -----------------------------------
          # Step 3: KernelSU Integration
          # -----------------------------------
          KSU_PATCH="$SUSFS_SRC/KernelSU/enable_susfs_for_ksu.patch"
      
          if [ -f "$KSU_PATCH" ]; then
            echo "Applying KernelSU SUSFS patch..."
            cd drivers/kernelsu
            patch -p1 < "$KSU_PATCH" || true
            cd ../..
          else
            echo "⚠ KernelSU SUSFS patch not found (continuing)"
          fi
      
          # -----------------------------------
          # Verification
          # -----------------------------------
          echo "=== SUSFS verification ==="
          test -f fs/susfs.c && echo "✓ fs/susfs.c present"
          test -f include/linux/susfs.h && echo "✓ susfs.h present"
          grep -rq susfs fs && echo "✓ kernel SUSFS hooks present"
          grep -rq susfs drivers/kernelsu && echo "✓ KernelSU SUSFS hooks present"

# --------------------------------------------------
# CONFIG (FRAGMENT ONLY – GKI SAFE)
# --------------------------------------------------
      - name: Create gki_defconfig.fragment
        if: inputs.enable_susfs
        run: |
          mkdir -p common/arch/arm64/configs
          cat > common/arch/arm64/configs/gki_defconfig.fragment << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          EOF

# --------------------------------------------------
# BUILD
# --------------------------------------------------
      - name: Build Kernel
        run: |
          cd kernel_workspace
          tools/bazel run //common:kernel_aarch64_dist -- --dist_dir=dist

# --------------------------------------------------
# OUTPUT
# --------------------------------------------------
      - name: Package Kernel
        run: |
          mkdir output
          find kernel_workspace -name Image -exec cp {} output/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.kernelsu_variant }}
          path: output/*
