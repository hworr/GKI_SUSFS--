name: sus Kernel Build (GKI Fixed)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      kernelsu_variant:
        required: true
        type: string
      kernelsu_branch:
        required: true
        type: string
      kernelsu_branch_other:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_CPP2: "yes"

    steps:
    # --------------------------------------------------
    # SPACE + TOOLS
    # --------------------------------------------------
    - name: Maximize build space
      uses: easimon/maximize-build-space@master

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git curl python3 ccache
    # --------------------------------------------------
    # CCACHE
    # --------------------------------------------------
    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: /home/runner/.ccache
        key: ccache-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}
        restore-keys: |
          ccache-${{ inputs.android_version }}-${{ inputs.kernel_version }}-
          ccache-${{ inputs.android_version }}-
          ccache-
    - name: Setup ccache
      run: |
        ccache --max-size=10G
        ccache --set-config=compression=true
        ccache --zero-stats
    # --------------------------------------------------
    # REPO + KERNEL
    # --------------------------------------------------
    - name: Install repo tool
      run: |
        mkdir -p git-repo
        curl https://storage.googleapis.com/git-repo-downloads/repo > git-repo/repo
        chmod +x git-repo/repo
        echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV
    - name: Repo init & sync (GKI)
      run: |
        set -e
        BRANCH="android15-6.6-${{ inputs.os_patch_level }}"
        $REPO init -u https://android.googlesource.com/kernel/manifest -b common-$BRANCH
        $REPO sync -j$(nproc --all) --fail-fast
        # Cleanup Baseband-Guard if present
        rm -rf common/security/baseband-guard || true
        sed -i '/baseband_guard/d' common/security/Kconfig
        sed -i '/CONFIG_BBG/d' common/arch/arm64/configs/gki_defconfig
        sed -i 's/,baseband_guard//g' common/arch/arm64/configs/gki_defconfig
    # --------------------------------------------------
    # DEPENDENCIES
    # --------------------------------------------------
    - name: Clone SUSFS + AnyKernel3
      run: |
          git clone https://github.com/ShirkNeko/susfs4ksu.git -b gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}
          git clone https://github.com/MiRinChan/AnyKernel3.git
  
    - name: Create flask.h for KernelSU
      run: |
            python3 - << 'PYCODE'
            import os
            header_dir = "common/security/selinux/include"
            flask_h = f"{header_dir}/flask.h"
            
            if os.path.exists(flask_h):
                print("✓ flask.h already exists")
                exit(0)
            
            os.makedirs(header_dir, exist_ok=True)
            
            with open(flask_h, 'w') as f:
                f.write('''/* This file is automatically generated */
            #ifndef _SELINUX_FLASK_H_
            #define _SELINUX_FLASK_H_
            
            #define SECCLASS_SECURITY 1
            #define SECCLASS_PROCESS 2
            #define SECCLASS_SYSTEM 3
            #define SECCLASS_CAPABILITY 4
            #define SECCLASS_FILE 6
            #define SECCLASS_DIR 7
            
            #define SECINITSID_KERNEL 1
            #define SECINITSID_SECURITY 2
            #define SECINITSID_UNLABELED 3
            
            #define PROCESS__FORK 1
            #define PROCESS__TRANSITION 2
            #define PROCESS__SIGKILL 4
            #define PROCESS__PTRACE 8
            #define PROCESS__GETCAP 14
            #define PROCESS__SETCAP 15
            
            #define FILE__IOCTL 1
            #define FILE__READ 2
            #define FILE__WRITE 3
            #define FILE__CREATE 4
            #define FILE__GETATTR 5
            #define FILE__SETATTR 6
            #define FILE__EXECUTE 14
            #define FILE__OPEN 19
            #define FILE__ENTRYPOINT 22
            
            #define DIR__READ 2
            #define DIR__WRITE 3
            #define DIR__CREATE 4
            #define DIR__SEARCH 14
            #define DIR__ADD_NAME 15
            #define DIR__OPEN 18
            
            #define CAPABILITY__SYS_ADMIN 22
            #define CAPABILITY__SYS_PTRACE 20
            #define CAPABILITY__SETUID 8
            #define CAPABILITY__SETGID 7
            
            #endif
            ''')
            print(f"✓ Created {flask_h}")
            PYCODE
    - name: Guard SELinux headers
      run: |
            find common -name "*.c" -o -name "*.h" | xargs sed -i \
              's|#include <security/selinux/include/security.h>|#if IS_ENABLED(CONFIG_SECURITY_SELINUX)\n&\n#endif|g' || true
    - name: Prepare defconfig
      working-directory: common
      run: |
            set -e
            rm -rf security/baseband-guard || true
            sed -i '/baseband_guard/d' security/Kconfig || true
            echo "✓ Defconfig prepared"
    # --------------------------------------------------
    # KERNELSU BRANCH
    # --------------------------------------------------
    - name: Determine KernelSU branch
      run: |
        if [[ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]]; then
          if [[ "${{ inputs.kernelsu_branch }}" == "Other" ]]; then
            echo "BRANCH=${{ inputs.kernelsu_branch_other }}" >> $GITHUB_ENV
          else
            echo "BRANCH=builtin" >> $GITHUB_ENV
          fi
        fi
    # --------------------------------------------------
    # KERNELSU (SUKISU)
    # --------------------------------------------------
    - name: Add SukiSU
      if: ${{ inputs.kernelsu_variant == 'SukiSU' }}
      run: |
        curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s "$BRANCH"
    # --------------------------------------------------
    # SUSFS (PATCH ONLY – NO DEFCONFIG)
    # --------------------------------------------------
    - name: Apply SUSFS core patch
      working-directory: common
      run: |
        set -e
        PATCH="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"
        patch -p1 < "$PATCH" || true
        rm -f fs/proc/*.rej || true
    - name: Copy SUSFS files
      run: |
        cp susfs4ksu/kernel_patches/fs/* common/fs/
        cp susfs4ksu/kernel_patches/include/linux/* common/include/linux/
    # --------------------------------------------------
    # GKI DEFCONFIG SANITIZER (ABSOLUT KRITISCH)
    # --------------------------------------------------
    - name: Merge kernel config (GKI safe)
      run: |
        DEFCONFIG=common/arch/arm64/configs/gki_defconfig
        MERGE=common/scripts/kconfig/merge_config.sh
        chmod +x "$MERGE"
    
        cat > /tmp/gki_nethunter.config << 'EOF'
        CONFIG_KSU=y
        CONFIG_KSU_MANUAL_HOOK=y
        CONFIG_KSU_KPROBES_HOOK=n
    
        CONFIG_SUSFS=y
        CONFIG_KSU_SUSFS=y
        CONFIG_SUSFS_PROC=y
        CONFIG_SUSFS_MAGIC_MOUNT=y
        CONFIG_SUSFS_AUTO_BIND=y
        CONFIG_SUSFS_SUS_PATH=y
    
        CONFIG_CFG80211=m
        CONFIG_MAC80211=m
    
        CONFIG_USB_GADGET=y
        CONFIG_USB_CONFIGFS=y
        CONFIG_USB_NET_DRIVERS=y
        CONFIG_USB_RNDIS_HOST=m
        CONFIG_USB_NET_CDC_ECM=m
        CONFIG_USB_NET_CDC_NCM=m
        CONFIG_USB_HID=m
        CONFIG_USB_HIDDEV=y
    
        CONFIG_TMPFS_XATTR=y
        CONFIG_TMPFS_POSIX_ACL=y
    
        CONFIG_TCP_CONG_BBR=y
        CONFIG_NET_SCH_FQ=y
        CONFIG_DEFAULT_BBR=y
        EOF
    
        "$MERGE" -m "$DEFCONFIG" /tmp/gki_nethunter.config
        cp .config "$DEFCONFIG"

    - name: Fix KernelSU SELinux include (GKI 6.6)
      run: |
        cd common
    
        for f in drivers/kernelsu/*.c; do
          sed -i \
            's|#include <security/selinux/include/security.h>|#if IS_ENABLED(CONFIG_SECURITY_SELINUX)\n#include <security/selinux/include/security.h>\n#endif|' \
            "$f" || true
    
          sed -i \
            's|#include <security/selinux/include/objsec.h>|#if IS_ENABLED(CONFIG_SECURITY_SELINUX)\n#include <security/selinux/include/objsec.h>\n#endif|' \
            "$f" || true
        done
    
        echo "✓ KernelSU SELinux headers guarded"

    - name: Sync gki_defconfig
      run: |
        cd common
    
        rm -rf security/baseband-guard || true
        sed -i '/baseband_guard/d' security/Kconfig || true
        sed -i '/CONFIG_BBG/d' arch/arm64/configs/gki_defconfig || true
    
        make ARCH=arm64 savedefconfig
        cp defconfig arch/arm64/configs/gki_defconfig
    
        echo "✓ gki_defconfig synced"
    
        grep -i baseband_guard arch/arm64/configs/gki_defconfig || true
        grep CONFIG_BBG arch/arm64/configs/gki_defconfig || true
        

    # --------------------------------------------------
    # BUILD
    # --------------------------------------------------
    - name: Build with retry
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 90
        max_attempts: 2
        retry_on: timeout
        command: |
          set -e
          cd "$GITHUB_WORKSPACE"
    
          sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64 || true
          sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' common/build.config.gki.aarch64 || true
          sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' common/build.config.gki.aarch64 || true
    
          if [ -f "build/build.sh" ]; then
            LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 \
              build/build.sh CC="/usr/bin/ccache clang"
          else
            tools/bazel build --config=fast //common:kernel_aarch64_dist
          fi

    # --------------------------------------------------
    # CCACHE STATS
    # --------------------------------------------------
    - name: Show ccache stats
      run: ccache --show-stats

# --------------------------------------------------
# PACKAGE
# --------------------------------------------------
    - name: Package AnyKernel3
      run: |
        set -e
    
        IMG=$(ls out/*/dist/Image 2>/dev/null || ls bazel-bin/common/kernel_aarch64/Image)
    
        echo "Using kernel image: $IMG"
        cp "$IMG" AnyKernel3/Image
    
        cd AnyKernel3
        zip -r ../kernel.zip .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: kernel.zip
