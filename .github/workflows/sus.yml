name: SukiSU Kernel Build (GKI FINAL – SELinux fixed)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      kernelsu_variant:
        required: true
        type: string
      kernelsu_branch:
        required: true
        type: string
      kernelsu_branch_other:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_CPP2: "yes"

    steps:
    # --------------------------------------------------
    # SPACE + TOOLS
    # --------------------------------------------------
    - name: Maximize build space
      uses: easimon/maximize-build-space@master

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git curl python3 ccache

    # --------------------------------------------------
    # CCACHE
    # --------------------------------------------------
    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: /home/runner/.ccache
        key: ccache-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}

    - name: Setup ccache
      run: |
        ccache --max-size=10G
        ccache --set-config=compression=true
        ccache --zero-stats

    # --------------------------------------------------
    # REPO + KERNEL
    # --------------------------------------------------
    - name: Install repo tool
      run: |
        mkdir -p git-repo
        curl https://storage.googleapis.com/git-repo-downloads/repo > git-repo/repo
        chmod +x git-repo/repo
        echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV

    - name: Repo init & sync (GKI)
      run: |
        set -e
        BRANCH="android15-6.6-${{ inputs.os_patch_level }}"
        $REPO init -u https://android.googlesource.com/kernel/manifest -b common-$BRANCH
        $REPO sync -j$(nproc --all) --fail-fast

        rm -rf common/security/baseband-guard || true
        sed -i '/baseband_guard/d' common/security/Kconfig || true
        sed -i '/CONFIG_BBG/d' common/arch/arm64/configs/gki_defconfig || true

    # --------------------------------------------------
    # DEPENDENCIES
    # --------------------------------------------------
    - name: Clone SUSFS + AnyKernel3
      run: |
        git clone https://github.com/ShirkNeko/susfs4ksu.git -b gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}
        git clone https://github.com/MiRinChan/AnyKernel3.git

    # --------------------------------------------------
    # KERNELSU BRANCH
    # --------------------------------------------------
    - name: Determine KernelSU branch
      run: |
        if [[ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]]; then
          if [[ "${{ inputs.kernelsu_branch }}" == "Other" ]]; then
            echo "BRANCH=${{ inputs.kernelsu_branch_other }}" >> $GITHUB_ENV
          else
            echo "BRANCH=builtin" >> $GITHUB_ENV
          fi
        fi

    # --------------------------------------------------
    # KERNELSU (SUKISU)
    # --------------------------------------------------
    - name: Add SukiSU
      if: ${{ inputs.kernelsu_variant == 'SukiSU' }}
      run: |
        curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s "$BRANCH"

    # --------------------------------------------------
    # 🔥 SELINUX FIX – GKI FINAL 🔥
    # --------------------------------------------------
    - name: Strip SELinux internals from KernelSU (GKI safe)
      run: |
        cd common
        for f in drivers/kernelsu/*.c drivers/kernelsu/*.h; do
          sed -i '/security\/selinux\/include/d' "$f"
        done
        echo "✓ KernelSU SELinux internals removed"

    # --------------------------------------------------
    # SUSFS (PATCH ONLY)
    # --------------------------------------------------
    - name: Apply SUSFS core patch
      working-directory: common
      run: |
        patch -p1 < "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch" || true

    - name: Copy SUSFS files
      run: |
        cp susfs4ksu/kernel_patches/fs/* common/fs/
        cp susfs4ksu/kernel_patches/include/linux/* common/include/linux/

    # --------------------------------------------------
    # GKI DEFCONFIG (NO SELINUX)
    # --------------------------------------------------
    - name: Merge kernel config (GKI safe)
      run: |
        DEFCONFIG=common/arch/arm64/configs/gki_defconfig
        MERGE=common/scripts/kconfig/merge_config.sh
        chmod +x "$MERGE"

        cat > /tmp/gki.config << 'EOF'
        CONFIG_KSU=y
        CONFIG_KSU_MANUAL_HOOK=y
        CONFIG_KSU_KPROBES_HOOK=n

        CONFIG_SUSFS=y
        CONFIG_KSU_SUSFS=y
        CONFIG_SUSFS_PROC=y
        CONFIG_SUSFS_MAGIC_MOUNT=y
        CONFIG_SUSFS_AUTO_BIND=y
        CONFIG_SUSFS_SUS_PATH=y
        EOF

        "$MERGE" -m "$DEFCONFIG" /tmp/gki.config
        cp .config "$DEFCONFIG"

    # --------------------------------------------------
    # BUILD
    # --------------------------------------------------
    - name: Build kernel
      run: |
        sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64 || true
        tools/bazel build --config=fast //common:kernel_aarch64_dist

    # --------------------------------------------------
    # PACKAGE
    # --------------------------------------------------
    - name: Package AnyKernel3
      run: |
        IMG=$(ls bazel-bin/common/kernel_aarch64/Image)
        cp "$IMG" AnyKernel3/Image
        cd AnyKernel3
        zip -r ../kernel.zip .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: kernel.zip
