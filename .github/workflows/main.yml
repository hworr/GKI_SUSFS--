name: Build and Release GKI Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      build_a12_510: { type: boolean, default: false }
      build_a13_510: { type: boolean, default: false }
      build_a13_515: { type: boolean, default: false }
      build_a14_515: { type: boolean, default: false }
      build_a14_61:  { type: boolean, default: true  }
      build_a15_66:  { type: boolean, default: false }
      make_release:  { type: boolean, default: true  }
      kernelsu_variant:
        type: choice
        options: [SukiSU]
        default: SukiSU
      kernelsu_branch:
        type: choice
        options: [Stable, Dev, Other]
        default: Dev
      kernelsu_branch_other:
        type: string
        default: ""

jobs:

  build-kernel-a12-5-10:
    if: ${{ inputs.build_a12_510 }}
    uses: ./.github/workflows/kernel-a12-5.10.yml
    secrets: inherit
    with: &build_args
      make_release: ${{ inputs.make_release }}
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      kernelsu_branch_other: ${{ inputs.kernelsu_branch_other }}

  build-kernel-a13-5-10:
    if: ${{ inputs.build_a13_510 }}
    uses: ./.github/workflows/kernel-a13-5.10.yml
    secrets: inherit
    with: *build_args

  build-kernel-a13-5-15:
    if: ${{ inputs.build_a13_515 }}
    uses: ./.github/workflows/kernel-a13-5.15.yml
    secrets: inherit
    with: *build_args

  build-kernel-a14-5-15:
    if: ${{ inputs.build_a14_515 }}
    uses: ./.github/workflows/kernel-a14-5.15.yml
    secrets: inherit
    with: *build_args

  build-kernel-a14-6-1:
    if: ${{ inputs.build_a14_61 }}
    uses: ./.github/workflows/kernel-a14-6.1.yml
    secrets: inherit
    with: *build_args

  build-kernel-a15-6-6:
    if: ${{ inputs.build_a15_66 }}
    uses: ./.github/workflows/kernel-a15-6.6.yml
    secrets: inherit
    with: *build_args

  release:
    if: ${{ inputs.make_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Init env
        run: |
          echo "DATE=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_ENV
          echo "REPO=MiRinFork/GKI_SukiSU_SUSFS" >> $GITHUB_ENV

      - name: Resolve KernelSU branch
        run: |
          case "${{ inputs.kernelsu_branch }}" in
            Dev)    echo "KSU_BRANCH=main" >> $GITHUB_ENV ;;
            Stable) echo "KSU_BRANCH=stable" >> $GITHUB_ENV ;;
            Other)
              [ -z "${{ inputs.kernelsu_branch_other }}" ] && exit 1
              echo "KSU_BRANCH=${{ inputs.kernelsu_branch_other }}" >> $GITHUB_ENV ;;
          esac

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          gh release create "$DATE" artifacts/**/** \
            --repo "$REPO" \
            --prerelease \
            --title "$DATE" \
            --notes "
          ⚠️ TEST BUILD – Use at your own risk

          KernelSU: ${{ inputs.kernelsu_variant }} ($KSU_BRANCH)
          LTO: thin
          "

      - name: Telegram Notify
        if: success()
        env:
          BOT:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
            -d "chat_id=$CHAT" \
            -d "text=🚀 New GKI release: https://github.com/$REPO/releases/tag/$DATE"
