name: SukiSU Kernel Build (Syntax Fixed)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version'
        required: true
        type: choice
        options:
          - '14'
          - '15'
        default: '15'
      kernel_version:
        description: 'Kernel Version'
        required: true
        type: choice
        options:
          - '5.15'
          - '6.1'
          - '6.6'
        default: '6.6'
      os_patch_level:
        description: 'OS Patch Level (YYYY-MM)'
        required: true
        type: string
        default: '2025-09'
      kernelsu_variant:
        description: 'KernelSU Variant'
        required: true
        type: choice
        options:
          - 'SukiSU'
          - 'None'
        default: 'SukiSU'
      kernelsu_branch:
        description: 'KernelSU Branch'
        required: true
        type: choice
        options:
          - 'builtin'
          - 'main'
          - 'Other'
        default: 'builtin'
      kernelsu_branch_other:
        description: 'Custom Branch'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_CPP2: "yes"
      ANDROID_VERSION: ${{ inputs.android_version }}
      KERNEL_VERSION: ${{ inputs.kernel_version }}
      OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
      KERNELSU_VARIANT: ${{ inputs.kernelsu_variant }}
      KERNELSU_BRANCH: ${{ inputs.kernelsu_branch }}
      KERNELSU_BRANCH_OTHER: ${{ inputs.kernelsu_branch_other }}

    steps:
      - name: Set GKI branch
        run: |
          set -e
          BRANCH="android${ANDROID_VERSION}-${KERNEL_VERSION}-${OS_PATCH_LEVEL}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "Using branch: common-$BRANCH"

      - name: Maximize build space
        uses: easimon/maximize-build-space@master

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl python3 ccache clang lld llvm bc bison flex \
            libelf-dev libssl-dev

      # --------------------------------------------------
      # CCACHE
      # --------------------------------------------------
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-${{ env.OS_PATCH_LEVEL }}
          restore-keys: |
            ccache-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-
            ccache-${{ env.ANDROID_VERSION }}-
            ccache-

      - name: Setup ccache
        run: |
          ccache --max-size=20G
          ccache --set-config=compression=true
          ccache --zero-stats

      # --------------------------------------------------
      # REPO + KERNEL
      # --------------------------------------------------
      - name: Init & sync kernel repo
        run: |
          set -e
          mkdir -p "$HOME/bin"
          curl -o "$HOME/bin/repo" https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x "$HOME/bin/repo"

          "$HOME/bin/repo" init \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-${{ env.BRANCH }}

          "$HOME/bin/repo" sync -j$(nproc --all) --fail-fast

      - name: Verify kernel workspace
        run: |
          set -e
          test -d common || { echo "common/ not found"; exit 1; }
          test -d .repo || { echo ".repo/ not found"; exit 1; }
          echo "✓ Kernel workspace OK"

      # --------------------------------------------------
      # BASEBAND GUARD
      # --------------------------------------------------
      - name: Remove Baseband-Guard
        working-directory: common
        run: |
          rm -rf security/baseband-guard || true
          sed -i '/baseband_guard/d' security/Kconfig || true
          sed -i '/CONFIG_BBG/d' arch/arm64/configs/gki_defconfig || true

      # --------------------------------------------------
      # DEPENDENCIES
      # --------------------------------------------------
      - name: Clone SUSFS + AnyKernel3
        run: |
          set -e
          
          SUSFS_BRANCH="gki-android${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}"
          
          echo "Attempting to clone SUSFS branch: $SUSFS_BRANCH"
          if ! git clone https://github.com/ShirkNeko/susfs4ksu.git -b "$SUSFS_BRANCH" 2>/dev/null; then
            echo "⚠️ Branch $SUSFS_BRANCH not found, trying alternative formats..."
            
            SUSFS_BRANCH_ALT="gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}"
            if ! git clone https://github.com/ShirkNeko/susfs4ksu.git -b "$SUSFS_BRANCH_ALT" 2>/dev/null; then
              echo "⚠️ Branch $SUSFS_BRANCH_ALT not found either"
              
              echo "Available SUSFS branches:"
              git ls-remote --heads https://github.com/ShirkNeko/susfs4ksu.git | grep gki
              
              git clone https://github.com/ShirkNeko/susfs4ksu.git
              cd susfs4ksu
              echo "Cloned default branch, available branches:"
              git branch -r | grep gki || git branch -r
              cd ..
            fi
          fi
          
          git clone https://github.com/MiRinChan/AnyKernel3.git

      # --------------------------------------------------
      # KERNELSU
      # --------------------------------------------------
      - name: Determine KernelSU branch
        run: |
          if [[ "${{ env.KERNELSU_VARIANT }}" == "SukiSU" ]]; then
            if [[ "${{ env.KERNELSU_BRANCH }}" == "Other" ]]; then
              echo "KSU_BRANCH=${{ env.KERNELSU_BRANCH_OTHER }}" >> $GITHUB_ENV
            else
              echo "KSU_BRANCH=builtin" >> $GITHUB_ENV
            fi
          fi

      - name: Add SukiSU
        if: env.KERNELSU_VARIANT == 'SukiSU'
        run: |
          curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s "${{ env.KSU_BRANCH }}"

      # --------------------------------------------------
      # HARD REMOVE KERNELSU ALLOWLIST
      # --------------------------------------------------
      - name: Remove KernelSU allowlist completely
        working-directory: common
        run: |
          rm -f drivers/kernelsu/allowlist.c
          rm -f drivers/kernelsu/app_profile.c
          
          if ls drivers/kernelsu 2>/dev/null | grep -q allowlist; then
            echo "❌ allowlist still present"
            exit 1
          fi
          
          echo "✓ KernelSU allowlist removed"

      # --------------------------------------------------
      # SUSFS
      # --------------------------------------------------
      - name: Apply SUSFS patch
        working-directory: common
        run: |
          set -e
          
          PATCH_DIR="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches"
          
          if [ -f "$PATCH_DIR/50_add_susfs_in_gki-android15-6.6.patch" ]; then
            PATCH="$PATCH_DIR/50_add_susfs_in_gki-android15-6.6.patch"
          elif [ -f "$PATCH_DIR/50_add_susfs_in_gki-15-6.6.patch" ]; then
            PATCH="$PATCH_DIR/50_add_susfs_in_gki-15-6.6.patch"
          else
            PATCH=$(find "$PATCH_DIR" -name "*6.6*.patch" | head -1)
            if [ -z "$PATCH" ]; then
              echo "⚠️ No suitable SUSFS patch found"
              ls -la "$PATCH_DIR"/*.patch 2>/dev/null || true
              exit 0
            fi
          fi
          
          echo "==> Applying SUSFS patch: $PATCH"
          if patch -p1 < "$PATCH"; then
            echo "✓ Patch applied successfully"
          else
            echo "⚠️ Some hunks failed, cleaning up rejects"
            find . -name "*.rej" -delete 2>/dev/null || true
          fi

      - name: Copy SUSFS files
        run: |
          set -e
          echo "==> Copying SUSFS files"
          if [ -d "susfs4ksu/kernel_patches/fs/susfs" ]; then
            cp -r susfs4ksu/kernel_patches/fs/susfs common/fs/
          fi
          if [ -d "susfs4ksu/kernel_patches/include/linux" ]; then
            cp susfs4ksu/kernel_patches/include/linux/* common/include/linux/ 2>/dev/null || true
          fi

      # --------------------------------------------------
      # DEFCONFIG
      # --------------------------------------------------
      - name: Patch gki_defconfig
        working-directory: common
        run: |
          set -e
          DEFCONFIG=arch/arm64/configs/gki_defconfig

          # Remove existing
          sed -i '/^CONFIG_KSU/d' "$DEFCONFIG"
          sed -i '/^CONFIG_SUSFS/d' "$DEFCONFIG"
          sed -i '/^CONFIG_USB_GADGET/d' "$DEFCONFIG"
          sed -i '/^CONFIG_TCP_CONG_BBR/d' "$DEFCONFIG"

          # Add configs
          cat >> "$DEFCONFIG" << 'EOF'
          
          # KernelSU Core
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_KPROBES_HOOK=n

          # SUSFS Integration
          CONFIG_SUSFS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_SUSFS_PROC=y
          CONFIG_SUSFS_MAGIC_MOUNT=y
          CONFIG_SUSFS_AUTO_BIND=y
          CONFIG_SUSFS_SUS_PATH=y

          # WiFi/Bluetooth
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m

          # USB Gadget & Networking
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_NET_DRIVERS=y
          CONFIG_USB_RNDIS_HOST=m
          CONFIG_USB_NET_CDC_ECM=m
          CONFIG_USB_NET_CDC_NCM=m
          CONFIG_USB_HID=m
          CONFIG_USB_HIDDEV=y

          # BBR TCP
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_DEFAULT_BBR=y
          EOF
          
          echo "✓ Defconfig patched"

      - name: Disable defconfig validation
        working-directory: common
        run: |
          sed -i 's/POST_DEFCONFIG_CMDS=.*/POST_DEFCONFIG_CMDS=""/g' build.config.gki.aarch64 || true
          sed -i 's/PRE_DEFCONFIG_CMDS=.*/PRE_DEFCONFIG_CMDS=""/g' build.config.gki.aarch64 || true
          echo "✓ Validation disabled"

      - name: Pre-sort defconfig for Bazel (CRITICAL)
        working-directory: common
        run: |
          set -e
          
          echo "==> Pre-sorting defconfig to match Bazel's savedefconfig"
          
          # Generate sorted version that Bazel expects
          make ARCH=arm64 gki_defconfig
          make ARCH=arm64 savedefconfig
          
          # Replace with sorted version
          cp defconfig arch/arm64/configs/gki_defconfig
          
          echo "✓ Defconfig pre-sorted"

      # --------------------------------------------------
      # BUILD
      # --------------------------------------------------
      - name: Build kernel with Bazel
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 90
          max_attempts: 2
          retry_on: timeout
          command: |
            cd "$GITHUB_WORKSPACE"

            ( while sleep 300; do
                echo "[keepalive] build running $(date -u)"
              done ) &
            KEEPALIVE_PID=$!
            trap "kill $KEEPALIVE_PID 2>/dev/null || true" EXIT

            sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64 || true
            sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' common/build.config.gki.aarch64 || true
            sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' common/build.config.gki.aarch64 || true

            # Use Bazel (defconfig was pre-sorted!)
            tools/bazel build --config=fast --config=stamp //common:kernel_aarch64_dist

      - name: Show ccache stats
        run: ccache --show-stats

      # --------------------------------------------------
      # PACKAGE
      # --------------------------------------------------
      - name: Package AnyKernel3
        run: |
          set -e
          
          # Bazel output
          IMG=$(find bazel-bin -name Image 2>/dev/null | head -1)
          
          if [ ! -f "$IMG" ]; then
            # Fallback to out/
            IMG=$(find out -name Image 2>/dev/null | head -1)
          fi
          
          test -f "$IMG" || { echo "ERROR: Image not found"; exit 1; }
          
          echo "Using kernel image: $IMG"
          cp "$IMG" AnyKernel3/Image
          
          mkdir -p AnyKernel3/modules/vendor/lib/modules
          find bazel-bin -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \; 2>/dev/null || true
          find out -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \; 2>/dev/null || true
          
          cd AnyKernel3
          zip -r ../kernel.zip .
          
          echo "✓ Kernel packaged"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: kernel.zip

      - name: Save ccache
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-${{ env.OS_PATCH_LEVEL }}-${{ github.run_id }}
