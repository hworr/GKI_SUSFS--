name: Kernel GKI + KernelSU + SUSFS (SAFE)

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: KernelSU Variante
        required: true
        default: next
        type: choice
        options: [next]
      gki_branch:
        description: GKI Branch
        required: true
        default: android15-6.6
        type: choice
        options:
          - android15-6.6
          - android14-6.1
      enable_susfs:
        description: Enable SUSFS
        required: true
        default: true
        type: boolean
      build_lkm:
        description: Build LKM
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
# --------------------------------------------------
# SPACE
# --------------------------------------------------
      - name: Maximize space
        uses: easimon/maximize-build-space@master

# --------------------------------------------------
# ENV
# --------------------------------------------------
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git repo bc bison flex libssl-dev \
            libelf-dev pahole build-essential python3 unzip zip curl

# --------------------------------------------------
# FLAGS (!!! PARSER SAFE !!!)
# --------------------------------------------------
      - name: Prepare flags
        id: flags
        run: |
          echo "BRANCH=${{ inputs.gki_branch }}" >> $GITHUB_OUTPUT
          echo "KSU=KernelSU-Next" >> $GITHUB_OUTPUT

          if [ "${{ inputs.enable_susfs }}" = "true" ]; then
            echo "SUSFS=Enabled" >> $GITHUB_OUTPUT
            echo "SUSFS_TAG=SUSFS" >> $GITHUB_OUTPUT
          else
            echo "SUSFS=Disabled" >> $GITHUB_OUTPUT
            echo "SUSFS_TAG=NoSUSFS" >> $GITHUB_OUTPUT
          fi

          if [ "${{ inputs.build_lkm }}" = "true" ]; then
            echo "LKM=Yes" >> $GITHUB_OUTPUT
          else
            echo "LKM=No" >> $GITHUB_OUTPUT
          fi

# --------------------------------------------------
# KERNEL SOURCE
# --------------------------------------------------
      - name: Repo sync kernel
        run: |
          mkdir kernel && cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-${{ steps.flags.outputs.BRANCH }} --depth=1
          repo sync -c -j$(nproc)

# --------------------------------------------------
# KERNELSU NEXT
# --------------------------------------------------
      - name: Install KernelSU Next
        run: |
          cd kernel/common
          git clone --recurse-submodules https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU

          rm -rf drivers/kernelsu
          cp -r KernelSU/kernel drivers/kernelsu

          {
            echo "KSU_GIT_VERSION := 1"
            echo "KSU_GIT_TAG := next"
            echo "KSU_GIT_VERSION_VALID := 1"
            echo
            cat drivers/kernelsu/Kbuild
          } > drivers/kernelsu/Kbuild.new
          mv drivers/kernelsu/Kbuild.new drivers/kernelsu/Kbuild

          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          sed -i '/^endmenu$/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

# --------------------------------------------------
# SUSFS
# --------------------------------------------------
      - name: Install SUSFS
        if: inputs.enable_susfs
        run: |
          cd kernel
          git clone --depth=1 -b gki-${{ steps.flags.outputs.BRANCH }} \
            https://github.com/WildKernels/susfs4ksu.git susfs

          cd common
          cp ../susfs/kernel_patches/fs/susfs.c fs/susfs.c
          cp ../susfs/kernel_patches/include/linux/susfs.h include/linux/susfs.h

          patch -p1 < ../susfs/kernel_patches/50_add_susfs_in_gki-${{ steps.flags.outputs.BRANCH }}.patch || true
          rm -f fs/proc/base.c.rej || true

# --------------------------------------------------
# WIFI / BLUETOOTH FIX
# --------------------------------------------------
      - name: Disable protected exports
        run: |
          cd kernel/common
          sed -i '/protected_exports_list/d' BUILD.bazel || true
          find . -name "abi_gki_protected_exports_*" -delete || true

# --------------------------------------------------
# BUILD
# --------------------------------------------------
      - name: Build kernel
        run: |
          cd kernel
          tools/bazel run //common:kernel_aarch64_dist -- --dist_dir=dist

# --------------------------------------------------
# PACKAGE
# --------------------------------------------------
      - name: Package AnyKernel3
        run: |
          mkdir output
          cp kernel/dist/Image output/

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp output/Image ak3/
          cd ak3
          zip -r ../output/kernel.zip *

# --------------------------------------------------
# UPLOAD
# --------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ steps.flags.outputs.BRANCH }}
          path: output/*

# --------------------------------------------------
# RELEASE
# --------------------------------------------------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-${{ steps.flags.outputs.BRANCH }}
          name: GKI ${{ steps.flags.outputs.BRANCH }} - KernelSU Next
          body: |
            Kernel: ${{ steps.flags.outputs.BRANCH }}
            KernelSU: ${{ steps.flags.outputs.KSU }}
            SUSFS: ${{ steps.flags.outputs.SUSFS }}
            LKM: ${{ steps.flags.outputs.LKM }}
          files: output/kernel.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
