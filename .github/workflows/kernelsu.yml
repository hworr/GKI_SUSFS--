name: c Kernel + SUSFS

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: 'KernelSU Variante (alle SUSFS-kompatibel)'
        required: true
        default: 'wild'
        type: choice
        options:
          - wild       # Wild KSU - Beste SUSFS Integration
          - sukisu     # SuKiSu - Fokus auf Hiding
          - next       # KernelSU Next - Aktiv entwickelt
      gki_branch:
        description: 'GKI Branch (Android + Kernel)'
        required: true
        default: 'android15-6.6'
        type: choice
        options:
          - android15-6.6   # Pixel 9/10, neue Geräte
          - android14-6.1   # Pixel 8, Samsung S24
          - android14-5.15  # Ältere Android 14 Geräte
          - android13-5.15  # Android 13 Geräte
          - android13-5.10  # Ältere Android 13
          - android12-5.10  # Android 12 Geräte
      enable_susfs:
        description: 'SUSFS aktivieren'
        required: true
        default: true
        type: boolean
      build_lkm:
        description: 'LKM statt GKI bauen (für locked Bootloader)'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ccache automake flex lzop bison gperf build-essential \
            zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev \
            libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush \
            schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev \
            pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl \
            libxml-simple-perl bc libc6-dev-i386 libx11-dev lib32z-dev \
            libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 \
            python-is-python3 repo cpio kmod openssl libelf-dev pahole

      - name: Set Build Variables
        id: vars
        run: |
          BRANCH="${{ inputs.gki_branch }}"
          KERNEL_VERSION=$(echo "$BRANCH" | cut -d'-' -f2)
          
          echo "BRANCH=${BRANCH}" >> $GITHUB_OUTPUT
          echo "KERNEL_VERSION=${KERNEL_VERSION}" >> $GITHUB_OUTPUT
          echo "SUSFS_BRANCH=gki-${BRANCH}" >> $GITHUB_OUTPUT
          
          echo "================================"
          echo "Build Configuration:"
          echo "  GKI Branch: ${BRANCH}"
          echo "  Kernel: ${KERNEL_VERSION}"
          echo "  KSU Variant: ${{ inputs.kernelsu_variant }}"
          echo "  SUSFS: ${{ inputs.enable_susfs }}"
          echo "  LKM Mode: ${{ inputs.build_lkm }}"
          echo "================================"

      - name: Download Kernel Source
        run: |
          cd $GITHUB_WORKSPACE
          
          BRANCH="${{ steps.vars.outputs.BRANCH }}"
          
          echo "Downloading manifest for ${BRANCH}..."
          
          # Manifest URL ermitteln
          MANIFEST_URL="https://android.googlesource.com/kernel/manifest"
          
          mkdir -p kernel_workspace && cd kernel_workspace
          
          # Repo init
          repo init -u $MANIFEST_URL -b common-${BRANCH} --depth=1
          
          # Sync
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Setup KernelSU
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          
          # Kernel Source Verzeichnis finden
          if [ -d "common" ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/common"
          elif [ -d "private/gs-google" ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/private/gs-google"
          elif [ -d "aosp" ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/aosp"
          else
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace"
          fi
          
          echo "Kernel directory: $KERNEL_DIR"
          
          # Prüfen ob drivers/ existiert
          if [ ! -d "$KERNEL_DIR/drivers" ]; then
            echo "ERROR: drivers/ not found in $KERNEL_DIR"
            echo "Contents:"
            ls -la "$KERNEL_DIR"
            exit 1
          fi
          
          cd "$KERNEL_DIR"
          
          VARIANT="${{ inputs.kernelsu_variant }}"
          ENABLE_SUSFS="${{ inputs.enable_susfs }}"
          
          case "$VARIANT" in
            "wild")
              echo "Installing Wild KSU..."
              git clone https://github.com/WildKernels/Wild_KSU.git KernelSU
              cd KernelSU && git checkout wild && cd ..
              ;;
              
            "sukisu")
              echo "Installing SuKiSu..."
              git clone https://github.com/ShirkNeko/SuKiSu.git KernelSU
              ;;
              
            "next")
              # Immer den offiziellen KernelSU-Next verwenden für aktuelle Version
              echo "Installing KernelSU Next..."
              git clone --recurse-submodules https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
              ;;
          esac
          
          # Version aus Git holen
          cd KernelSU
          git fetch --tags
          KSU_VERSION=$(git describe --abbrev=0 --tags 2>/dev/null || echo "v1.0.0")
          KSU_VERSION_NUM=$(echo "$KSU_VERSION" | sed 's/v//g' | cut -d'-' -f1)
          KSU_COMMITS=$(git rev-list --count HEAD 2>/dev/null || echo "1")
          
          echo "KernelSU Version: $KSU_VERSION"
          echo "KernelSU Version Number: $KSU_VERSION_NUM"
          echo "KernelSU Commits: $KSU_COMMITS"
          cd ..
          
          # ============================================
          # Manuelle Integration (ohne setup.sh)
          # ============================================
          
          echo "Integrating KernelSU into kernel..."
          
          # Kopiere KernelSU kernel module
          rm -rf drivers/kernelsu
          cp -r KernelSU/kernel drivers/kernelsu
          
          # Version in Kbuild ODER Makefile hardcoden
          # KernelSU-Next verwendet Kbuild, manche Forks verwenden Makefile
          KBUILD_FILE=""
          if [ -f "drivers/kernelsu/Kbuild" ]; then
            KBUILD_FILE="drivers/kernelsu/Kbuild"
          elif [ -f "drivers/kernelsu/Makefile" ]; then
            KBUILD_FILE="drivers/kernelsu/Makefile"
          fi
          
          if [ -n "$KBUILD_FILE" ]; then
            echo "Patching $KBUILD_FILE with version $KSU_VERSION ($KSU_COMMITS commits)..."
            
            # Backup
            cp "$KBUILD_FILE" "$KBUILD_FILE.original"
            
            # LÖSUNG: Füge am ANFANG der Datei die Variablen ein
            # BEVOR die ifeq-Prüfung auf .git läuft!
            # Das setzt KSU_GIT_VERSION_VALID := 1 was die Fallback-Logik überspringt
            {
              echo "# =================================================="
              echo "# KernelSU Version - Hardcoded by GKI workflow"
              echo "# This bypasses the .git check which fails in Bazel sandbox"
              echo "# =================================================="
              echo "KSU_GIT_VERSION := $KSU_COMMITS"
              echo "KSU_GIT_TAG := $KSU_VERSION"
              echo "KSU_GIT_VERSION_VALID := 1"
              echo ""
              cat "$KBUILD_FILE"
            } > "$KBUILD_FILE.new"
            mv "$KBUILD_FILE.new" "$KBUILD_FILE"
            
            echo ""
            echo "=== Patched $KBUILD_FILE (first 30 lines) ==="
            head -30 "$KBUILD_FILE"
            echo "========================================"
          else
            echo "WARNING: Neither Kbuild nor Makefile found in drivers/kernelsu/"
            ls -la drivers/kernelsu/
          fi
          
          # ZUSÄTZLICH: ksu.h patchen falls die Version dort definiert ist
          KSU_H="drivers/kernelsu/ksu.h"
          if [ -f "$KSU_H" ]; then
            echo "Patching ksu.h..."
            sed -i 's/#define KERNEL_SU_VERSION_TAG.*/#define KERNEL_SU_VERSION_TAG "'"$KSU_VERSION"'"/' "$KSU_H" || true
          fi
          
          # Makefile in drivers/Makefile hinzufügen
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
            echo "Added kernelsu to drivers/Makefile"
          fi
          
          # Kconfig in drivers/Kconfig hinzufügen
          if ! grep -q "kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '/^endmenu$/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
            echo "Added kernelsu to drivers/Kconfig"
          fi
          
          # ============================================
          # WICHTIG: Protected exports entfernen für WiFi/Bluetooth!
          # ============================================
          echo ""
          echo "=== Removing protected exports (fixes WiFi/Bluetooth) ==="
          
          # Entferne protected_exports_list aus BUILD.bazel
          BUILD_BAZEL="$KERNEL_DIR/BUILD.bazel"
          echo "Checking BUILD.bazel at: $BUILD_BAZEL"
          
          if [ -f "$BUILD_BAZEL" ]; then
            echo "BUILD.bazel found, checking for protected_exports_list..."
            if grep -q "protected_exports_list" "$BUILD_BAZEL"; then
              echo "Found protected_exports_list, removing..."
              sed -i '/protected_exports_list/d' "$BUILD_BAZEL"
              echo "✓ Removed protected_exports_list from BUILD.bazel"
            else
              echo "protected_exports_list not found in BUILD.bazel"
            fi
          else
            echo "BUILD.bazel not found at $BUILD_BAZEL"
          fi
          
          # Entferne die protected_exports Dateien (mit absolutem Pfad)
          echo "Checking for abi_gki_protected_exports files..."
          PROTECTED_FILES=$(find "$KERNEL_DIR" -name "abi_gki_protected_exports_*" -type f 2>/dev/null)
          if [ -n "$PROTECTED_FILES" ]; then
            echo "Found protected exports files:"
            echo "$PROTECTED_FILES"
            rm -f $PROTECTED_FILES
            echo "✓ Removed abi_gki_protected_exports_* files"
          else
            echo "No abi_gki_protected_exports_* files found"
          fi
          
          # Zeige BUILD.bazel Inhalt für Debugging (relevante Zeilen)
          echo ""
          echo "=== BUILD.bazel kernel_aarch64 section ==="
          grep -A20 "^kernel_build(" "$BUILD_BAZEL" 2>/dev/null | head -30 || echo "kernel_build section not found"
          echo "==========================================="
          
          # ============================================
          # CONFIG_KSU in Kconfig als default aktivieren
          # ============================================
          echo ""
          echo "=== Setting CONFIG_KSU default in Kconfig ==="
          
          KCONFIG_FILE="drivers/kernelsu/Kconfig"
          if [ -f "$KCONFIG_FILE" ]; then
            # Zeige aktuelle CONFIG_KSU Sektion
            echo "Current CONFIG_KSU section:"
            sed -n '/^config KSU$/,/^config /p' "$KCONFIG_FILE" | head -15
            echo ""
            
            # Prüfe ob bereits default y hat (suche in den ersten 10 Zeilen nach config KSU)
            if sed -n '/^config KSU$/,/^config /p' "$KCONFIG_FILE" | grep -q "default y"; then
              echo "✓ CONFIG_KSU already has default y - no changes needed"
            else
              echo "Adding default y to CONFIG_KSU..."
              # Nutze sed statt awk - füge default y nach der tristate Zeile ein
              sed -i '/^config KSU$/,/^config /{
                /tristate.*KernelSU/{
                  a\	default y
                }
              }' "$KCONFIG_FILE"
              echo "✓ Set CONFIG_KSU default to y"
            fi
            
            # Entferne eventuelle doppelte default y Zeilen
            echo "Checking for duplicate default y..."
            # Temporäre Datei erstellen ohne aufeinanderfolgende "default y" Zeilen
            awk '
              /^[[:space:]]*default y/ {
                if (last_was_default) next  # Skip duplicate
                last_was_default = 1
                print
                next
              }
              { last_was_default = 0; print }
            ' "$KCONFIG_FILE" > "$KCONFIG_FILE.dedup"
            mv "$KCONFIG_FILE.dedup" "$KCONFIG_FILE"
            echo "✓ Duplicate check complete"
          else
            echo "WARNING: Kconfig not found"
          fi
          
          # Prüfe ob SUSFS bereits in der Kconfig ist (für next-susfs Branch)
          echo ""
          echo "=== Checking for SUSFS in Kconfig ==="
          if grep -q "SUSFS" "$KCONFIG_FILE" 2>/dev/null; then
            echo "✓ SUSFS options already present in Kconfig!"
            grep -A2 "SUSFS" "$KCONFIG_FILE" | head -20
          else
            echo "SUSFS not in Kconfig (will be added by SUSFS patch)"
          fi
          
          # Zeige KernelSU Kconfig für Debugging
          echo ""
          echo "=== KernelSU Kconfig (first 40 lines) ==="
          head -40 "$KCONFIG_FILE" 2>/dev/null || echo "Kconfig not found"
          echo "=========================================="
          
          # Verify
          echo ""
          echo "============================================"
          echo "KernelSU Installation Summary:"
          echo "  Variant: $VARIANT"
          echo "  Version: $KSU_VERSION"
          echo "  Commits: $KSU_COMMITS"
          echo "  Kernel Dir: $KERNEL_DIR"
          echo "  drivers/kernelsu: $([ -d drivers/kernelsu ] && echo 'EXISTS' || echo 'MISSING')"
          echo "  SUSFS in Kconfig: $(grep -q SUSFS drivers/kernelsu/Kconfig 2>/dev/null && echo 'YES' || echo 'NO')"
          echo "============================================"
          
          # Check
          if [ ! -d "drivers/kernelsu" ]; then
            echo "ERROR: KernelSU integration failed!"
            exit 1
          fi
          
          grep -q "kernelsu" drivers/Makefile || { echo "ERROR: Makefile not patched"; exit 1; }
          
          echo "✓ KernelSU setup complete"

      - name: Setup SUSFS
        if: inputs.enable_susfs
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          
          # Kernel Source Verzeichnis finden (gleiche Logik wie KernelSU)
          if [ -d "common" ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/common"
          elif [ -d "private/gs-google" ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/private/gs-google"
          elif [ -d "aosp" ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/aosp"
          else
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace"
          fi
          
          SUSFS_BRANCH="${{ steps.vars.outputs.SUSFS_BRANCH }}"
          KV="${{ steps.vars.outputs.KERNEL_VERSION }}"
          
          echo "============================================"
          echo "SUSFS Setup"
          echo "  Branch: ${SUSFS_BRANCH}"
          echo "  Kernel Version: ${KV}"
          echo "  Kernel Dir: $KERNEL_DIR"
          echo "============================================"
          
          # ============================================
          # Prüfe ob SUSFS bereits integriert ist (next-susfs Branch)
          # ============================================
          if grep -q "KSU_SUSFS" "$KERNEL_DIR/drivers/kernelsu/Kconfig" 2>/dev/null; then
            echo ""
            echo "✓ SUSFS already integrated in KernelSU (next-susfs branch detected)!"
            echo "Skipping external SUSFS patches..."
            SKIP_KSU_PATCH=true
          else
            SKIP_KSU_PATCH=false
          fi
          
          # ============================================
          # SUSFS klonen - WICHTIG: In kernel_workspace, NICHT in common!
          # ============================================
          cd $GITHUB_WORKSPACE/kernel_workspace
          
          echo ""
          echo "Cloning SUSFS into kernel_workspace..."
          
          # Lösche altes susfs falls vorhanden
          rm -rf susfs
          
          # Versuche pershoot Fork zuerst (besser für KernelSU-Next)
          if ! git clone --depth=1 -b "${SUSFS_BRANCH}" https://gitlab.com/pershoot/susfs4ksu.git susfs 2>/dev/null; then
            if ! git clone --depth=1 -b "${SUSFS_BRANCH}" https://github.com/WildKernels/susfs4ksu.git susfs 2>/dev/null; then
              if ! git clone --depth=1 -b "${SUSFS_BRANCH}" https://gitlab.com/simonpunk/susfs4ksu.git susfs 2>/dev/null; then
                echo "ERROR: Could not clone SUSFS for branch ${SUSFS_BRANCH}"
                echo "Trying to list available branches..."
                git ls-remote --heads https://github.com/WildKernels/susfs4ksu.git | head -20
                exit 1
              fi
            fi
          fi
          
          echo "SUSFS cloned successfully to: $GITHUB_WORKSPACE/kernel_workspace/susfs"
          echo "SUSFS directory contents:"
          ls -la susfs/
          
          SUSFS_SRC="$GITHUB_WORKSPACE/kernel_workspace/susfs/kernel_patches"
          
          echo ""
          echo "SUSFS kernel_patches contents:"
          ls -la "${SUSFS_SRC}/" 2>/dev/null || echo "kernel_patches not found!"
          
          # Jetzt in KERNEL_DIR wechseln für die Patches
          cd "$KERNEL_DIR"
          
          # ============================================
          # 1. SUSFS Kernel-Dateien kopieren
          # ============================================
          echo ""
          echo "=== Step 1: Copying SUSFS source files ==="
          
          # Erstelle Verzeichnisse falls nötig
          mkdir -p fs include/linux
          
          # Zeige SUSFS Repo Struktur
          echo "SUSFS repo structure:"
          find "$GITHUB_WORKSPACE/kernel_workspace/susfs" -type d | head -20
          echo ""
          
          # Zeige alle verfügbaren SUSFS Dateien
          echo "Available SUSFS source files:"
          find "$GITHUB_WORKSPACE/kernel_workspace/susfs" -name "*.c" -o -name "*.h" 2>/dev/null | grep -E "(susfs|include)" | head -30
          echo ""
          
          # ============================================
          # Kopiere aus kernel_patches/include falls vorhanden
          # ============================================
          SUSFS_INCLUDE_DIR="$GITHUB_WORKSPACE/kernel_workspace/susfs/kernel_patches/include/linux"
          if [ -d "$SUSFS_INCLUDE_DIR" ]; then
            echo "Found SUSFS include directory: $SUSFS_INCLUDE_DIR"
            ls -la "$SUSFS_INCLUDE_DIR/"
            echo ""
            
            # Kopiere alle Header aus diesem Verzeichnis
            for header in "$SUSFS_INCLUDE_DIR"/*.h; do
              if [ -f "$header" ]; then
                cp "$header" include/linux/
                echo "✓ Copied: $(basename $header) -> include/linux/"
              fi
            done
          else
            echo "No include directory at $SUSFS_INCLUDE_DIR"
          fi
          
          # ============================================
          # Kopiere aus kernel_patches/fs falls vorhanden
          # ============================================
          SUSFS_FS_DIR="$GITHUB_WORKSPACE/kernel_workspace/susfs/kernel_patches/fs"
          if [ -d "$SUSFS_FS_DIR" ]; then
            echo ""
            echo "Found SUSFS fs directory: $SUSFS_FS_DIR"
            ls -la "$SUSFS_FS_DIR/"
            echo ""
            
            # Kopiere susfs.c
            if [ -f "$SUSFS_FS_DIR/susfs.c" ]; then
              cp "$SUSFS_FS_DIR/susfs.c" fs/susfs.c
              echo "✓ Copied: susfs.c -> fs/"
            fi
          else
            echo "No fs directory at $SUSFS_FS_DIR"
          fi
          
          # ============================================
          # Fallback: Suche rekursiv nach SUSFS Dateien
          # ============================================
          echo ""
          echo "Searching for any missing SUSFS files..."
          
          # susfs.c
          if [ ! -f "fs/susfs.c" ]; then
            SUSFS_C=$(find "$GITHUB_WORKSPACE/kernel_workspace/susfs" -name "susfs.c" -type f | head -1)
            if [ -n "$SUSFS_C" ]; then
              cp "$SUSFS_C" fs/susfs.c
              echo "✓ Copied: $SUSFS_C -> fs/susfs.c"
            else
              echo "✗ susfs.c not found!"
            fi
          fi
          
          # susfs.h
          if [ ! -f "include/linux/susfs.h" ]; then
            SUSFS_H=$(find "$GITHUB_WORKSPACE/kernel_workspace/susfs" -name "susfs.h" -type f | head -1)
            if [ -n "$SUSFS_H" ]; then
              cp "$SUSFS_H" include/linux/susfs.h
              echo "✓ Copied: $SUSFS_H -> include/linux/susfs.h"
            else
              echo "✗ susfs.h not found!"
            fi
          fi
          
          # susfs_def.h (KRITISCH!)
          if [ ! -f "include/linux/susfs_def.h" ]; then
            SUSFS_DEF_H=$(find "$GITHUB_WORKSPACE/kernel_workspace/susfs" -name "susfs_def.h" -type f | head -1)
            if [ -n "$SUSFS_DEF_H" ]; then
              cp "$SUSFS_DEF_H" include/linux/susfs_def.h
              echo "✓ Copied: $SUSFS_DEF_H -> include/linux/susfs_def.h"
            else
              echo "⚠ susfs_def.h not found - will be created by patch"
            fi
          fi
          
          # Verifiziere kopierte Dateien
          echo ""
          echo "=== Verifying SUSFS files in kernel ==="
          echo "fs/susfs.c: $([ -f fs/susfs.c ] && echo '✓ EXISTS' || echo '✗ MISSING')"
          echo "include/linux/susfs.h: $([ -f include/linux/susfs.h ] && echo '✓ EXISTS' || echo '✗ MISSING')"
          echo "include/linux/susfs_def.h: $([ -f include/linux/susfs_def.h ] && echo '✓ EXISTS' || echo '✗ MISSING')"
          echo ""
          echo "All headers in include/linux/ starting with susfs:"
          ls -la include/linux/susfs* 2>/dev/null || echo "No susfs headers found yet"
          
          # ============================================
          # 2. Kernel patches anwenden
          # ============================================
          echo ""
          echo "=== Step 2: Applying SUSFS kernel patches ==="
          
          # Der Patch kann entweder ein Verzeichnis mit mehreren Patches sein
          # ODER eine einzelne .patch Datei
          PATCH_APPLIED=false
          
          # Methode 1: Einzelne Patch-Datei (neues Format)
          SINGLE_PATCH="${SUSFS_SRC}/50_add_susfs_in_gki-${{ steps.vars.outputs.BRANCH }}.patch"
          if [ -f "$SINGLE_PATCH" ]; then
            echo "Found single patch file: $SINGLE_PATCH"
            echo "Applying patch..."
            
            # Versuche git apply zuerst (sauberer)
            if git apply --check "$SINGLE_PATCH" 2>/dev/null; then
              git apply "$SINGLE_PATCH"
              echo "✓ Kernel SUSFS patch applied with git apply"
              PATCH_APPLIED=true
            else
              # Verwende patch mit --force um trotz Fehlern fortzufahren
              echo "git apply failed, using patch command..."
              patch -p1 --force --no-backup-if-mismatch < "$SINGLE_PATCH" 2>&1 | tee /tmp/patch_output.txt
              
              # Prüfe auf .rej Dateien
              REJ_FILES=$(find . -name "*.rej" -type f 2>/dev/null)
              if [ -n "$REJ_FILES" ]; then
                echo ""
                echo "⚠ Some hunks failed. Reject files:"
                echo "$REJ_FILES"
                echo ""
                
                # Versuche die fehlenden Änderungen manuell anzuwenden
                for rej in $REJ_FILES; do
                  echo "=== Content of $rej ==="
                  cat "$rej"
                  echo "========================"
                  
                  # Versuche die fehlenden Änderungen manuell anzuwenden
                  ORIG_FILE="${rej%.rej}"
                  if [ -f "$ORIG_FILE" ]; then
                    echo "Attempting manual fix for $ORIG_FILE..."
                    
                    # Für fs/proc/base.c: Füge susfs.h include hinzu
                    if [[ "$ORIG_FILE" == *"fs/proc/base.c"* ]]; then
                      if ! grep -q "linux/susfs.h" "$ORIG_FILE"; then
                        # Füge nach einem vorhandenen #include ein
                        sed -i '/#include <linux\/sched\/mm.h>/a #include <linux\/susfs.h>' "$ORIG_FILE" 2>/dev/null || \
                        sed -i '/#include <linux\/sched.h>/a #include <linux\/susfs.h>' "$ORIG_FILE" 2>/dev/null || \
                        sed -i '/#include <linux\/fs.h>/a #include <linux\/susfs.h>' "$ORIG_FILE" 2>/dev/null || \
                        sed -i '50a #include <linux\/susfs.h>' "$ORIG_FILE"
                        echo "  ✓ Added #include <linux/susfs.h> to $ORIG_FILE"
                      else
                        echo "  susfs.h already included in $ORIG_FILE"
                      fi
                    fi
                  fi
                  
                  # Lösche .rej Datei
                  rm -f "$rej"
                done
              fi
              
              # Zusätzliche manuelle Fixes für bekannte Probleme
              echo ""
              echo "=== Applying manual fixes for known issues ==="
              
              # Fix fs/proc/base.c - stelle sicher dass susfs.h included ist
              if [ -f "fs/proc/base.c" ]; then
                if ! grep -q "linux/susfs.h" "fs/proc/base.c"; then
                  echo "Adding susfs.h to fs/proc/base.c..."
                  # Finde eine geeignete Stelle für den Include
                  if grep -q "#include <linux/sched/mm.h>" "fs/proc/base.c"; then
                    sed -i '/#include <linux\/sched\/mm.h>/a #include <linux\/susfs.h>' "fs/proc/base.c"
                  elif grep -q "#include <linux/seq_file.h>" "fs/proc/base.c"; then
                    sed -i '/#include <linux\/seq_file.h>/a #include <linux\/susfs.h>' "fs/proc/base.c"
                  else
                    # Fallback: Füge nach dem ersten #include Block ein
                    awk '
                      /^#include/ { last_include = NR }
                      { lines[NR] = $0 }
                      END {
                        for (i = 1; i <= NR; i++) {
                          print lines[i]
                          if (i == last_include) {
                            print "#include <linux/susfs.h>"
                          }
                        }
                      }
                    ' "fs/proc/base.c" > "fs/proc/base.c.tmp"
                    mv "fs/proc/base.c.tmp" "fs/proc/base.c"
                  fi
                  echo "  ✓ Added susfs.h to fs/proc/base.c"
                fi
              fi
              
              PATCH_APPLIED=true
            fi
          fi
          
          # Methode 2: Verzeichnis mit mehreren Patches (altes Format)
          if [ "$PATCH_APPLIED" = false ]; then
            for dir in "${SUSFS_SRC}/50_add_susfs_in_${KV}" \
                       "${SUSFS_SRC}/50_add_susfs_in_gki-${KV}"; do
              if [ -d "$dir" ]; then
                echo "Found patch directory: $dir"
                for patch in "$dir"/*.patch; do
                  if [ -f "$patch" ]; then
                    PATCH_NAME=$(basename "$patch")
                    echo "Applying: $PATCH_NAME"
                    git apply "$patch" 2>/dev/null || patch -p1 --force < "$patch" 2>/dev/null || echo "  (may already be applied)"
                  fi
                done
                PATCH_APPLIED=true
                break
              fi
            done
          fi
          
          if [ "$PATCH_APPLIED" = false ]; then
            echo "WARNING: No SUSFS kernel patches found!"
            echo "Searched:"
            echo "  - ${SUSFS_SRC}/50_add_susfs_in_gki-${{ steps.vars.outputs.BRANCH }}.patch"
            echo "  - ${SUSFS_SRC}/50_add_susfs_in_${KV}/"
            ls -la "${SUSFS_SRC}/"
          fi
          
          # ============================================
          # 2.5 Verifiziere und kopiere fehlende Header
          # ============================================
          echo ""
          echo "=== Verifying all SUSFS headers after patching ==="
          
          # Der Patch könnte susfs_def.h erstellt haben, prüfe das
          if [ ! -f "include/linux/susfs_def.h" ]; then
            echo "⚠ susfs_def.h missing after patch - searching..."
            
            # Suche im SUSFS Repo
            SUSFS_DEF=$(find "$GITHUB_WORKSPACE/kernel_workspace/susfs" -name "susfs_def.h" -type f 2>/dev/null | head -1)
            if [ -n "$SUSFS_DEF" ]; then
              cp "$SUSFS_DEF" include/linux/susfs_def.h
              echo "✓ Copied susfs_def.h from SUSFS repo"
            else
              # Suche in kernel_patches Unterverzeichnissen
              SUSFS_DEF=$(find "${SUSFS_SRC}" -name "susfs_def.h" -type f 2>/dev/null | head -1)
              if [ -n "$SUSFS_DEF" ]; then
                cp "$SUSFS_DEF" include/linux/susfs_def.h
                echo "✓ Copied susfs_def.h from kernel_patches"
              else
                echo "⚠ susfs_def.h not found - extracting from patch..."
                
                # Versuche susfs_def.h aus dem Patch zu extrahieren
                PATCH_FILE="${SUSFS_SRC}/50_add_susfs_in_gki-${{ steps.vars.outputs.BRANCH }}.patch"
                if [ -f "$PATCH_FILE" ]; then
                  awk '/^\+\+\+ .*susfs_def\.h/,/^diff --git/{if(/^\+[^+]/)print substr($0,2)}' "$PATCH_FILE" > include/linux/susfs_def.h
                  
                  if [ -s "include/linux/susfs_def.h" ]; then
                    echo "✓ Extracted susfs_def.h from patch file"
                    head -20 include/linux/susfs_def.h
                  fi
                fi
              fi
            fi
          else
            echo "✓ susfs_def.h exists"
          fi
          
          # IMMER sicherstellen dass susfs_def.h existiert
          if [ ! -f "include/linux/susfs_def.h" ] || [ ! -s "include/linux/susfs_def.h" ]; then
            echo "Creating susfs_def.h..."
            printf '/* SPDX-License-Identifier: GPL-2.0 */\n' > include/linux/susfs_def.h
            printf '#ifndef _LINUX_SUSFS_DEF_H\n' >> include/linux/susfs_def.h
            printf '#define _LINUX_SUSFS_DEF_H\n\n' >> include/linux/susfs_def.h
            printf '#include <linux/types.h>\n\n' >> include/linux/susfs_def.h
            printf '#define SUSFS_MAX_LEN_PATHNAME 256\n' >> include/linux/susfs_def.h
            printf '#define SUSFS_MAX_LEN_MNT_TYPE 64\n\n' >> include/linux/susfs_def.h
            printf '#ifdef CONFIG_KSU_SUSFS\n' >> include/linux/susfs_def.h
            printf '#define SUSFS_ENABLED 1\n' >> include/linux/susfs_def.h
            printf '#else\n' >> include/linux/susfs_def.h
            printf '#define SUSFS_ENABLED 0\n' >> include/linux/susfs_def.h
            printf '#endif\n\n' >> include/linux/susfs_def.h
            printf '#endif /* _LINUX_SUSFS_DEF_H */\n' >> include/linux/susfs_def.h
            echo "✓ Created susfs_def.h"
          fi
          
          # FINALE Verifizierung
          echo ""
          echo "=== FINAL SUSFS Header Verification ==="
          for header in susfs.h susfs_def.h; do
            if [ -f "include/linux/$header" ]; then
              LINES=$(wc -l < "include/linux/$header")
              echo "✓ include/linux/$header exists ($LINES lines)"
            else
              echo "✗ include/linux/$header MISSING!"
            fi
          done
          
          # Verifiziere kritische SUSFS Hooks
          echo ""
          echo "=== Verifying SUSFS kernel integration ==="
          for file in fs/namei.c fs/open.c fs/read_write.c fs/namespace.c; do
            if grep -q "susfs" "$file" 2>/dev/null; then
              echo "✓ $file: SUSFS hooks found"
            else
              echo "⚠ $file: SUSFS hooks NOT found"
            fi
          done
          
          # Stelle sicher dass susfs.c im fs/Makefile kompiliert wird
          echo ""
          echo "=== Checking fs/Makefile for susfs ==="
          if [ -f "fs/Makefile" ]; then
            if grep -q "susfs" "fs/Makefile"; then
              echo "✓ susfs already in fs/Makefile"
            else
              echo "Adding susfs.o to fs/Makefile..."
              echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
              echo "✓ Added susfs.o to fs/Makefile"
            fi
          fi
          
          # ============================================
          # 3. KernelSU SUSFS Integration Patch
          # ============================================
          echo ""
          echo "=== Step 3: Applying KernelSU SUSFS integration ==="
          
          # Finde den KSU SUSFS Patch
          KSU_PATCH=""
          for patch_path in "${SUSFS_SRC}/KernelSU/10_enable_susfs_for_ksu.patch" \
                            "${SUSFS_SRC}/ksu/10_enable_susfs_for_ksu.patch" \
                            "$GITHUB_WORKSPACE/kernel_workspace/susfs/patches/ksu.patch"; do
            if [ -f "$patch_path" ]; then
              KSU_PATCH="$patch_path"
              break
            fi
          done
          
          if [ -n "$KSU_PATCH" ] && [ -d "drivers/kernelsu" ]; then
            echo "Found KSU patch: $KSU_PATCH"
            
            # Zeige Patch-Inhalt für Debugging
            echo ""
            echo "=== Patch file paths (first 30 lines with ---/+++) ==="
            grep -E "^(---|\+\+\+|diff)" "$KSU_PATCH" | head -30
            echo "======================================================="
            echo ""
            
            # Der Patch ist für das KernelSU repo strukturiert (kernel/...)
            # Wir müssen ihn auf drivers/kernelsu anwenden
            
            # Methode 1: Wende von KERNEL_DIR aus an mit angepasstem Pfad
            echo "Trying to apply patch from kernel root..."
            
            # Erstelle temporären Patch mit angepassten Pfaden
            # kernel/ -> drivers/kernelsu/
            sed 's|kernel/|drivers/kernelsu/|g' "$KSU_PATCH" > /tmp/ksu_susfs_fixed.patch
            
            echo "=== Fixed patch paths ==="
            grep -E "^(---|\+\+\+)" /tmp/ksu_susfs_fixed.patch | head -20
            echo "========================="
            
            PATCH_SUCCESS=false
            
            if git apply --check /tmp/ksu_susfs_fixed.patch 2>/dev/null; then
              git apply /tmp/ksu_susfs_fixed.patch
              echo "✓ KernelSU SUSFS patch applied (path-fixed)"
              PATCH_SUCCESS=true
            elif patch -p1 --dry-run < /tmp/ksu_susfs_fixed.patch 2>/dev/null; then
              patch -p1 < /tmp/ksu_susfs_fixed.patch
              echo "✓ KernelSU SUSFS patch applied with patch -p1 (path-fixed)"
              PATCH_SUCCESS=true
            else
              # Methode 2: Wende direkt im drivers/kernelsu Verzeichnis an
              echo "Path-fixed patch failed, trying direct application..."
              cd drivers/kernelsu
              
              if git apply --check "$KSU_PATCH" 2>/dev/null; then
                git apply "$KSU_PATCH"
                echo "✓ KernelSU SUSFS patch applied with git apply"
                PATCH_SUCCESS=true
              elif patch -p1 --dry-run < "$KSU_PATCH" 2>/dev/null; then
                patch -p1 < "$KSU_PATCH"
                echo "✓ KernelSU SUSFS patch applied with patch -p1"
                PATCH_SUCCESS=true
              elif patch -p2 --dry-run < "$KSU_PATCH" 2>/dev/null; then
                patch -p2 < "$KSU_PATCH"
                echo "✓ KernelSU SUSFS patch applied with patch -p2"
                PATCH_SUCCESS=true
              elif patch -p3 --dry-run < "$KSU_PATCH" 2>/dev/null; then
                patch -p3 < "$KSU_PATCH"
                echo "✓ KernelSU SUSFS patch applied with patch -p3"
                PATCH_SUCCESS=true
              fi
              
              cd ../..
            fi
            
            # ============================================
            # FALLBACK: Manuelles Hinzufügen der SUSFS Kconfig
            # ============================================
            echo ""
            echo "=== Checking Kconfig after patching ==="
            echo "Current directory: $(pwd)"
            echo "Kconfig path: drivers/kernelsu/Kconfig"
            
            if [ -f "drivers/kernelsu/Kconfig" ]; then
              echo "Kconfig exists, checking for KSU_SUSFS..."
              if grep -q "KSU_SUSFS" drivers/kernelsu/Kconfig; then
                echo "✓ KSU_SUSFS already in Kconfig (from patch)"
                echo "Kconfig KSU_SUSFS entries:"
                grep -c "config KSU_SUSFS" drivers/kernelsu/Kconfig || echo "0"
              else
                echo "KSU_SUSFS not found in Kconfig - adding manually..."
                
                # Füge SUSFS Kconfig Optionen hinzu mit printf für korrekte Tabs
                printf '\nconfig KSU_SUSFS\n\tbool "Enable SUSFS for KernelSU"\n\tdepends on KSU\n\tdefault y\n\thelp\n\t  Enable SUSFS for enhanced root hiding.\n' >> drivers/kernelsu/Kconfig
                printf '\nconfig KSU_SUSFS_HAS_MAGIC_MOUNT\n\tbool "Enable Magic Mount support"\n\tdepends on KSU_SUSFS\n\tdefault y\n' >> drivers/kernelsu/Kconfig
                printf '\nconfig KSU_SUSFS_SUS_PATH\n\tbool "Enable SUS path hiding"\n\tdepends on KSU_SUSFS\n\tdefault y\n' >> drivers/kernelsu/Kconfig
                printf '\nconfig KSU_SUSFS_SUS_MOUNT\n\tbool "Enable SUS mount hiding"\n\tdepends on KSU_SUSFS\n\tdefault y\n' >> drivers/kernelsu/Kconfig
                printf '\nconfig KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT\n\tbool "Auto add KSU default mounts"\n\tdepends on KSU_SUSFS\n\tdefault y\n' >> drivers/kernelsu/Kconfig
                printf '\nconfig KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT\n\tbool "Auto add bind mounts"\n\tdepends on KSU_SUSFS\n\tdefault y\n' >> drivers/kernelsu/Kconfig
                printf '\nconfig KSU_SUSFS_SUS_KSTAT\n\tbool "Enable SUS kstat"\n\tdepends on KSU_SUSFS\n\tdefault y\n' >> drivers/kernelsu/Kconfig
                printf '\nconfig KSU_SUSFS_SUS_OVERLAYFS\n\tbool "Enable SUS overlayfs"\n\tdepends on KSU_SUSFS\n\tdefault y\n' >> drivers/kernelsu/Kconfig
                printf '\nconfig KSU_SUSFS_TRY_UMOUNT\n\tbool "Enable try umount"\n\tdepends on KSU_SUSFS\n\tdefault y\n' >> drivers/kernelsu/Kconfig
                printf '\nconfig KSU_SUSFS_SPOOF_UNAME\n\tbool "Enable uname spoofing"\n\tdepends on KSU_SUSFS\n\tdefault y\n' >> drivers/kernelsu/Kconfig
                printf '\nconfig KSU_SUSFS_ENABLE_LOG\n\tbool "Enable SUSFS logging"\n\tdepends on KSU_SUSFS\n\tdefault y\n' >> drivers/kernelsu/Kconfig
                printf '\nconfig KSU_SUSFS_OPEN_REDIRECT\n\tbool "Enable open redirect"\n\tdepends on KSU_SUSFS\n\tdefault y\n' >> drivers/kernelsu/Kconfig
                
                echo "✓ SUSFS Kconfig options added manually"
              fi
            else
              echo "ERROR: Kconfig not found at drivers/kernelsu/Kconfig"
              ls -la drivers/kernelsu/ 2>/dev/null || echo "drivers/kernelsu/ not found"
            fi
            
            # Verifiziere dass SUSFS Kconfig hinzugefügt wurde
            echo ""
            echo "=== Verifying SUSFS in Kconfig ==="
            if grep -q "SUSFS" drivers/kernelsu/Kconfig 2>/dev/null; then
              echo "✓ SUSFS options found in Kconfig!"
              grep -c "config KSU_SUSFS" drivers/kernelsu/Kconfig
              grep "KSU_SUSFS" drivers/kernelsu/Kconfig | head -10
            else
              echo "⚠ SUSFS not found in Kconfig after all attempts"
            fi
            
            # ============================================
            # SUSFS in KernelSU Kbuild/Makefile integrieren
            # ============================================
            echo ""
            echo "=== Integrating SUSFS into KernelSU build ==="
            
            # Finde Kbuild oder Makefile
            KSU_BUILD=""
            if [ -f "drivers/kernelsu/Kbuild" ]; then
              KSU_BUILD="drivers/kernelsu/Kbuild"
            elif [ -f "drivers/kernelsu/Makefile" ]; then
              KSU_BUILD="drivers/kernelsu/Makefile"
            fi
            
            if [ -n "$KSU_BUILD" ]; then
              # Prüfe ob susfs bereits vorhanden ist
              if ! grep -q "susfs" "$KSU_BUILD"; then
                echo "Adding SUSFS to $KSU_BUILD..."
                
                # Füge SUSFS object files hinzu
                {
                  echo ""
                  echo "# SUSFS Integration"
                  echo "ccflags-\$(CONFIG_KSU_SUSFS) += -DKSU_SUSFS"
                  echo "kernelsu-\$(CONFIG_KSU_SUSFS) += susfs.o"
                } >> "$KSU_BUILD"
                
                # Kopiere susfs.c nach drivers/kernelsu falls nicht vorhanden
                if [ ! -f "drivers/kernelsu/susfs.c" ] && [ -f "fs/susfs.c" ]; then
                  cp fs/susfs.c drivers/kernelsu/susfs.c
                  echo "  ✓ Copied susfs.c to drivers/kernelsu/"
                fi
                
                echo "  ✓ Added SUSFS to $KSU_BUILD"
              else
                echo "SUSFS already in $KSU_BUILD"
              fi
              
              echo ""
              echo "=== Updated $KSU_BUILD (last 20 lines) ==="
              tail -20 "$KSU_BUILD"
              echo "======================================="
            else
              echo "WARNING: Neither Kbuild nor Makefile found in drivers/kernelsu/"
            fi
          else
            echo "WARNING: KSU SUSFS patch not found or drivers/kernelsu missing"
            echo "Searched:"
            echo "  - ${SUSFS_SRC}/KernelSU/10_enable_susfs_for_ksu.patch"
            echo "  - ${SUSFS_SRC}/ksu/10_enable_susfs_for_ksu.patch"
          fi
          
          # ============================================
          # 4. Verification - KEINE defconfig Änderungen!
          # ============================================
          # WICHTIG: Wir ändern die defconfig NICHT!
          # Bazel prüft die defconfig auf Konsistenz.
          # Stattdessen nutzen wir "default y" in der Kconfig.
          
          echo ""
          echo "=== Step 4: Verification ==="
          
          # Prüfe ob SUSFS Kconfig korrekt ist
          if grep -q "KSU_SUSFS" drivers/kernelsu/Kconfig 2>/dev/null; then
            echo "✓ KSU_SUSFS option found in Kconfig"
            echo "  (Using 'default y' in Kconfig - no defconfig changes needed)"
          else
            echo "⚠ KSU_SUSFS option not found in Kconfig - may need manual integration"
          fi
          
          # ============================================
          # Verification
          # ============================================
          echo ""
          echo "============================================"
          echo "SUSFS Installation Summary:"
          echo "============================================"
          echo "  fs/susfs.c: $([ -f fs/susfs.c ] && echo '✓ EXISTS' || echo '✗ MISSING')"
          echo "  include/linux/susfs.h: $([ -f include/linux/susfs.h ] && echo '✓ EXISTS' || echo '✗ MISSING')"
          
          # Prüfe ob SUSFS in KernelSU integriert ist
          echo ""
          echo "  Checking KernelSU SUSFS integration..."
          if grep -rq "susfs" drivers/kernelsu/ 2>/dev/null; then
            echo "  KernelSU SUSFS references: ✓ FOUND"
            grep -r "susfs" drivers/kernelsu/ 2>/dev/null | head -5 | sed 's/^/    /'
          else
            echo "  KernelSU SUSFS references: ⚠ NOT FOUND"
          fi
          
          # Prüfe ob Kernel SUSFS Hooks integriert sind
          echo ""
          echo "  Checking kernel SUSFS hooks..."
          if grep -rq "susfs" fs/ 2>/dev/null; then
            echo "  Kernel fs/ SUSFS: ✓ FOUND"
          else
            echo "  Kernel fs/ SUSFS: ⚠ NOT FOUND (kernel patch may not be applied)"
          fi
          
          # Zeige KernelSU Kconfig SUSFS Optionen
          echo ""
          echo "  Checking Kconfig for SUSFS options..."
          if [ -f "drivers/kernelsu/Kconfig" ]; then
            if grep -q "SUSFS" drivers/kernelsu/Kconfig; then
              echo "  KernelSU Kconfig SUSFS: ✓ FOUND"
              grep "SUSFS" drivers/kernelsu/Kconfig | head -5 | sed 's/^/    /'
            else
              echo "  KernelSU Kconfig SUSFS: ⚠ NOT FOUND"
            fi
          fi
          
          echo "============================================"
          
          # ============================================
          # FINALE GARANTIE: susfs_def.h MUSS existieren!
          # ============================================
          echo ""
          echo "=== Final Header Guarantee ==="
          if [ ! -f "include/linux/susfs_def.h" ]; then
            echo "⚠ susfs_def.h still missing - creating now..."
            printf '/* SPDX-License-Identifier: GPL-2.0 */\n' > include/linux/susfs_def.h
            printf '#ifndef _LINUX_SUSFS_DEF_H\n' >> include/linux/susfs_def.h
            printf '#define _LINUX_SUSFS_DEF_H\n\n' >> include/linux/susfs_def.h
            printf '#include <linux/types.h>\n\n' >> include/linux/susfs_def.h
            printf '#define SUSFS_MAX_LEN_PATHNAME 256\n' >> include/linux/susfs_def.h
            printf '#define SUSFS_MAX_LEN_MNT_TYPE 64\n\n' >> include/linux/susfs_def.h
            printf '#ifdef CONFIG_KSU_SUSFS\n' >> include/linux/susfs_def.h
            printf '#define SUSFS_ENABLED 1\n' >> include/linux/susfs_def.h
            printf '#else\n' >> include/linux/susfs_def.h
            printf '#define SUSFS_ENABLED 0\n' >> include/linux/susfs_def.h
            printf '#endif\n\n' >> include/linux/susfs_def.h
            printf '#endif /* _LINUX_SUSFS_DEF_H */\n' >> include/linux/susfs_def.h
            echo "✓ Created susfs_def.h"
          fi
          
          # Zeige finale Header-Status
          echo ""
          echo "=== Final SUSFS Header Status ==="
          for h in susfs.h susfs_def.h; do
            if [ -f "include/linux/$h" ]; then
              SIZE=$(wc -c < "include/linux/$h")
              echo "✓ include/linux/$h ($SIZE bytes)"
            else
              echo "✗ include/linux/$h MISSING!"
            fi
          done
          
          echo ""
          echo "✓ SUSFS setup complete"

      - name: Apply Additional Patches
        if: inputs.enable_susfs
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          
          # Kernel Source Verzeichnis finden
          if [ -d "common" ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/common"
          elif [ -d "private/gs-google" ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/private/gs-google"
          elif [ -d "aosp" ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/aosp"
          else
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace"
          fi
          
          cd "$KERNEL_DIR"
          
          SUSFS_SRC="$GITHUB_WORKSPACE/kernel_workspace/susfs/kernel_patches"
          
          echo "=== Applying additional patches ==="
          
          # 1. Hide stuff patch (Anti-Detection)
          if [ -f "$SUSFS_SRC/hide_stuff.patch" ]; then
            echo "Applying hide_stuff.patch..."
            git apply "$SUSFS_SRC/hide_stuff.patch" 2>/dev/null || \
            patch -p1 < "$SUSFS_SRC/hide_stuff.patch" 2>/dev/null || \
            echo "  (may already be applied)"
          fi
          
          # ============================================
          # WICHTIG: Bazel prüft die defconfig auf Konsistenz
          # Wir dürfen sie NICHT direkt ändern!
          # Die "default y" Einträge wurden bereits in SUSFS Setup hinzugefügt.
          # ============================================
          echo ""
          echo "=== Verifying SUSFS options in Kconfig ==="
          
          KCONFIG_FILE="drivers/kernelsu/Kconfig"
          
          if [ -f "$KCONFIG_FILE" ]; then
            echo "Found KernelSU Kconfig"
            
            # Prüfe ob SUSFS Optionen vorhanden sind
            if grep -q "KSU_SUSFS" "$KCONFIG_FILE"; then
              echo "✓ SUSFS options found in Kconfig"
              echo ""
              echo "=== Kconfig SUSFS section ==="
              grep -A3 "config KSU_SUSFS" "$KCONFIG_FILE" | head -20
              echo "=============================="
            else
              echo "WARNING: No SUSFS options in Kconfig!"
              echo "The SUSFS KSU patch may not have been applied correctly."
            fi
          else
            echo "WARNING: KernelSU Kconfig not found at $KCONFIG_FILE"
          fi
          
          echo ""
          echo "=== Additional patches complete ==="

      # ============================================
      # KRITISCH: Entferne KSU Optionen aus defconfig
      # Bazel prüft defconfig Konsistenz - wir nutzen Kconfig default y
      # ============================================
      - name: Clean defconfig for Bazel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          
          # Kernel Source Verzeichnis finden
          if [ -d "common" ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/common"
          elif [ -d "private/gs-google" ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/private/gs-google"
          elif [ -d "aosp" ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/aosp"
          else
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace"
          fi
          
          cd "$KERNEL_DIR"
          
          echo "============================================"
          echo "Cleaning defconfig for Bazel compatibility"
          echo "============================================"
          echo ""
          echo "Bazel validates defconfig against savedefconfig."
          echo "Options with 'default y' in Kconfig should NOT be in defconfig."
          echo ""
          
          # Finde alle defconfig Dateien
          for defconfig in arch/arm64/configs/gki_defconfig \
                          arch/arm64/configs/vendor/gki_defconfig; do
            if [ -f "$defconfig" ]; then
              echo "Checking $defconfig..."
              
              # Zeige KSU Einträge vor cleanup
              if grep -q "CONFIG_KSU" "$defconfig"; then
                echo "  Found CONFIG_KSU entries:"
                grep "CONFIG_KSU" "$defconfig" | sed 's/^/    /'
                
                # Entferne alle CONFIG_KSU* Zeilen
                sed -i '/^CONFIG_KSU/d' "$defconfig"
                echo "  ✓ Removed CONFIG_KSU* entries from $defconfig"
              else
                echo "  No CONFIG_KSU entries found"
              fi
            fi
          done
          
          # Entferne auch aus .config falls vorhanden
          if [ -f ".config" ]; then
            if grep -q "CONFIG_KSU" ".config"; then
              sed -i '/^CONFIG_KSU/d' ".config"
              echo "✓ Removed CONFIG_KSU* from .config"
            fi
          fi
          
          echo ""
          echo "✓ defconfig cleanup complete"
          
          # ============================================
          # Entferne doppelte "default y" aus Kconfig
          # ============================================
          echo ""
          echo "=== Removing duplicate 'default y' from Kconfig ==="
          
          KCONFIG_FILE="drivers/kernelsu/Kconfig"
          if [ -f "$KCONFIG_FILE" ]; then
            # Zeige vorher
            echo "Before dedup (default y count):"
            grep -c "default y" "$KCONFIG_FILE" || echo "0"
            
            # Entferne aufeinanderfolgende "default y" Zeilen
            awk '
              /^[[:space:]]*default y[[:space:]]*$/ {
                if (last_was_default) next  # Skip duplicate
                last_was_default = 1
                print
                next
              }
              { last_was_default = 0; print }
            ' "$KCONFIG_FILE" > "$KCONFIG_FILE.dedup"
            mv "$KCONFIG_FILE.dedup" "$KCONFIG_FILE"
            
            # Zeige nachher
            echo "After dedup (default y count):"
            grep -c "default y" "$KCONFIG_FILE" || echo "0"
            
            echo ""
            echo "=== Final Kconfig (first 60 lines) ==="
            head -60 "$KCONFIG_FILE"
            echo "======================================="
          fi

      # ============================================
      # WICHTIG: Version Patch NACH allen anderen Patches!
      # ============================================
      - name: Fix KernelSU Version (Final)
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          
          # Kernel Source Verzeichnis finden
          if [ -d "common" ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/common"
          elif [ -d "private/gs-google" ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/private/gs-google"
          elif [ -d "aosp" ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/aosp"
          else
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace"
          fi
          
          cd "$KERNEL_DIR"
          
          echo "============================================"
          echo "Final KernelSU Version Fix"
          echo "============================================"
          echo "This runs AFTER all patches to ensure version is correct"
          echo ""
          
          # Version aus KernelSU holen (falls noch vorhanden)
          if [ -d "KernelSU" ]; then
            cd KernelSU
            git fetch --tags 2>/dev/null || true
            KSU_VERSION=$(git describe --abbrev=0 --tags 2>/dev/null || echo "v1.0.0")
            KSU_COMMITS=$(git rev-list --count HEAD 2>/dev/null || echo "1")
            cd ..
          else
            # Fallback: Versuche aus dem Workflow Environment
            KSU_VERSION="${KSU_VERSION:-v1.0.0}"
            KSU_COMMITS="${KSU_COMMITS:-1}"
          fi
          
          echo "KernelSU Version: $KSU_VERSION"
          echo "KernelSU Commits: $KSU_COMMITS"
          echo ""
          
          # Finde Kbuild oder Makefile
          KBUILD_FILE=""
          if [ -f "drivers/kernelsu/Kbuild" ]; then
            KBUILD_FILE="drivers/kernelsu/Kbuild"
          elif [ -f "drivers/kernelsu/Makefile" ]; then
            KBUILD_FILE="drivers/kernelsu/Makefile"
          fi
          
          if [ -n "$KBUILD_FILE" ]; then
            echo "Patching $KBUILD_FILE with hardcoded version..."
            
            # Zeige aktuelle Datei (erste 15 Zeilen)
            echo "=== Current $KBUILD_FILE (first 15 lines) ==="
            head -15 "$KBUILD_FILE"
            echo "========================================"
            
            # Prüfe ob bereits gepatcht
            if head -5 "$KBUILD_FILE" | grep -q "Hardcoded by GKI workflow"; then
              echo "Already patched, updating values..."
              # Entferne alte Patch-Zeilen
              sed -i '/# ===================================================/d' "$KBUILD_FILE"
              sed -i '/# KernelSU Version - Hardcoded/d' "$KBUILD_FILE"
              sed -i '/# This bypasses the .git check/d' "$KBUILD_FILE"
              sed -i '/^KSU_GIT_VERSION := [0-9]/d' "$KBUILD_FILE"
              sed -i '/^KSU_GIT_TAG := v/d' "$KBUILD_FILE"
              sed -i '/^KSU_GIT_VERSION_VALID := 1/d' "$KBUILD_FILE"
            fi
            
            # Füge Version am Anfang ein
            {
              echo "# =================================================="
              echo "# KernelSU Version - Hardcoded by GKI workflow"
              echo "# This bypasses the .git check which fails in Bazel sandbox"
              echo "# =================================================="
              echo "KSU_GIT_VERSION := $KSU_COMMITS"
              echo "KSU_GIT_TAG := $KSU_VERSION"
              echo "KSU_GIT_VERSION_VALID := 1"
              echo ""
              cat "$KBUILD_FILE"
            } > "$KBUILD_FILE.new"
            mv "$KBUILD_FILE.new" "$KBUILD_FILE"
            
            echo ""
            echo "=== Patched $KBUILD_FILE (first 20 lines) ==="
            head -20 "$KBUILD_FILE"
            echo "========================================"
          else
            echo "WARNING: Neither Kbuild nor Makefile found at drivers/kernelsu/"
            echo "Contents of drivers/kernelsu/:"
            ls -la drivers/kernelsu/ || echo "drivers/kernelsu not found!"
          fi
          
          echo ""
          echo "✓ KernelSU version fix complete"

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          
          # LTO=thin für schnelleren Build und weniger RAM
          export LTO=thin
          
          echo "Starting kernel build..."
          echo "This may take 30-60 minutes..."
          
          # ============================================
          # KRITISCH: Prüfe dass alle SUSFS Header existieren
          # ============================================
          echo ""
          echo "=== Pre-Build SUSFS Header Check ==="
          KERNEL_DIR="common"
          [ -d "$KERNEL_DIR" ] || KERNEL_DIR="."
          
          for header in susfs.h susfs_def.h; do
            if [ -f "$KERNEL_DIR/include/linux/$header" ]; then
              echo "✓ $header exists"
            else
              echo "✗ $header MISSING - creating emergency header..."
              if [ "$header" = "susfs_def.h" ]; then
                mkdir -p "$KERNEL_DIR/include/linux"
                printf '/* SPDX-License-Identifier: GPL-2.0 */\n' > "$KERNEL_DIR/include/linux/susfs_def.h"
                printf '#ifndef _LINUX_SUSFS_DEF_H\n' >> "$KERNEL_DIR/include/linux/susfs_def.h"
                printf '#define _LINUX_SUSFS_DEF_H\n\n' >> "$KERNEL_DIR/include/linux/susfs_def.h"
                printf '#include <linux/types.h>\n\n' >> "$KERNEL_DIR/include/linux/susfs_def.h"
                printf '#define SUSFS_MAX_LEN_PATHNAME 256\n' >> "$KERNEL_DIR/include/linux/susfs_def.h"
                printf '#define SUSFS_MAX_LEN_MNT_TYPE 64\n\n' >> "$KERNEL_DIR/include/linux/susfs_def.h"
                printf '#ifdef CONFIG_KSU_SUSFS\n' >> "$KERNEL_DIR/include/linux/susfs_def.h"
                printf '#define SUSFS_ENABLED 1\n' >> "$KERNEL_DIR/include/linux/susfs_def.h"
                printf '#else\n' >> "$KERNEL_DIR/include/linux/susfs_def.h"
                printf '#define SUSFS_ENABLED 0\n' >> "$KERNEL_DIR/include/linux/susfs_def.h"
                printf '#endif\n\n' >> "$KERNEL_DIR/include/linux/susfs_def.h"
                printf '#endif /* _LINUX_SUSFS_DEF_H */\n' >> "$KERNEL_DIR/include/linux/susfs_def.h"
                echo "  ✓ Created emergency susfs_def.h"
              fi
            fi
          done
          echo "=================================="
          
          # Zeige aktuelle Konfiguration
          echo ""
          echo "=== Build Configuration ==="
          echo "Checking KernelSU Kconfig for enabled options..."
          if [ -f "common/drivers/kernelsu/Kconfig" ]; then
            echo "KernelSU Kconfig:"
            grep -E "config KSU|default y|bool|tristate" common/drivers/kernelsu/Kconfig | head -30
          fi
          echo "============================"
          echo ""
          
          # Build mit Bazel (neuer Weg für GKI)
          if [ -f "build/build.sh" ]; then
            # Legacy build
            BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh
          elif [ -f "build/kernel/build.sh" ]; then
            # Newer build
            BUILD_CONFIG=common/build.config.gki.aarch64 build/kernel/build.sh
          else
            # Bazel build (neuester Weg)
            tools/bazel run //common:kernel_aarch64_dist -- --dist_dir=dist
          fi
          
          # Nach dem Build: Prüfe ob SUSFS kompiliert wurde
          echo ""
          echo "=== Post-Build Verification ==="
          if [ -f "out/common/fs/susfs.o" ] || find . -name "susfs.o" -type f 2>/dev/null | head -1; then
            echo "✓ SUSFS module compiled (susfs.o found)"
          else
            echo "⚠ SUSFS module may not have been compiled"
          fi
          echo "==============================="

      - name: Prepare Output
        id: output
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          
          mkdir -p $GITHUB_WORKSPACE/output
          
          # Kernel Image finden
          KERNEL_IMAGE=$(find . -name "Image" -type f | head -1)
          KERNEL_IMAGE_GZ=$(find . -name "Image.gz" -type f | head -1)
          KERNEL_IMAGE_LZ4=$(find . -name "Image.lz4" -type f | head -1)
          
          if [ -n "$KERNEL_IMAGE" ]; then
            cp "$KERNEL_IMAGE" $GITHUB_WORKSPACE/output/
            echo "Found: Image"
          fi
          
          if [ -n "$KERNEL_IMAGE_GZ" ]; then
            cp "$KERNEL_IMAGE_GZ" $GITHUB_WORKSPACE/output/
            echo "Found: Image.gz"
          fi
          
          if [ -n "$KERNEL_IMAGE_LZ4" ]; then
            cp "$KERNEL_IMAGE_LZ4" $GITHUB_WORKSPACE/output/
            echo "Found: Image.lz4"
          fi
          
          # AnyKernel3 erstellen
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          
          cd AnyKernel3
          rm -rf .git README.md
          
          # Anpassen
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=auto/g' anykernel.sh
          
          # Kernel kopieren
          if [ -f "$GITHUB_WORKSPACE/output/Image" ]; then
            cp $GITHUB_WORKSPACE/output/Image .
          elif [ -f "$GITHUB_WORKSPACE/output/Image.gz" ]; then
            cp $GITHUB_WORKSPACE/output/Image.gz .
          elif [ -f "$GITHUB_WORKSPACE/output/Image.lz4" ]; then
            cp $GITHUB_WORKSPACE/output/Image.lz4 .
          fi
          
          # ZIP Name
          VARIANT="${{ inputs.kernelsu_variant }}"
          BRANCH="${{ steps.vars.outputs.BRANCH }}"
          DATE=$(date +%Y%m%d)
          
          SUSFS_TAG=""
          if [ "${{ inputs.enable_susfs }}" == "true" ]; then
            SUSFS_TAG="-SUSFS"
          fi
          
          ZIP_NAME="GKI-${BRANCH}-${VARIANT}-${{ steps.release_vars.outputs.SUSFS_TAG }}-${DATE}.zip"
          
          zip -r9 "$GITHUB_WORKSPACE/output/${ZIP_NAME}" *
          
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "✓ Created: ${ZIP_NAME}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ steps.vars.outputs.BRANCH }}-${{ inputs.kernelsu_variant }}
          path: |
            ${{ github.workspace }}/output/*
          if-no-files-found: error

      - name: Prepare Release Variables
        id: release_vars
        run: |
          if [ "${{ inputs.enable_susfs }}" = "true" ]; then
            echo "SUSFS_TEXT=✓ Enabled" >> $GITHUB_OUTPUT
            echo "SUSFS_TAG=+ SUSFS" >> $GITHUB_OUTPUT
          else
            echo "SUSFS_TEXT=✗ Disabled" >> $GITHUB_OUTPUT
            echo "SUSFS_TAG=" >> $GITHUB_OUTPUT
          fi

          if [ "${{ inputs.build_lkm }}" = "true" ]; then
            echo "LKM_TEXT=✓ Yes" >> $GITHUB_OUTPUT
          else
            echo "LKM_TEXT=✗ No (GKI)" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-${{ steps.vars.outputs.BRANCH }}
          name: "GKI ${{ steps.vars.outputs.BRANCH }} - ${{ inputs.kernelsu_variant }} ${{ steps.release_vars.outputs.SUSFS_TAG }}"
          body: |
            ## GKI Kernel Build
            
            | Setting | Value |
            |---------|-------|
            | **KernelSU** | ${{ inputs.kernelsu_variant }} |
            | **Branch** | ${{ steps.vars.outputs.BRANCH }} |
            | **SUSFS** | ${{ steps.release_vars.outputs.SUSFS_TEXT }} |
            | **LKM Mode** | ${{ steps.release_vars.outputs.LKM_TEXT }} |
            | **Build** | #${{ github.run_number }} |
            
            ### Installation
            1. Flash via KernelFlasher oder AnyKernel3
            2. Oder: `fastboot flash boot` mit gepatchtem boot.img
            
            ### Manager Apps
            - Wild KSU: https://github.com/WildKernels/Wild_KSU
            - KernelSU Next: https://github.com/KernelSU-Next/KernelSU-Next
            - SuKiSu: https://github.com/ShirkNeko/SuKiSu
            
            ### SUSFS Module (falls SUSFS aktiviert)
            - https://github.com/sidex15/ksu_module_susfs
          files: ${{ github.workspace }}/output/${{ steps.output.outputs.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
