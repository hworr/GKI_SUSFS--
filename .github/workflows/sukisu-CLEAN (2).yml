name: SukiSU Kernel Build (FINAL CLEAN)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version'
        required: true
        type: choice
        options:
          - '14'
          - '15'
        default: '15'
      kernel_version:
        description: 'Kernel Version'
        required: true
        type: choice
        options:
          - '5.15'
          - '6.1'
          - '6.6'
        default: '6.6'
      os_patch_level:
        description: 'OS Patch Level (YYYY-MM)'
        required: true
        type: string
        default: '2025-09'
      kernelsu_variant:
        description: 'KernelSU Variant'
        required: true
        type: choice
        options:
          - 'SukiSU'
          - 'None'
        default: 'SukiSU'
      kernelsu_branch:
        description: 'KernelSU Branch'
        required: true
        type: choice
        options:
          - 'builtin'
          - 'main'
          - 'Other'
        default: 'builtin'
      kernelsu_branch_other:
        description: 'Custom Branch'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_CPP2: "yes"
      ANDROID_VERSION: ${{ inputs.android_version }}
      KERNEL_VERSION: ${{ inputs.kernel_version }}
      OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
      KERNELSU_VARIANT: ${{ inputs.kernelsu_variant }}
      KERNELSU_BRANCH: ${{ inputs.kernelsu_branch }}
      KERNELSU_BRANCH_OTHER: ${{ inputs.kernelsu_branch_other }}

    steps:
      - name: Set GKI branch
        run: |
          set -e
          BRANCH="android${ANDROID_VERSION}-${KERNEL_VERSION}-${OS_PATCH_LEVEL}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "Using branch: common-$BRANCH"

      - name: Maximize build space
        uses: easimon/maximize-build-space@master

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl python3 ccache clang lld llvm bc bison flex libelf-dev libssl-dev

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-${{ env.OS_PATCH_LEVEL }}
          restore-keys: |
            ccache-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-
            ccache-${{ env.ANDROID_VERSION }}-
            ccache-

      - name: Setup ccache
        run: |
          ccache --max-size=20G
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Init and sync kernel repo
        run: |
          set -e
          mkdir -p "$HOME/bin"
          curl -o "$HOME/bin/repo" https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x "$HOME/bin/repo"
          "$HOME/bin/repo" init -u https://android.googlesource.com/kernel/manifest -b common-${BRANCH} --partial-clone --clone-filter=blob:none
          "$HOME/bin/repo" sync -j$(nproc --all) --fail-fast

      - name: Verify kernel workspace
        run: |
          set -e
          test -d common || { echo "common/ not found"; exit 1; }
          test -d .repo || { echo ".repo/ not found"; exit 1; }
          echo "Kernel workspace OK"

      - name: Remove Baseband-Guard
        working-directory: common
        run: |
          rm -rf security/baseband-guard || true
          sed -i '/baseband_guard/d' security/Kconfig || true
          sed -i '/CONFIG_BBG/d' arch/arm64/configs/gki_defconfig || true

      - name: Clone SUSFS and AnyKernel3
        run: |
          set -e
          SUSFS_BRANCH="gki-android${ANDROID_VERSION}-${KERNEL_VERSION}"
          echo "Attempting to clone SUSFS branch: $SUSFS_BRANCH"
          if ! git clone https://github.com/ShirkNeko/susfs4ksu.git -b "$SUSFS_BRANCH" 2>/dev/null; then
            echo "Branch $SUSFS_BRANCH not found, trying alternatives"
            SUSFS_BRANCH_ALT="gki-${ANDROID_VERSION}-${KERNEL_VERSION}"
            if ! git clone https://github.com/ShirkNeko/susfs4ksu.git -b "$SUSFS_BRANCH_ALT" 2>/dev/null; then
              echo "Using default branch"
              git clone https://github.com/ShirkNeko/susfs4ksu.git
            fi
          fi
          git clone https://github.com/MiRinChan/AnyKernel3.git

      - name: Determine KernelSU branch
        run: |
          if [[ "${KERNELSU_VARIANT}" == "SukiSU" ]]; then
            if [[ "${KERNELSU_BRANCH}" == "Other" ]]; then
              echo "KSU_BRANCH=${KERNELSU_BRANCH_OTHER}" >> $GITHUB_ENV
            else
              echo "KSU_BRANCH=builtin" >> $GITHUB_ENV
            fi
          fi

      - name: Add SukiSU
        if: env.KERNELSU_VARIANT == 'SukiSU'
        run: |
          curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s "${KSU_BRANCH}"

      - name: Remove KernelSU allowlist
        working-directory: common
        run: |
          set -e
          echo "Searching for allowlist files"
          find drivers/kernelsu -name "*allowlist*" -o -name "*profile*" 2>/dev/null || true
          echo "Removing allowlist files"
          rm -f drivers/kernelsu/allowlist.c
          rm -f drivers/kernelsu/app_profile.c
          rm -f drivers/kernelsu/allowlist.h
          rm -f drivers/kernelsu/app_profile.h
          find drivers/kernelsu -type f -name "*allowlist*" -delete 2>/dev/null || true
          find drivers/kernelsu -type f -name "*profile*" -delete 2>/dev/null || true
          echo "Allowlist removed"

      - name: Apply SUSFS patch
        working-directory: common
        run: |
          set -e
          PATCH_DIR="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches"
          if [ -f "$PATCH_DIR/50_add_susfs_in_gki-android15-6.6.patch" ]; then
            PATCH="$PATCH_DIR/50_add_susfs_in_gki-android15-6.6.patch"
          elif [ -f "$PATCH_DIR/50_add_susfs_in_gki-15-6.6.patch" ]; then
            PATCH="$PATCH_DIR/50_add_susfs_in_gki-15-6.6.patch"
          else
            PATCH=$(find "$PATCH_DIR" -name "*6.6*.patch" | head -1)
            if [ -z "$PATCH" ]; then
              echo "No SUSFS patch found"
              exit 0
            fi
          fi
          echo "Applying SUSFS patch: $PATCH"
          if patch -p1 < "$PATCH"; then
            echo "Patch applied"
          else
            echo "Some hunks failed, cleaning rejects"
            find . -name "*.rej" -delete 2>/dev/null || true
          fi

      - name: Copy SUSFS files
        run: |
          set -e
          echo "Checking SUSFS structure"
          ls -la susfs4ksu/kernel_patches/ || true
          echo "Copying SUSFS source"
          if [ -d "susfs4ksu/kernel_patches/fs/susfs" ]; then
            cp -rv susfs4ksu/kernel_patches/fs/susfs common/fs/
            echo "Copied SUSFS source"
          else
            echo "WARNING: SUSFS source not found"
            find susfs4ksu -type d -name susfs
          fi
          echo "Copying SUSFS headers"
          if [ -d "susfs4ksu/kernel_patches/include/linux" ]; then
            cp -v susfs4ksu/kernel_patches/include/linux/susfs.h common/include/linux/ 2>/dev/null || true
            echo "Copied headers"
          else
            echo "WARNING: SUSFS headers not found"
            find susfs4ksu -type f -name "susfs.h"
          fi
          echo "Verifying SUSFS files"
          if [ ! -d "common/fs/susfs" ]; then
            echo "ERROR: common/fs/susfs not created"
            exit 1
          fi
          if [ ! -f "common/include/linux/susfs.h" ]; then
            echo "ERROR: susfs.h not found"
            exit 1
          fi
          echo "SUSFS files copied successfully"

      - name: Patch gki_defconfig
        working-directory: common
        run: |
          set -e
          DEFCONFIG=arch/arm64/configs/gki_defconfig
          sed -i '/^CONFIG_KSU/d' "$DEFCONFIG"
          sed -i '/^CONFIG_SUSFS/d' "$DEFCONFIG"
          sed -i '/^CONFIG_USB_GADGET/d' "$DEFCONFIG"
          sed -i '/^CONFIG_TCP_CONG_BBR/d' "$DEFCONFIG"
          cat >> "$DEFCONFIG" << 'EOF'
          
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_KPROBES_HOOK=n
          CONFIG_SUSFS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_SUSFS_PROC=y
          CONFIG_SUSFS_MAGIC_MOUNT=y
          CONFIG_SUSFS_AUTO_BIND=y
          CONFIG_SUSFS_SUS_PATH=y
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_NET_DRIVERS=y
          CONFIG_USB_RNDIS_HOST=m
          CONFIG_USB_NET_CDC_ECM=m
          CONFIG_USB_NET_CDC_NCM=m
          CONFIG_USB_HID=m
          CONFIG_USB_HIDDEV=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_DEFAULT_BBR=y
          EOF
          echo "Defconfig patched"

      - name: Disable defconfig validation
        working-directory: common
        run: |
          sed -i 's/POST_DEFCONFIG_CMDS=.*/POST_DEFCONFIG_CMDS=""/g' build.config.gki.aarch64 || true
          sed -i 's/PRE_DEFCONFIG_CMDS=.*/PRE_DEFCONFIG_CMDS=""/g' build.config.gki.aarch64 || true
          echo "Validation disabled"

      - name: Pre-sort defconfig for Bazel
        working-directory: common
        run: |
          set -e
          echo "Pre-sorting defconfig"
          make ARCH=arm64 gki_defconfig
          make ARCH=arm64 savedefconfig
          cp defconfig arch/arm64/configs/gki_defconfig
          echo "Defconfig pre-sorted"

      - name: Clean kernel tree for Bazel
        working-directory: common
        run: |
          make mrproper
          echo "Kernel tree cleaned"

      - name: Build kernel with Bazel
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 90
          max_attempts: 2
          retry_on: timeout
          command: |
            cd "$GITHUB_WORKSPACE"
            ( while sleep 300; do echo "[keepalive] $(date -u)"; done ) &
            KEEPALIVE_PID=$!
            trap "kill $KEEPALIVE_PID 2>/dev/null || true" EXIT
            sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64 || true
            sed -i 's/BUILD_KSELFTESTS=.*/BUILD_KSELFTESTS=0/' common/build.config.gki.aarch64 || true
            sed -i 's/BUILD_GKI_CERTIFICATION_TOOLS=.*/BUILD_GKI_CERTIFICATION_TOOLS=0/' common/build.config.gki.aarch64 || true
            sed -i '/MODULES_ORDER/d' common/build.config.gki.aarch64 || true
            sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' common/build.config.gki.aarch64 || true
            export CC="/usr/bin/ccache clang"
            export HOSTCC="/usr/bin/ccache clang"
            export LTO=thin
            tools/bazel build \
              --jobs=2 \
              --local_ram_resources=6144 \
              --local_cpu_resources=2 \
              --spawn_strategy=local \
              --config=fast \
              --config=stamp \
              --action_env=CC="$CC" \
              --action_env=HOSTCC="$HOSTCC" \
              //common:kernel_aarch64_dist

      - name: Show ccache stats
        run: ccache --show-stats

      - name: Package AnyKernel3
        run: |
          set -e
          IMG=$(find bazel-bin -name Image 2>/dev/null | head -1)
          if [ ! -f "$IMG" ]; then
            IMG=$(find out -name Image 2>/dev/null | head -1)
          fi
          test -f "$IMG" || { echo "ERROR: Image not found"; exit 1; }
          echo "Using: $IMG"
          cp "$IMG" AnyKernel3/Image
          mkdir -p AnyKernel3/modules/vendor/lib/modules
          find bazel-bin out -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \; 2>/dev/null || true
          cd AnyKernel3
          zip -r ../kernel.zip .
          echo "Packaged"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: kernel.zip

      - name: Save ccache
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-${{ env.OS_PATCH_LEVEL }}-${{ github.run_id }}
